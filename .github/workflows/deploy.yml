# SPDX-License-Identifier: GPL-3.0-only
# Deploys ActiveOn to Cloudflare Workers (static assets, SPA mode) on every push to main.
# Runs in the GitHub "production" environment, which should only allow the main branch.
# Needs, in that environment:
#   secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_GOOGLE_OAUTH_CLIENT_SECRET
#   vars     VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_DATABASE_URL,
#            VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET, VITE_GOOGLE_OAUTH_CLIENT_ID
# Without the VITE_* values the site deploys with the paste fallback only. See docs/setup/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ActiveOn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: packages/toolbox-parsers/vendor/data
          key: toolbox-data-${{ hashFiles('packages/toolbox-parsers/UPSTREAM') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
      - name: Deploy to Cloudflare Workers
        working-directory: apps/activeon
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
