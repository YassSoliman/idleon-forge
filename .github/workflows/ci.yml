# SPDX-License-Identifier: GPL-3.0-only
# Lint, typecheck, test and build, plus the write-call tripwire and the bundle budgets (M12 TR-1,
# TR-12, TR-14). The job name "Lint, typecheck, test, build" is a required check (ruleset main-checks):
# never rename it without updating scripts/repo-settings.sh in the same PR.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: BuildInfo and whats-new.json read first-parent main (TR-3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Toolbox's game data, per pin. fetch-data.sh checks a restored copy against UPSTREAM dataDigest=.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/toolbox-parsers/vendor/data
          key: toolbox-data-${{ hashFiles('packages/toolbox-parsers/UPSTREAM') }}
      # Parsed fixtures and Toolbox's patch notes at the pin (M11 TR-16), keyed by what changes a parse.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/kb-tools/.cache
          key: kb-${{ hashFiles('packages/toolbox-parsers/UPSTREAM', 'packages/account-state/src/**', 'packages/account-state/fixtures/public/*.json', 'fixtures/scrubbed/*.json', 'packages/kb-tools/src/parse.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # M11 TR-16: generated facts are current, kb check --strict, goldens with the Verdict changes
      # in the job summary, then the privacy gates.
      - name: Knowledge Base
        run: |
          pnpm kb generate --check
          pnpm kb check --strict
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}"
          pnpm kb golden --diff-base FETCH_HEAD
      # Scrubbed fixtures and goldens: only pseudonyms where names were, no guild id or uid-shaped
      # string, reviewed serverVars only, a current policy hash and a consent link. KB_DENYLIST
      # (optional, one name per line) adds the name grep; without it the structural gates still run.
      - name: Privacy gate
        run: pnpm kb privacy
        env:
          KB_DENYLIST: ${{ secrets.KB_DENYLIST }}
      - run: pnpm build
      - name: Write-call tripwire (TR-14)
        run: node packages/toolbox-parsers/scripts/tripwire.mjs
      - name: Budgets (TR-12)
        run: node packages/release/bin/check-budgets.ts apps/activeon/dist
