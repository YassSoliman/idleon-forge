# SPDX-License-Identifier: GPL-3.0-only
# The PR title is a Conventional Commit, and the optional What's-new: line fits in 120 characters
# (M12 FR-25, FR-29, TR-1). A feat or fix with no What's-new: line gets a warning, never a failure (D2).
# The job name "PR title" is a required check. Title and body reach the script only through env:.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the check itself is needed; no install, no repository scripts beyond it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            packages/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node packages/release/bin/pr-title.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
