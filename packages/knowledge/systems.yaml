# SPDX-License-Identifier: GPL-3.0-only
# The System registry (M11 TR-9, FR-24): every System in the MVP coverage (W1–W3 plus the W4 entry,
# and the cross-cutting ones). `coverage()` lists the unlocked ones with no active or contested
# authored entry under "Not covered yet". `unlocked` is a first cut by world (worlds/reached) until
# a System's owner module ships a sharper unlock Detector (for example M6's Post Office unlock).
# M26 FR-6: `systems/unlocked` keys a System on its own unlock fact (packages/knowledge/src/unlock.ts),
# currentWorld only as the fallback; the engine silences that System's Goals while it reads 'no'.
# M17 TR-8: `kind: activeon` marks ActiveOn's own concepts (no Systems hub tile; default `game`), and
# `unlockFact` names the fact table that says how a game System opens (systems/systems.facts.yaml).
