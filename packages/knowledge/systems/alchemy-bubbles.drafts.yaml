  - id: alchemy-bubbles.check.luck-odd
    system: alchemy-bubbles
    type: check
    title: Finish Luck to an odd level
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector:
      id: alchemy-bubbles/luck-odd
    text: Brew {cauldron:name}'s Luck Boost to level {next:int} ({brew:int} brew)
    why: "Luck only raises new-bubble odds on odd levels: level {level:int} added nothing over the one before, and level {next:int} lifts the odds to x{factor}."
    doneWhen:
      field: account.alchemy.cauldrons[*].boosts.luck.level
      change: higher
    appliesTo:
      stages:
        - from: W2-mid
          to: W4-entry
    confidence: M
    status: draft
    notes: "Math H: factor round(10*(1+0.05L))/10 steps on odd levels only (Toolbox L660-661, wiki agrees). Advice M: only while the cauldron still has W1-W4 bubbles to roll and the next level costs no more than one roll. Whether Luck is worth levelling at all is Disputed ('Luck and Cost later', gameslikefinder) so this never says start Luck."
    sources:
