    why: That costs less brew than one new-bubble roll ({roll:int} brew at {odds:pct} odds), and every Speed level adds 5% to all the brew this cauldron makes from now on.
    doneWhen:
      field: account.alchemy.cauldrons[*].boosts.speed.level
      change: higher
    appliesTo:
      stages:
        - from: W2-mid
          to: W4-entry
    confidence: M
    status: draft
