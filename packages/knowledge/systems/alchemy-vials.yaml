# M6 Unspent & idle: unused daily vial attempts (M6 FR-9, TR-6, D5).
system: alchemy-vials
entries:
  - id: alchemy-vials.check.daily-attempts
    system: alchemy-vials
    type: check
    title: Use your vial attempts
    subject: account
    effect: next-action
    usesExpectedReturn: true
    category: spendable
    priority: { frame: by-urgency }
    effortSeconds: 60
    detector: { id: alchemy-vials/attempts }
    text: "Use your {attempts:int} vial attempts on the W2 town cauldron"
    why: "Vial attempts refill at the daily reset and don't bank, and you hold the ingredient of a vial you haven't unlocked yet."
    doneWhen: { field: "account.alchemy.vialAttempts.current", change: lower }
    appliesTo: { stages: [{ from: W2-early, to: W4-entry }] }
    confidence: H
    status: active
    sources:
