# SPDX-License-Identifier: GPL-3.0-only
# M3 AFK Safety: Refinery fuel (docs/specs/M3-afk-safety.md FR-26). A Next Action: more fuel means
# farming or printing, not a quick fix.
# M6 Unspent & idle: a salt unlocked but switched off (M6 FR-31, D6). One Check, two forms.
system: refinery
entries:
  - id: refinery.check.fuel-runs-out
    system: refinery
    type: check
    title: Refinery runs dry
    text: "Refinery runs dry in about {dryIn:duration}: top up the salt's materials"
    why: An active salt stops refining when its materials run out, and nothing refines until you're back.
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts
        title: IdleOn Toolbox, getSaltMatsTimeLeft
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Construction#Refinery", title: "IdleOn Wiki: Construction, Refinery", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: account
    effect: next-action
    category: nice
    usesExpectedReturn: true
    detector: { id: refinery/fuel-runs-out }
  - id: refinery.check.salt-off
    system: refinery
    type: check
    title: Switch on a Refinery salt
    subject: account
    effect: next-action
    category: compounding
    priority: { frame: by-urgency }
    effortSeconds: 30
    detector: { id: refinery/salt-off, params: { form: switch-on } }
    text: "Switch on {salt:name} in the Refinery"
    why: "An unlocked salt that is switched off makes no power while you're away. Salts off: {offSalts:int}."
    doneWhen: { field: "account.salts[*].active", becomes: true }
    appliesTo: { stages: [{ from: W3-early, to: W4-entry }] }
    confidence: H
    status: active
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts#L101", title: "Toolbox hasMissingMats", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/research/w3-systems/docs/research/systems/w3-systems/construction.md", title: "W3 dossier: Refinery", tier: 4, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Construction#Refinery", title: "IdleOn Wiki: Construction, Refinery", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
  - id: refinery.check.salt-fuel
    system: refinery
    type: check
    title: Get the fuel to run a Refinery salt
    subject: account
    effect: next-action
    category: compounding
    priority: { frame: by-urgency }
    effortSeconds: 30
    detector: { id: refinery/salt-off, params: { form: fuel } }
    text: "Get {more:int} more {material:name} to run {salt:name}"
    why: "An unlocked salt that is switched off makes no power while you're away, and it can't run without its fuel. Salts off: {offSalts:int}. The Death Note's first level is paid in Explosive Salts."
    doneWhen: { field: "account.salts[*].active", becomes: true }
    appliesTo: { stages: [{ from: W3-early, to: W4-entry }] }
    confidence: H
    status: active
    notes: "The same Check as salt-off when the first off salt is short of fuel (FR-31). Amounts are Toolbox's quantity x floor(rank^1.5) against totalAmount."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts#L101", title: "Toolbox hasMissingMats", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/research/w3-systems/docs/research/systems/w3-systems/construction.md", title: "W3 dossier: Refinery", tier: 4, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Construction#Refinery", title: "IdleOn Wiki: Construction, Refinery", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
  # ---- M15 F1 Refinery set-up (docs/specs/M15-account-depth.md FR-1 to FR-6) ----
  - id: refinery.check.auto-refine-off
    system: refinery
    type: check
    title: Let a Refinery salt rank up
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 10
    detector: { id: refinery/auto-refine }
    text: "Turn Auto Refine off on {salt:name}, then refine it only when its bar is full"
    why: "Only a full bar refined by hand ranks a salt up; Auto Refine empties the bar each cycle, so it stays at rank {rank:int}. Refinery, left of the Construction Table in Frostbite Tundra: seconds; the bar fills in about {fullIn:duration}."
    values:
      note: "Before a long AFK Stretch, refine a full bar so the stretch has the whole bar to fill."
    doneWhen: { field: "account.refinery.salts[*].autoRefine", becomes: false }
    appliesTo: { stages: [{ from: W3-early, to: W4-entry }] }
    confidence: H
    status: active
    notes: "Never says turn Auto Refine on (M15 D-2). Reads Toolbox saltMaxSafeRank, not the printer-capped maxSafeRank (red-team #1). Game code (N.js, game 2.3.540): @7640085 the only rank-up is a manual Refine at power >= PowerCAP; @7727530 the auto pass sets power to 0 and leaves the rank; @7656133 away time fills at most the room left in the bar."
    sources:
      - { url: "https://idleon.wiki/wiki/Changelog/2025", title: "IdleOn Wiki: Changelog/2025 (v2.41: Auto Refine refines whenever it has any Power)", tier: 2, claimDate: 2025-07-06, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Construction", title: "IdleOn Wiki: Construction (Refinery: refine a full bar, rank efficiency)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts", title: "Calculated by IdleOn Toolbox (getSaltsBalance, calcTimeToRankUp)", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
  - id: refinery.check.refine-full
    system: refinery
    type: check
    title: Refine a full Refinery bar
    subject: account
    effect: next-action
    category: compounding
    priority: { frame: by-urgency }
    effortSeconds: 10
    detector: { id: refinery/full-bar }
    text: "Refine {salt:name} now: its bar is full, so it has stopped making salt"
    why: "With Auto Refine off, a full bar stops the salt until you refine it, and refining a full bar ranks it up. In the Refinery, left of the Construction Table in Frostbite Tundra town. Salts with a full bar: {salts:int}."
    doneWhen: { field: "account.refinery.salts[*].rank", change: higher }
    notes: "Full is the game's rank-up test power >= PowerCAP (N.js @7640085), not Toolbox's looser alert rule (red-team #21)."
    appliesTo: { stages: [{ from: W3-early, to: W4-entry }] }
    confidence: H
    status: active
    sources:
      - { url: "https://idleon.wiki/wiki/Construction", title: "IdleOn Wiki: Construction (Refinery: a full power bar can be refined)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
  - id: refinery.check.unlock-next
    system: refinery
    type: check
    title: Unlock the next Refinery salt
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector: { id: refinery/unlock-next }
    text: "Unlock {salt:name} in the Refinery (costs {cost:int} {material:name}; you have {held:int} in storage)"
    why: "A new salt starts making power, and the next buildings are paid in it. The cost comes out of your storage chest, not the Refinery's own storage. In the Refinery, left of the Construction Table in Frostbite Tundra town."
    doneWhen: { field: "account.refinery.salts[*].unlocked", becomes: true }
    appliesTo: { stages: [{ from: W3-early, to: W4-entry }] }
    confidence: H
    status: active
    notes: "Never fires while a built-and-waiting building is paid in the cost salt (M15 FR-10, D-1). The unlock is paid from the storage chest only (N.js @7643805, _JustStorageOWNED)."
    sources:
      - { url: "https://idleon.wiki/wiki/Construction", title: "IdleOn Wiki: Construction (Refinery salt unlock costs)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
