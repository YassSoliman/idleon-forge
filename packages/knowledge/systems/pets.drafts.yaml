  - id: pets.check.token-wiped
    system: pets
    type: check
    title: Your token pets are not active
    subject: account
    effect: next-action
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: pets/token-wiped
    text: Re-pick your Pet Bonus Token pets
    why: Your token list names more pets than you have tokens, and since 2.3.540 the game clears such a list, so none of them give a bonus.
    doneWhen:
      field: account.pets.tokens.rawListLength
      change: lower
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: "Rule: split(',').length of OLA[606] > 0.5 + tokensOwned (game Every5secs, quoted in Toolbox). Needs the new rawListLength field because Toolbox discards a wiped list."
