  - id: pets.check.recycle-duplicate
    system: pets
    type: check
    title: Recycle spare pet copies
    subject: account
    effect: next-action
    category: nice
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: pets/recycle-duplicate
    text: Recycle {copies:int} spare {pet} for {crystals:int} Pet Crystals
    why: A pet's bonus needs only one copy; spare tradable copies turn into crystals for your Spend Plan. Keep at least one copy, and keep your Pet+ copy.
    doneWhen:
      field: account.pets.crystals
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Bonus is binary on owned (H, misc.ts#L1500); recycle value = filler (H); only tradable copies recycle (M); 'only one copy counts in battle' and 'last copy removes the bonus' are wiki (L). Free-pull pets recycle for 0 (wiki, L): the detector requires filler > 0 and tradable, which should exclude them."
    sources:
