  - id: pets.check.token-dead
    system: pets
    type: check
    title: Your token is on King Doot
    subject: account
    effect: next-action
    category: nice
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: pets/token-dead
    text: Move your Pet Bonus Token off King Doot
    why: King Doot does nothing until a character has Divinity level 2 (World 5), so this token gives you no bonus yet.
    doneWhen:
      field: account.pets.tokens.used
      change: changed
    appliesTo:
      stages:
        - from: W1-early
          to: W4-late
    confidence: M
    status: draft
    notes: Gate is H in code (active character's Lv0[14] < 2); M because Toolbox reads the active character, and whether a token can be moved freely is prior research (L). Community token players favoured King Doot (Reddit 1uc0az9, 2026-06-21, pre-patch).
    sources:
