# SPDX-License-Identifier: GPL-3.0-only
# M14 3D Printer Parallel Slot Plan (FR-25 to FR-30, Phase 1): what each character should print for the
# account's Demand, which sample to take and where, and the printer-bonus reset that sampling causes.
system: printer
entries:
  - id: printer.check.slot-plan
    system: printer
    type: check
    title: 3D Printer samples
    subject: account
    effect: next-action
    category: compounding
    detector: { id: printer/slot-plan }
    text: "{step}"
    why: "{reason}"
    values:
      # The fact tables the Walkthrough and this plan read (named here so they ship with the bundle).
      factMaps: maps.fact.maps
      factSkillNodes: skills.fact.nodes
      factRecipeTabs: anvil.fact.recipe-tabs
      factPresetFit: walkthrough.fact.preset-fit
      # The anvil tab items a tab gate expands into (FR-4).
      anvilTab2: items.acquisition.equipment-smithing-tabs2
      anvilTab3: items.acquisition.equipment-smithing-tabs3
      anvilTab4: items.acquisition.equipment-smithing-tabs4
      # Judgment (FR-27a): a sample is offered past this printer-bonus loss only for the Bottleneck.
      maxResetLoss: 0.1
      # Steps are at most 12 words (kb check step-words); the how-to and the numbers go in the why.
      take-sample: "Take a {item} sample at {map} on the {who}"
      why-take-how: "Put Printer Sampling on the attack bar and use it, set the new {item} sample active{replaces}, then go back."
      replaces: " in place of {old}"
      swap: "Set the {who}'s active sample to {item} in the 3D Printer"
      why-take: "{item} is in your Walkthrough Demand ({missing:int} still needed) and no stored sample covers it. The {who} samples best there. The sample size shows in the printer once taken."
      why-swap: "{item} is in your Walkthrough Demand ({missing:int} still needed); it is stored, about {perHour:int}/h, and swapping between stored samples resets nothing."
      reset-loss: "Taking a sample resets the printer bonus: all printing x{now} to x{after}."
      reset-none: "This account's printer bonus doesn't drop when a sample is taken."
      covered: "{item} is covered: keep this sample"
      # M26 FR-C11: the Production Plan's printer row when M14's plan changes nothing on a character.
      row-keep: "Printer: keep {item} in both slots"
      row-keep-one: "Printer: keep {item} in its slot"
      row-keep-mixed: "Printer: keep {items}"
      chip-keep: "keep"
      no-slot: "3D Printer Lv {level:int}: {printing:int} of {characters:int} characters can print"
      no-slot-why: "Construction raises the printer's level."
      no-talent: "Printer Sampling (Star Talent tab 2) is at 0 on the {who}"
    appliesTo: { stages: all }
    confidence: M
    status: active
    sources:
      - { url: "https://idleon.wiki/wiki/3D_Printer", title: "IdleOn Wiki: 3D Printer (sampling, slots, bonus reset)", tier: 2, claimDate: 2026-10-14, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/printer.ts", title: "Toolbox getPrinter, getPrinterMulti", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
    notes: "M14 engine step (TR-5 printerPlan). Demand-driven only (R-Q7): with no Demand item it keeps every sample. The bonus loss is Toolbox getPrinterMulti called twice (TR-7)."
