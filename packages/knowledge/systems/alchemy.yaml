# M3 AFK Safety: cauldron assignment and liquids at cap (docs/specs/M3-afk-safety.md FR-22, FR-25).
system: alchemy
entries:
  - id: alchemy.check.cauldron-unassigned
    system: alchemy
    type: check
    title: Not brewing
    text: "Assign this character to a cauldron before you leave"
    values: { timelineKind: time-cap, timelineWhat: "unassigned cauldron" }
    why: A character assigned to no cauldron adds no brewing while you're away.
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/alchemy.ts
        title: IdleOn Toolbox, alchemy activities
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Alchemy#Brewing", title: "IdleOn Wiki: Alchemy, brewing", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: character
    effect: blocker
    detector: { id: alchemy/cauldron-unassigned }

  - id: alchemy.check.liquid-cap
    system: alchemy
    type: check
    title: Water at cap
    text: "Spend Water on bubbles, vials or the Liquid Shop"
    values: { timelineKind: storage, timelineWhat: "Water" }
    why: "Water is at cap ({current:int} of {max:int}), and your saves show it takes {refill:duration} to refill, longer than your return. A liquid stops regenerating at its cap, so leaving it full loses Water for the whole return."
    notes: "M3 Final rulings R-PILL-2 (owner, 2026-10-17): blocks only when the player's own save history shows Water refilling slower than the Expected Return. Without history it never blocks; alchemy.check.liquid-cap-line shows instead."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/alchemy.ts
        title: IdleOn Toolbox, alchemy liquids and liquidCauldrons maxLiquid
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Alchemy#Liquids", title: "IdleOn Wiki: Alchemy, liquids", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: account
    effect: blocker
    usesExpectedReturn: true
    detector: { id: alchemy/liquid-cap, params: { part: slow } }

  - id: alchemy.check.liquid-cap-line
    system: alchemy
    type: check
    title: Water at cap
    text: "Spend Water on bubbles, vials or the Liquid Shop"
    values: { timelineKind: storage, timelineWhat: "Water" }
    why: "Water is at cap ({current:int} of {max:int}). A liquid stops regenerating at its cap. Spending some lets it refill while you're away; at most one bar's worth is lost, so it doesn't stop you logging off."
    notes: "M3 Final rulings R-PILL-2 (owner, 2026-10-17): the ordinary account line for Water at cap, never a blocker. The blocker alchemy.check.liquid-cap replaces it only when save history shows a refill slower than the return."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/alchemy.ts
        title: IdleOn Toolbox, alchemy liquids and liquidCauldrons maxLiquid
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Alchemy#Liquids", title: "IdleOn Wiki: Alchemy, liquids", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: account
    effect: next-action
    category: spendable
    usesExpectedReturn: true
    detector: { id: alchemy/liquid-cap, params: { part: line } }

  # ---- M20 F2 (docs/specs/M20-skills-parallel-slots.md FR-27, FR-28, D-13): an idle liquid.
  - id: alchemy.check.liquid-unstaffed
    system: alchemy
    type: check
    title: An idle liquid
    text: "{text}"
    why: "{why}"
    values:
      text: "Move your {who} from the {from} cauldron to {liquid}"
      why: "{liquid} is at {current} of {max:int} with nobody on it; a liquid seat speeds it up and earns that character 2x Alchemy EXP, and the {from} cauldron keeps its other brewer."
      short: "move your {who} to {liquid} ({current} of {max:int})"
    sources:
      - { url: "https://idleon.wiki/wiki/Alchemy", title: "IdleOn Wiki: Alchemy (liquids, 2x Alchemy EXP on a liquid)", tier: 2, claimDate: 2026-10-05, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/alchemy.ts", title: "IdleOn Toolbox, alchemy activities and liquids", tier: 1, verified: 2026-10-18, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: M
    status: active
    subject: account
    effect: next-action
    category: nice
    effortSeconds: 30
    detector: { id: alchemy/liquid-unstaffed }
    notes: "FR-27: an unlocked liquid below half its cap with nobody on it, while a bubble cauldron has 2 or more brewers. It moves the lowest-Alchemy brewer that holds no alchemy Role, from the cauldrons with the most brewers; at most one liquid per run. M19 replaces it (X6)."
