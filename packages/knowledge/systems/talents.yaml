      - { talent: "STONKS!", page: 1, target: 30, core: true }
      - { talent: "WILL_OF_THE_ELDEST", page: 1, target: { cap: "best-level-tenth" } }
      - { talent: "BEGINNER_BEST_CLASS", page: 1, target: { cap: "best-beginner-tenth" } }
