# SPDX-License-Identifier: GPL-3.0-only
# M9 Builds (docs/specs/M9-builds.md): the role-keyed Builds (TR-5) and the talent Checks (TR-8).
# Builds are authored judgment transcribed from dated community builds; every talent reference is a
# Toolbox rawName checked against generated talent data. Only the Idle fighting talent to 50 and the
# served skill's skill attack are `core`; only accuracy-stat steps are `hardCap` (TR-5).
system: talents
entries:
  - id: talents.check.next-step
    system: talents
    type: check
    title: Next talent points
    text: "Next talent points: {talent} to {target:int}"
    values:
      text-on-other: "Next talent points: {talent} to {target:int} on your {preset} preset"
      goal: Talents
      unit: steps of the build
    why: "{talent} is at {current:int}: the first open step of the {build} for this preset."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/talents.ts", title: "IdleOn Toolbox, talent levels per preset", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Tips_and_Tricks", title: "IdleOn Wiki: Tips and Tricks (one preset for fighting, one for skilling)", tier: 2, claimDate: 2025-12-24, verified: 2026-10-17, gameVersion: 2.0.48 }
    appliesTo: { stages: all }
    confidence: L
    status: active
    subject: character
    effect: next-action
    category: compounding
    detector: { id: builds/next-step }
    notes: The Build entry's own dated Sources are added to each Next Action at run time. Core steps rank at position 3 only while that tab's lower bound of unspent points is above 0 (Final rulings RT1).

  - id: talents.check.attack-bar
    system: talents
    type: check
    title: Attacks missing from the bar
    text: "Put your attacks on the bar before you leave: {missing}"
    values:
      text-none-levelled: "Level an attack and put it on the bar"
      text-one-attack: "Put more attacks on the bar: only one is on it, and {missing} are levelled on this preset"
      goal: Talents
    why: "Attacks add to AFK damage only while they are on the bar. Buffs such as Firmly Grasp It and Printer Sampling don't count."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts", title: "IdleOn Toolbox, getTalentEffectOnKills (AFK attacks on the bar)", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Tips_and_Tricks", title: "IdleOn Wiki: Tips and Tricks (attacks on the hotbar affect offline gains)", tier: 2, claimDate: 2025-12-24, verified: 2026-10-17, gameVersion: 2.0.48 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: character
    effect: blocker
    detector: { id: builds/attack-bar }
    notes: D1. A blocker at 0 attacks with a levelled attack on the preset (quick, fillable, holds the stretch); the 1-attack and none-levelled cases are Goals the M9 module emits from the same entry's text variants.

  - id: talents.check.skill-attack
    system: talents
    type: check
    title: Skill attack missing from the bar
    text: "Put {talent} on the bar: it only helps {skill} while it is there"
    values: { goal: Talents }
    why: "A skill attack boosts its skill's AFK gains from the attack bar, like a fighting attack does for kills."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/talents.json", title: "IdleOn Toolbox game data: talents (AFKactivity)", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Tips_and_Tricks", title: "IdleOn Wiki: Tips and Tricks (attacks on the hotbar affect offline gains)", tier: 2, claimDate: 2025-12-24, verified: 2026-10-17, gameVersion: 2.0.48 }
    appliesTo: { stages: all }
    confidence: M
    status: active
    subject: character
    effect: next-action
    category: compounding
    detector: { id: builds/skill-attack }
    notes: The on-bar effect is read from game data (AFKactivity); confirming it in N.js is still open (spec TR-10), hence confidence M.

