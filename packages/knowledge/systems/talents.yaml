  # star section, updated 2026-10-10 to 10-15) and two dated tier lists. Targets the sources don't give
  # are authored judgment (ADR 0007): "max" is the book max in the save, Stonks! stops at 30 (each point
  # returns at least one star point up to about 30), Toilet Paper Postage at 100 (its max can reach tens
  # of thousands), and the two useful caps follow the talents' own effect text.
