    type: goal
    title: Carry pouch for the AFK skill
    scope: character
    category: compounding
    unit: carry
    progress:
      id: storage/pouch-tier
    milestones:
      - at: 25
        reward: Miniature pouch
      - at: 50
        reward: Cramped pouch
      - at: 100
        reward: Small pouch
      - at: 250
        reward: Average pouch
      - at: 500
        reward: Sizable pouch
      - at: 1000
        reward: Big pouch
      - at: 2000
        reward: Large pouch
    text: "{class} pouch {base:int} base · {perSlot:int} per slot"
    why: The pouch is the base every carry multiplier scales, and a higher tier is crafted at the Anvil.
    values:
      unknownText: "Carry: can't tell right now"
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: Tiers from D carryBags.json (25 ... 35,000; Critters and Souls start at 50). Ladder cut at 2000 for W1-W4; the generator may emit the full ladder. Only for characters whose AFK Target is a skill.
    sources:
