  - id: storage.goal.greenstacks
    system: storage
    type: goal
    title: Greenstacks
    scope: account
    category: compounding
    unit: items
    progress:
      id: storage/greenstacks
    milestones:
      - at: 20
        reward: Equinox greenstack challenge 1
      - at: 75
        reward: Equinox greenstack challenge 2
      - at: 200
        reward: Equinox greenstack challenge 3
    text: "{count:int} greenstacks · closest: {item:name} at {amount:int} of 10M"
    why: A greenstack is 10,000,000 of one item in storage; the registry is permanent and feeds Equinox, Research and greenstack bonuses.
    values:
      unknownText: "Greenstacks: can't tell right now"
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: H
    status: draft
    notes: Count = account.storage.greenStacks length (registry permanent since 2.3.508); closest = largest greenstackable storage stack (P misc.ts#L460 isGreenstackable). Storage has no stack cap.
