# SPDX-License-Identifier: GPL-3.0-only
# M20 F1 the Daily & Weekly Checklist (docs/specs/M20-skills-parallel-slots.md FR-1, FR-2, TR-3): the row
# registry and the clocks. A module that adds a reset item adds its row here, in its own PR; the
# checklist has no hard-coded rows (D-2). Each row's state is read from the save by the engine module
# (packages/engine/src/checklist/rows.ts), keyed by the row id; `entries` are the Checks whose Goal or
# Active Play the row links to instead of repeating it (FR-8).
system: checklist
facts:
  - id: checklist.fact.rows
    system: checklist
    origin: authored
    title: Daily and weekly reset rows
    notes: "Phase 1's 17 rows (FR-2, D-3), in band order. band: no-bank (lost at the reset), banks (kept up to 3 days), weekly. clock: daily (TimeAway.ShopRestock), account-week (OLA[39]), server-week (Thursday 00:00 UTC), ballot-week (Monday about 17:02 UTC), server-day (the tournament doc, V8: not projected), own-timer (the pet pull). M6 owns the keys, tickets, plays, vials, Spiketrap, pet pull, Pet Mart and Post Office Checks; these rows only read them."
    rows:
      - { id: pet-pull, band: no-bank, clock: own-timer, label: "Free pet pull", system: pets, entries: [pets.check.free-pull], effortSeconds: 20, wiki: "https://idleon.wiki/wiki/Pets" }
      - { id: pet-mart, band: no-bank, clock: server-day, label: "Pet Mart free gems", system: pets, entries: [pets.check.mart-gems], effortSeconds: 20, wiki: "https://idleon.wiki/wiki/Tournament" }
      - { id: pet-tournament, band: no-bank, clock: server-day, label: "Pet Tournament registration", system: pet-tournament, entries: [pet-tournament.check.register], effortSeconds: 30, wiki: "https://idleon.wiki/wiki/Tournament" }
      - { id: random-event, band: no-bank, clock: daily, label: "Random Event", system: random-events, entries: [random-events.check.today], effortSeconds: 180, wiki: "https://idleon.wiki/wiki/Random_Events" }
      - { id: minigame-plays, band: no-bank, clock: daily, label: "Skill minigame plays", system: minigames, entries: [minigames.check.daily-plays], effortSeconds: 300, wiki: "https://idleon.wiki/wiki/Minigames" }
      - { id: spiketrap, band: no-bank, clock: daily, label: "Spiketrap gems", system: minigames, entries: [minigames.check.spiketrap], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Minigames" }
      - { id: vial-attempts, band: no-bank, clock: daily, label: "Vial attempts", system: alchemy-vials, entries: [alchemy-vials.check.daily-attempts], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Alchemy" }
      # M19 X5 (FR-16): the Liquid Shop daily gem, a row only (M20 D-4), never a Goal.
      - { id: liquid-shop-gem, band: no-bank, clock: daily, label: "Liquid Shop: One Measly Gem", system: alchemy, entries: [], effortSeconds: 20, wiki: "https://idleon.wiki/wiki/Alchemy" }
      - { id: post-office, band: no-bank, clock: daily, label: "Post Office orders", system: post-office, entries: [post-office.check.daily-orders], effortSeconds: 120, wiki: "https://idleon.wiki/wiki/Post_Office" }
      - { id: daily-tasks, band: no-bank, clock: daily, label: "Daily tasks", system: task-board, entries: [task-board.check.daily], effortSeconds: 120, wiki: "https://idleon.wiki/wiki/Tasks" }
      - { id: guild-daily, band: no-bank, clock: daily, label: "Guild daily tasks", system: guild, entries: [guild.check.daily], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Guilds" }
      - { id: boss-keys, band: banks, clock: daily, label: "Boss keys", system: boss-keys, entries: [boss-keys.check.collect], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Amarok" }
      - { id: tickets, band: banks, clock: daily, label: "Colosseum tickets", system: colosseum, entries: [colosseum.check.collect-tickets], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Colosseum_Ticket" }
      - { id: killroy-rooms, band: weekly, clock: account-week, label: "Killroy's rooms", system: killroy, entries: [killroy.check.room], effortSeconds: 120, wiki: "https://idleon.wiki/wiki/Killroy%27s_Slaughterhouse" }
      - { id: killroy-skulls, band: weekly, clock: account-week, label: "Killroy skulls", system: killroy, entries: [killroy.check.skulls], effortSeconds: 90, wiki: "https://idleon.wiki/wiki/Killroy%27s_Slaughterhouse" }
      - { id: weekly-battle, band: weekly, clock: server-week, label: "Weekly Battle", system: weekly-battles, entries: [weekly-battles.check.raid], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Weekly_Battles" }
      - { id: ballot, band: weekly, clock: ballot-week, label: "Bonus Ballot vote", system: ballot, entries: [ballot.check.vote], effortSeconds: 30, wiki: "https://idleon.wiki/wiki/Bonus_Ballot" }
      - { id: guild-weekly, band: weekly, clock: account-week, label: "Guild weekly tasks", system: guild, entries: [guild.check.weekly], effortSeconds: 60, wiki: "https://idleon.wiki/wiki/Guilds" }
    sources:
      - { url: "https://idleon.wiki/wiki/Daily_Checklist", title: "IdleOn Wiki: Daily Checklist (daily and weekly items per world)", tier: 2, claimDate: 2026-03-24, verified: 2026-10-18, gameVersion: 2.3.540, note: "Edited before v1.22 (Stale-risk); each row also cites its own page." }
      - { url: "https://idleon.wiki/wiki/Killroy%27s_Slaughterhouse", title: "IdleOn Wiki: Killroy's Slaughterhouse (weekly)", tier: 2, claimDate: 2026-10-05, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Weekly_Battles", title: "IdleOn Wiki: Weekly Battles", tier: 2, claimDate: 2026-10-07, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Random_Events", title: "IdleOn Wiki: Random Events (one a day)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-18, gameVersion: 2.3.540 }

  - id: checklist.fact.clocks
    system: checklist
    origin: authored
    title: The reset clocks
    notes: "F-a: the account week ends ShopRestock + 86400 x OLA[39] seconds after the save (Toolbox Etc.jsx weeklyReset); the server week starts Thursday 00:00 UTC (floor(GlobalTime / 604800), N.js week rollover @11680650); the ballot week is floor((GlobalTime + 197860) / 604800) (N.js @11766234); two ShopRestock readings within 1 h are one reset (Toolbox bossRespawns.js)."
    rows:
      weeklyOffsetIndex: 39
      serverWeekSeconds: 604800
      ballotOffsetSeconds: 197860
      driftToleranceSeconds: 3600
      killroyArcadePacksPerWeek: 50
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/components/dashboard/Etc.jsx", title: "IdleOn Toolbox dashboard: daily and weekly reset times", tier: 1, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/bossRespawns.js", title: "IdleOn Toolbox bossRespawns: ShopRestock drift within 1 h", tier: 1, verified: 2026-10-18, gameVersion: 2.3.540 }
