# SPDX-License-Identifier: GPL-3.0-only
# How each game System opens (M17 FR-34, TR-8, D-13): an authored tier-2 fact table, patch-tagged so a
# row can go Stale like any fact, until Toolbox exposes the conditions as data (ADR 0007; M2's town-unlock
# precedent). One row per game System that isn't open from the start, in condition form ("Opens …",
# "Needs …", never an instruction), with its IdleOn Wiki page and any other player-readable Source the
# author opened (#74). Rows whose condition is a class level in metapath.fact.town-unlocks name it in
# `level` and write `{level}` instead of repeating the number. Where the wiki and game data disagree,
# game data wins (ADR 0004): the wiki gives Stamps at class Lv 12, the game data 14.
# The Systems hub tile shows only what the System's unlock Detector checks ("Opens in World 2"); this
# precise text is shown on the System page under "How it opens" (FR-19).
system: systems
facts:
  - id: systems.fact.unlocks
    system: systems
    origin: authored
    title: How each game System opens
    sources:
      - url: https://idleon.wiki/wiki/Worlds
        title: "IdleOn Wiki: Worlds"
        tier: 2
        claimDate: 2026-10-18
        verified: 2026-10-18
        gameVersion: 2.3.540
    notes: >-
      Researched 2026-10-18 on idleon.wiki at game 2.3.540, one page opened per row. Inferred rows (the
      wiki names the place but no explicit trigger): anvil, quests, alchemy-p2w, salt-lick (low); refinery,
      construction, library, death-note, atom-collider, worship, lab, cooking, breeding (medium).
      /wiki/Islands is a 404, so islands cites Island Expeditions.
    rows:
      # ---- World 1 ----
      - system: stamps
        world: 1
        text: "Opens once a character reaches class Lv {level} and talks to Mr Pigibank in Blunder Hills town"
        level: { fact: metapath.fact.town-unlocks, key: stamps }
        gameVersion: 2.3.540
        sources:
