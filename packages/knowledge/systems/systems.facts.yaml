          - { url: https://idleon.wiki/wiki/Mr_Pigibank, title: "IdleOn Wiki: Mr Pigibank", tier: 2, claimDate: 2026-10-05, verified: 2026-10-18, gameVersion: 2.3.540 }
      - system: star-signs
