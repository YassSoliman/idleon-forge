  - id: post-office.check.slug-slurp
    system: post-office
    type: check
    title: Level the Slug Slurp vial
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 60
    detector:
      id: post-office/slug-slurp
      params:
        targetLevel: 4
    text: "Level the Slug Slurp vial ({level:int} → {target:int}): +2 boxes per level on every character"
    why: Each vial level adds 2 box points to every character's total, forever. It takes Hermit Cans.
    notes: "Fires when the Post Office is unlocked and vialLevels[19] < targetLevel. Effect is tier 1 (vials.json[19] add x1=2, read by getVialsBonusByStat 'BoxPoints'); the target level is a default, confidence M. The vial's own description says 'easily the best bonus in the game' - game flavour text, not used as a Source. Coordinate with alchemy-vials.priority.plan (add index 19 to a row) rather than duplicate if the vial plan owns vial levels. kb-convert: text: < and > spelled out"
    doneWhen:
      field: account.alchemyPlan.vialLevels[19]
      change: higher
    appliesTo:
      stages:
        - from: W2-early
          to: W4-entry
    confidence: M
