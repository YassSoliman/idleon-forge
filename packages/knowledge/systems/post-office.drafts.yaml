  - id: post-office.check.save-streak
    system: post-office
    type: check
    title: Save your Post Office streak
    subject: account
    effect: next-action
    usesExpectedReturn: true
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: post-office/streak
      params:
        minStreak: 5
    text: "Fill {company} or use a Silver Pen: streak {streak:int} ends at the refresh"
    values:
      text-no-pen: "Fill {company} before the refresh: streak {streak:int} ends otherwise"
      detail: "{company}: streak {streak:int}"
    why: A streak pays bonus boxes at 5, 10, 15, 20 (+3), 50 (+5) and 100 (+9), and order sizes grow with it. Sources disagree on what a Silver Pen does to the streak (the wiki says it keeps it).
    notes: "Pen semantics disputed: wiki (tier 3, M) keeps the streak and adds a shield day; DigitalTQ (tier 4, L) says a pen can reset it. Fires only when a company with streak >= minStreak is open and the refresh lands before the expected return. Shield days (wiki-only rule, C26) can postpone the reset; until that rule is verified in code, treat shield > 0 as 'banked' urgency rather than silent. kb-convert: doneWhen.change undefined -> changed"
    doneWhen:
      field: account.postOffice.companies[*].doneToday
      change: changed
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L578
