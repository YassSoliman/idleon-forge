  - id: post-office.check.open-next-bonus
    system: post-office
    type: check
    title: Open a box's next bonus
    subject: character
    effect: next-action
    needsCharacter: true
    category: compounding
    effortSeconds: 30
    detector:
      id: post-office/thresholds
    text: "Put {need:int} boxes into {box}: its {ordinal} bonus starts at level {at:int}"
    why: A box's 2nd bonus starts at level 26 and its 3rd at 101 (51 and 201 on the 800-cap boxes). {box} sits just below, and you have the boxes now.
    notes: Fires when unspent >= need and a box in the character's plan (priority.box-order) is within 5 levels below 26 or 101. Thresholds are game data (upgradeLevels 24.9 / 99.9 with round), confidence H; the 'push it now' advice M.
    doneWhen:
      field: characters[*].postOfficeBoxes
      change: higher
    appliesTo:
      stages:
        - from: W2-early
          to: W4-late
    confidence: M
    status: draft
    sources:
