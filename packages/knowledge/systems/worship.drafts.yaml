system: worship
entries:
  - id: worship.check.play-new-totem
    system: worship
    type: check
    title: Play your new totem once
    subject: account
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 300
    detector:
      id: worship/play-new-totem
    text: "Summon {totem} once with your {who}: until it has a best wave it pays nothing"
    why: A totem's EXP and Souls scale with its best wave, and a totem you have never played has none, so it pays 0 and cannot be claimed. One Tower Defense run sets the wave; {totem} pays {ratio:int}x Gorefest's EXP per charge at the same wave.
    doneWhen:
      field: account.totems
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: H
    status: draft
    notes: C2 (WaveMultiplier = 0 at best wave 0) and C4 (unlock by Worship level). Fires once per account for the lowest-index totem with levelReq <= the best character Worship level and maxWave === 0; slot who = that character. ratio = ((i+1)^2/chargeReq_i) / (1/25), C51. Needs account.totems extended past index 3 (Clash of Cans is W4). M26 W3 synth (from maps/worship.json).
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/worship.ts#L28-L47
