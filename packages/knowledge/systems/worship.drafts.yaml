          to: W4-entry
    confidence: M
    status: draft
    notes: "Ladder, level reqs and recipes are game data (C9, C10, H); 'wear the best skull your level allows' is the wiki's advice (C12, tier 3, M), so M overall. Fires when the character has a skull (no skull = worship.check.no-skull) and a higher ladder skull it may equip is in storage (equip) or its whole recipe is held (craft). Slush Skull is skipped: it charges slower than no skull (C57) and is a Dreadnaught ingredient. Wax Skull stays with worship.check.no-skull. M26 W3 synth (from maps/worship.json)."
