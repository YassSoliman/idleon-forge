  - id: worship.check.first-towers
    system: worship
    type: check
    title: Build your first Tower Defense towers
    subject: account
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 120
    detector:
      id: worship/first-towers
    text: "Put {tower} in a build slot: {salt:int} {saltName} for Lv 1, then it can be placed in Tower Defense"
    why: Tower Defense uses the towers you have built in Construction. Pulse Mage hits several monsters and knocks them back, the usual first tower; Fireball Lobber is the second.
    doneWhen:
      field: account.construction.buildings
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W3-late
    confidence: M
    status: draft
    notes: "Order is the wiki's (C47, tier 3, M); salt costs (C34, C67) and per-level bonus (C34) are game data, H; 'a tower needs Lv 1 to be usable' is N.js only (C36, L), so the text says 'then it can be placed' and the why names Construction levels only. Fires when some character has Worship >= 1 and Pulse Mage or Fireball Lobber is level 0 and not in a build slot, and the salt is unlocked. Leave Construction's own build-slot check (construction.check.slot-empty) to fill slots; this one names which tower. M26 W3 synth (from maps/worship.json). kb-convert: why cut to 240 characters; the rest: Each Construction level adds {perLevel}% damage and cuts in-run upgrade cost."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
