  - id: worship.check.prayer-wave-close
    system: worship
    type: check
    title: A prayer is a few waves away
    subject: account
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 600
    detector:
      id: worship/prayer-wave-close
    text: Push {totem} from wave {best:int} to {wave:int} to unlock {prayer}
    why: Each prayer unlocks the first time a totem's Tower Defense run reaches its wave, and it stays unlocked. {left:int} waves to go; runs save at every 10th wave.
    doneWhen:
      field: account.prayers
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: M
    status: draft
    notes: C37 unlock waves (H), C26 save every 10 waves (M). 'Within reach' is the map author's threshold (left <= 10 waves, so one saved stretch), hence M. Fires for the totem with the smallest left among played totems; silent once every W1-W4 prayer of that totem is unlocked. Prayer choice itself is the Prayers map's job. M26 W3 synth (from maps/worship.json).
