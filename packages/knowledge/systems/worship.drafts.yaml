  - id: worship.check.skull-next
    system: worship
    type: check
    title: A better skull is ready
    subject: character
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 180
    detector:
      id: worship/skull-next
    text: "{verb} a {skull} for your {who}: max charge {fromMax:int} → {toMax:int}"
    why: A skull sets most of a character's max charge and part of its charge rate ({fromRate}/h → {toRate}/h at Worship 50). Your {who} is Worship {level:int}, enough for the {skull}.
