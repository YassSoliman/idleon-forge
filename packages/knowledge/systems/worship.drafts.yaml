  - id: worship.check.best-totem
    system: worship
    type: check
    title: Worship at your best totem
    subject: character
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: worship/best-totem
    text: "Spend {who}'s {charge:int} charge at {totem}: {claims:int} claims, {perCharge:int} Worship EXP per charge"
    why: Every claim costs the totem's charge and pays EXP that grows with the totem's number squared and its best wave, so the same charge pays most at {totem}. {lower} pays {lowerPerCharge:int} per charge.
    values:
      detail-souls: Need {soul} for a skull or prayer? Claim at {soulTotem} instead
    doneWhen:
      field: characters[].afk.worship.charge
      change: lower
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: H
    status: draft
    notes: C1, C2, C51 (EXP per claim floor(15*(i+1)^2*multi*waveMulti^0.9); the character's EXP multi is the same at every totem, so expReward/chargeReq ranks them). Fires per character with charge >= the best totem's chargeReq, only among totems the character can open (levelReq <= its Worship level) and has played (maxWave > 0). Shown as the place-detail of worship.check.charge-caps-* when both fire (one line per character, not two). Souls are wave-based, not totem-based (C3), so the Soul detail is a choice, not a rule. M26 W3 synth (from maps/worship.json).
