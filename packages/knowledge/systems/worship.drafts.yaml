    notes: C13, C62 (talent values and cooldown, H); doing it first each session is the dossier's per-session synthesis (M). Fires when a Wizard-line character has CHARGE_SYPHON level >= 1 and at least 2 other characters hold >= 50% of their max. Toolbox also exposes the overflow time (getChargeWithSyphon.timeToOverCharge, dashboard timer 'Charge Syphon overflow'); that is a Timeline marker, not a second line. M26 W3 synth (from maps/worship.json).
