entries:
  - id: anvil.check.mat-points
    system: anvil
    type: check
    title: Buy anvil points with monster materials
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 60
    detector:
      id: anvil/mat-points
      params:
        minPoints: 3
    text: Buy {points:int} anvil points with {item} on {count:int} characters
    values:
      text-one: Buy {points:int} anvil points with {item} on {class:name} Lv {level:int}
      detail: "{character}: {points:int} points for {cost:int} {item}"
    why: Each character also buys anvil points with monster materials, and the first ones cost a handful of early drops ({cost:int} {item} for these). A point is permanent Speed or Capacity; the plan then places it.
    notes: "Cost rule: Toolbox getMonsterMatCost / getAnvilUpgradeCostItem (dossier C9, C43, H). Spends only what is held, cheapest first. Confidence M, not H: the same low-tier drops also feed stamps and crafts, and whether the game pays from storage or the character's inventory is unverified (open question). AutoReview's 85-point tier (C39, L) is not used."
    doneWhen:
      field: characters[*].anvil.points.mats
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L38-L54
