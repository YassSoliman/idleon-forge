  - id: anvil.check.product-exp
    system: anvil
    type: check
    title: Produce Thread for Smithing EXP
    subject: character
    effect: next-action
    category: nice
    effortSeconds: 30
    detector:
      id: anvil/product-exp
      params:
        demandFrom:
          - anvil-tabs
          - material-pouch
          - gear-plan
    text: Switch your {who}'s {product} hammer to Thread
    why: Every product uses the same anvil speed, and Thread gives the most Smithing EXP per unit of work ({threadRate:int} vs {rate:int} per 1,000). You hold {held:int} {product}, more than your next recipes need ({need:int}).
    values:
      detail: "{who}: {product} ({rate:int} EXP per 1,000 work), {held:int} held, {need:int} needed"
    notes: "Silent while a known recipe (next Anvil Tab, next Material Pouch, a Gear Plan piece) still needs more of the product than storage + inventories + the anvil hold: products ARE needed for crafts, so the rule is never 'always Thread'. EXP per 1,000 work from anvilProducts (Thread 60, Trusty Nails 50, Boring Brick 46, Chain Link 36, Leather Hide 29, Pinion Spur 25, Lugi Bracket 22 ...)."
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts
