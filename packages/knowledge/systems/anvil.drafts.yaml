  - id: anvil.check.empty-hammer
    system: anvil
    type: check
    title: Anvil hammer with nothing to make
    subject: character
    effect: next-action
    category: spendable
    effortSeconds: 15
    detector:
      id: anvil/empty-hammer
    text: Pick a product for {class:name} Lv {level:int}'s spare anvil hammer
    why: The Infinity Hammer and an equipped Hammer Hammer each let the anvil make one more item at once; a slot with no product makes nothing.
    notes: "Slot sources are tier 1 (gemShop.json GemP1 desc 'produce TWO anvil items at once ... stacks with other +1 anvil hammer'; cauldrons.json HAMMER_HAMMER desc 'produce two items at once ... must be equipped'). Confidence M: Toolbox does not compute slot count, and whether a granted slot can sit empty in AnvilPAselect needs one in-game look. Silent on both test accounts. kb-convert: category wasting -> spendable"
    doneWhen:
      field: characters[*].anvil.slots
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/gemShop.json#L504-L512
