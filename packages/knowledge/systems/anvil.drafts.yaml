  - id: anvil.check.material-pouch
    system: anvil
    type: check
    title: Bigger Material Pouch
    subject: character
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector:
      id: anvil/material-pouch
    text: Craft a {pouch} for your {who}
    why: Anvil capacity is the Material Pouch's carry cap times (2 + 0.1 x Capacity points), so a bigger pouch raises every product's cap at once; {product} fills {fullIn:in}, before you're back.
    values:
      many: Craft {pouch} for {n:int} characters
      gather: "{pouch}: gather {missing}"
      detail: "{who}: {current} -> {pouch}, {product} full {fullIn:in}"
    notes: "Fires only when a product caps before the Expected Return (afk.anvil capAt) and the next craftable pouch is a bigger tier than the one in use. Ladder from carryBags.json bCraft: Mini 25 (not crafted), Cramped 50, Small 100 (not crafted), Average 250, Sizable 500, Big 1,000, Large 2,000, Massive 5,000, Volumetric 10,000 (the dossier's M13 list skips Mini and Small). Pairs with anvil.check.spend-points: pouch first, then Capacity points."
    usesExpectedReturn: true
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts
