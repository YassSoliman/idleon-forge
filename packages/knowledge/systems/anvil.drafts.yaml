  - id: anvil.check.acme-trick
    system: anvil
    type: check
    title: Acme Anvil points before a respec
    subject: character
    effect: next-action
    category: compounding
    effortSeconds: 300
    detector:
      id: anvil/acme-trick
    text: Before resetting your {who}'s talents, spend its Acme Anvil points
    why: Acme Anvil adds anvil points from the Archer talent. Points already spent stay spent after a talent reset; the anvil balance just goes below zero until the talent is back.
    values:
      negative: "Your {who}'s anvil points are {points:int} below zero: put Acme Anvil back to earn new ones"
    notes: "Only the 'negative' line is detectable (afk.anvilPlan.unspent < 0 on an Archer-line character); the 'before a reset' line rides talent-resets.check.reset as detail for Archer-line characters with talent 281 > 0. Acme formula: SkillLevels[281] + bonus x floor(Smithing/10) (anvil.ts); the meaning of x2=15 is L (OQ11), so no point count is promised."
    appliesTo:
      stages: all
    confidence: M
    status: draft
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L84-L116
