# M4 Purpose & Milestones (docs/specs/M4-purpose-milestones.md TR-4, D6): skilling is judged on its Goals,
# never on EXP (the Copper lesson): the next level door (Mining and Fishing) and the next tool the
# skill level allows. Yes or no only (FR-6). Ladders are generated (skills.goal.door-*, tool-*).
system: skills
entries:
  - id: skills.contribution.door-mining
    system: skills
    type: contribution
    title: Skill level door
    activity: { afkType: MINING }
    goal: skills.goal.door-mining
    detector: { id: skills/door, params: { afkType: MINING } }
    eta: none
    text: "{skill} {now} → {at} opens {destination}"
    why: "{skill} level opens the door to the next mining map, with better resources."
    appliesTo: { stages: all }
    confidence: H
    status: active
    notes: "D6 (a): a door not yet reached is a live Goal. Choosing a better node is M5's."
    sources:
      - { url: "https://idleon.wiki/wiki/Portal_Requirements", title: "IdleOn Wiki: Portal Requirements (skill areas)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-18, gameVersion: 2.3.540, note: "Mining doors at 10, 25, 40 and 60; Fishing at 15 and 30." }
      - { url: "https://idleon.wiki/wiki/Mining", title: "IdleOn Wiki: Mining", tier: 2, claimDate: 2026-10-06, verified: 2026-10-18, gameVersion: 2.3.540, note: "Each area needs a set Mining level." }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json", title: "IdleOn Toolbox game data: mapPortals on skilling maps", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
