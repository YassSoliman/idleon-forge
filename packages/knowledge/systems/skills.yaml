  - id: skills.contribution.tool-mining
    system: skills
    type: contribution
    title: Next tool
    activity: { afkType: MINING }
    goal: skills.goal.tool-mining
    detector: { id: skills/tool-chain, params: { afkType: MINING } }
    eta: none
    text: "{target:name} toward the {tool}"
    why: "The {tool} is crafted at the anvil from what this character gathers, and its skill level already allows it."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "M4 TR-4: the next tool past the best one equipped whose level the skill meets; yes or no (FR-6)."
    sources:
      - { url: "https://idleon.wiki/wiki/Tools", title: "IdleOn Wiki: Tools", tier: 2, claimDate: 2026-10-03, verified: 2026-10-18, gameVersion: 2.3.540, note: "Pickaxes, hatchets, rods and nets, each with a level requirement." }
