# SPDX-License-Identifier: GPL-3.0-only
# M6 Unspent & idle: unspent merits per world (M6 FR-19, R6). The per-world order lives in the Check's
# `order` param, by generated row id (merit-shop.fact.rows); a Priority List entry can only list entry
# ids, and merit rows are fact rows. One entry per W2 row names it; the world's generic entry fires when
# the order names nothing. W1's order is not mapped to row ids yet (R6: needs an in-game review), W3's
# is Contested (PV 7.3), and W4's is left generic for now.
system: merit-shop
entries:
  - id: merit-shop.check.spend-w1
    system: merit-shop
    type: check
    title: Spend W1 merits
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 60
    detector: { id: merit-shop/unspent, params: { world: 1 } }
    text: "Spend {unspent:int} W1 {merits}"
    why: "Merits do nothing until spent in the Task Board's W1 merit shop."
    doneWhen: { field: "account.merits[*].unspent", change: lower }
    appliesTo: { stages: all }
    confidence: L
    status: active
    notes: "R6: PV 7.1's corrected W1 order (Hemoglobin x3, Amarok recipes, boss keys, respawn, ...) uses guide nicknames; map it to w1-* row ids after an in-game review, then add row entries like W2's."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/tasks.ts#L21", title: "Toolbox getTasks: merits and their levels", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Tasks/Blunder_Hills", title: "IdleOn Wiki: Tasks/Blunder Hills, Merit Shop tab", tier: 2, claimDate: 2026-10-15, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://docs.google.com/spreadsheets/d/13izR4-8rod7O2wo-ecXZ2_R_01jyIc4GsQwODxaBEFs/htmlview#gid=1908399039", title: "Idleon Incomplete Guide: World 1", tier: 3, claimDate: 2026-08-25, verified: 2026-10-17, gameVersion: 2.3.540 }
