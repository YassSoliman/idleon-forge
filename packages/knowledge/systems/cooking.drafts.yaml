          to: W4-entry
    confidence: M
    status: draft
    notes: "Rule: sum(spices[].toClaim) > 0 and claimsToday < 100. Confidence M: the 100/day cap is Toolbox's, not read from the game (dossier open question 1). Earlier research (C61, L, pre-patch) says unclaimed territories produce slower: not used in the why."
