  - id: cooking.check.use-ladles
    system: cooking
    type: check
    title: Use your ladles
    subject: account
    effect: next-action
    category: nice
    priority:
      frame: by-urgency
    effortSeconds: 30
    detector:
      id: cooking/use-ladles
    text: "Use your {ladles:int} Cooking Ladles: every kitchen jumps {ladles:int} hours ahead"
    why: Each ladle in the stack pushes every kitchen 1 hour forward, and the whole stack is used at once. Best right after you load your kitchens.
    doneWhen:
      field: account.storageItems.Cooking_Ladle
      change: lower
    appliesTo:
      stages:
        - from: W4-entry
          to: W4-entry
    confidence: M
    status: draft
    notes: "Rule: ladles held >= 1 and at least one kitchen is cooking. Confidence M: the effect comes from the item text (N.js, earlier research) and the wiki; Toolbox does not model it. Open question: whether ladles also advance recipes."
    sources:
      - url: https://idleon.wiki/wiki/Cooking_Ladle
