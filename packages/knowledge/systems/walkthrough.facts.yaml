# SPDX-License-Identifier: GPL-3.0-only
# Authored tier-2 preset-fit facts for M14's preset steps (owner amendment R-Q9a item 4). Until M8's card
# preset rule (#80, TR-9) and M9's Build tags (#77, TR-6) merge, the Walkthrough decides with these two
# small tables: a talent preset is a skilling preset when it holds at least `skillingAt` points in the
# skilling talents; a card preset fits an activity when at least half its cards' effects name it.
# TODO(M8, M9): replace with M8's presetFits and M9's classifyPreset once both are on main.
system: walkthrough
facts:
  - id: walkthrough.fact.preset-fit
    system: walkthrough
    origin: authored
    title: Talent and card preset fit by activity
    rows:
      talents:
        skillingAt: 50
        skilling: [BRUTE_EFFICIENCY, ELUSIVE_EFFICIENCY, SMART_EFFICIENCY, IDLE_SKILLING, BIG_PICK, LOG_ON_LOGS, WORMING_UNDERCOVER]
      cards:
        both: [Drop_Rate]
        skilling: [Skill, AFK_gain]
        FIGHTING: [Damage, accuracy, STR, AGI, WIS, LUK, Crit, Weapon_Power, Defence, HP, EXP_from_monsters, Kill]
        MINING: [Mining]
        CHOPPIN: [Choppin]
        FISHING: [Fishing]
        CATCHING: [Catching]
    sources:
      - url: https://idleon.wiki/wiki/Cards
        title: "IdleOn Wiki: Cards (card effects by skill)"
        tier: 2
        claimDate: 2026-10-12
        verified: 2026-10-17
        gameVersion: 2.3.540
  # M26 F-C FR-C1a: where each gate a template emits is explained (ActiveOn's own registry, no game fact).
  # `tab` is the System page's tab id; `fallback` is the page that explains it until the target ships.
  - id: walkthrough.fact.gate-homes
    system: walkthrough
    origin: authored
    title: Where each gate is explained
    rows:
      anvil-tab-unmet: { system: anvil, tab: walkthrough, focus: "EquipmentSmithingTabs{n}" }
      anvil-tab-met: { system: anvil, tab: recipes, focus: "{rawName}" }
      smithing: { system: anvil, tab: recipes, focus: "{rawName}" }
      recipe: { system: anvil, tab: recipes, focus: "{rawName}", fallback: "task-board walkthrough (Wave 2)" }
      quest: { system: quests, tab: walkthrough, fallback: "the Goal's own Walkthrough sheet (Wave 6)" }
      skill-efficiency: { system: skills, tab: walkthrough, fallback: "the Character page's Skills tab (Wave 3)" }
      world: { place: map }
      free-slots: { system: storage, tab: walkthrough, fallback: "the Character page's bag (Wave 3)" }
      refinery-rank: { system: refinery, fallback: "refinery page" }
      building-level: { system: construction, fallback: "construction page" }
      lab-node: { system: lab, fallback: "lab page" }
      bubble: { system: alchemy, tab: bubbles }
      stamp-cap: { system: stamps, tab: at-cap }
      breeding-upgrade: { system: breeding, fallback: "breeding page" }
    sources:
      - url: https://github.com/YassSoliman/idleon-forge/blob/research/m26-systems/docs/specs/M26-crafting-guidance.md
        title: "M26 F-C spec, FR-C1a: the gate-homes registry (ActiveOn, no game fact)"
        tier: 3
        claimDate: 2026-10-19
        verified: 2026-10-19
        gameVersion: 2.3.540
