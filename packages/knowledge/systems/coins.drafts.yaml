  - id: coins.check.cash-bubble
    system: coins
    type: check
    title: Level the cash bubble for your main stat
    subject: character
    effect: next-action
    category: compounding
    effortSeconds: 60
    detector:
      id: coins/cash-bubble
    text: "Level {bubble}: your {who} has {stat:int} {statName}, so each level pays {steps:int} times"
    why: Penny of Strength, Dollar of Agility and Nickel of Wisdom pay once per 250 of their stat, and only the one matching the class's main stat gets the class bonus.
    doneWhen:
      field: account.alchemy.bubbleLevels
      change: higher
    appliesTo:
      stages:
        - from: W2-early
          to: W4-late
    confidence: M
    status: draft
    notes: Fires for the coin farmer only, when floor(mainStat/250) >= 1 and the matching cash bubble is level 0, or when its gain is >= 5% of the farmer's multi. Bubble levels compete with the bubble plan (alchemy-bubbles.priority.plan); this Check feeds that plan's 'coins' row, it does not override it.
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L2767
        title: "Toolbox getCashMulti: the cash multi product and its final additive bracket"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/alchemy.ts
        title: "Toolbox getBubbleBonus: class main-stat multiplier only on the matching bubble"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
  - id: coins.check.golden-bread
    system: coins
    type: check
    title: Eat Golden Bread on your coin farmer
    subject: character
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector:
      id: coins/golden-bread
    text: "Put Golden Bread in {who}'s food bar: +{gain:pct} coins"
    why: Golden foods are never eaten; Golden Bread adds to coins from monsters, and more bread in the stack adds more.
    doneWhen:
      field: characters[{index}].foodStacks
      change: changed
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Fires when Golden_Bread (FoodG6) is in storage or a bag, not in the farmer's food bar, the farmer has a free or non-golden non-health slot, and the computed gain (Toolbox getGoldenFoodBonus on a clone) is >= 3% of the farmer's multi. A Sneaking beanstalk Golden Bread also counts (W6, out of scope). kb-convert: doneWhen.change undefined -> changed"
    sources:
