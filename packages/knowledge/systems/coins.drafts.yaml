system: coins
entries:
  - id: coins.priority.levers
    system: coins
    type: priority
    title: Coin levers
    text: Raise coins from monsters with the lever that multiplies most
    why: Your coin multi is a product of groups; a new group (x1.5, x2.4) beats more of a bracket you already stack.
    notes: "Order is computed, not authored: coins/levers ranks each reachable, unclaimed lever by new multi / old multi on the coin farmer (the best coins-per-hour fighter), with Toolbox's own breakdown. The math is tier 1 (H); whether a lever is worth its cost is M. Real-money levers (cash bundle, event shop, companions) are shown as owned/not owned only, never ranked or suggested."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L2767
        title: "Toolbox getCashMulti: the cash multi product and its final additive bracket"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
    appliesTo:
      stages: all
    confidence: M
    status: draft
    list: order
    tiers:
      - - coins.check.gold-set
      - - coins.check.cash-bubble
      - - coins.check.golden-bread
  - id: coins.check.gold-set
    system: coins
    type: check
    title: Register the Gold set
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector:
      id: coins/gold-set
    text: "Register the Gold set in the Armor Smithy: x1.5 coins from monsters"
    why: A registered set counts for every character; the Gold set is its own x1.5 group in your coin multi, the biggest step you can unlock in World 3.
    doneWhen:
      field: account.armorSmithy.registered
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W4-late
    confidence: M
    status: draft
    notes: "Fires only when the Armor Smithy is hired (OLA[380]) and GOLD_SET is not in OLA[379]. Toolbox also counts the set when the logged-in character wears it (getSetPartsOn on loggedInCharacter); whether wearing it helps an AFK character is unverified (L), so the wear variant is not drafted. kb-convert: doneWhen.change undefined -> changed"
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/armorSmithy.ts#L65
        title: "Toolbox getArmorSetBonus: a registered (unlocked) set counts"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
