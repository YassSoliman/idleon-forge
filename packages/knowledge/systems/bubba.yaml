          sources:
            - { url: "https://www.youtube.com/watch?v=Tz1ow2H_6aA", title: "Kanumar: Bubba guide, Megaflesh 1-6", tier: 3, claimDate: 2025-12-13, verified: 2026-10-18, gameVersion: 2.3.540 }
            - { url: "https://vortexgaming.io/en/postdetail/624145", title: "vortexgaming.io: Bubba's Guide to Megaflesh 1-6", tier: 4, verified: 2026-10-18, gameVersion: 2.3.540 }
    list: order
    tiers:
      - [bubba.check.charisma-idle]

