  - id: stamps.check.skill-falloff
    system: stamps
    type: check
    title: A skill stamp levelled past your skill
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 60
    detector:
      id: stamps/skill-falloff
      params:
        ratio: 0.75
    text: "{stamp:name} Lv {level:int} acts as about Lv {effective:int} on your best {skill} character ({skill} {skillLevel:int})"
    why: Skill stamps lose strength when the stamp is far above the skill level of the character using it; levelling {skill} on that character gets back more than another cap raise on this stamp.
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "M26 stamps map, dossier M9 (C13 H, C14 M: the skillIndex to skill map is inferred from stamp names, hence M). Effective level is Toolbox getStampBonus falloff for the character with the highest level in that skill: sl = L*(200/(20m)); if sl>3, eff = min(floor((3+(sl-3)*(skill/(sl-3))^0.75)*20m/200), sl, L). Only stamps with skillIndex>0 and capStep>1; silent when Jade Level_Exemption is owned (W6). Fire when eff < ratio*L. Per class: it names the best character in that skill, never a class."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L366-L389
        title: "Toolbox getStampBonus: skill-level falloff on skill stamps"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/stamps.json
        title: "Toolbox game data: stamp skillIndex and cap step"
