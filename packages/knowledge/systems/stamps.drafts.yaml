    detector:
      id: stamps/carry-wall
    text: "{stamp:name} needs {cost:int} {material:name} in one bag; your best carrier holds {capacity:int}"
    why: You have the material, but a cap raise is paid from one character's inventory. {fix}
    values:
      fixHydrogen: Hydrogen at {needed:int}% shrinks it enough.
      fixCarry: Level a carry stamp (Matty Bag for pouches, Lil' Mining Baggy, Choppin' Bag) or a bag first.
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: M26 stamps map, dossier M5/M15 (C23 consumption side M, C25). Fires per stamp with raise.atDiscount.hasMaterials && !carryOk. fixHydrogen when raise.minReduction != null and Hydrogen level > 0 (else spend.check.hydrogen-hold owns the wait); fixCarry otherwise. Refines spend.check.stamp-not-ready (a count) with the one stamp to act on; keep only one of the two lines on Now.
