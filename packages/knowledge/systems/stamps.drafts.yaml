        reward: 1% daily Gilded Stamp chance (after Rift {rift})
      - at: 500
        reward: 5% daily Gilded Stamp chance
      - at: 1000
        reward: 10% daily Gilded Stamp chance
      - at: 2500
        reward: 25% daily Gilded Stamp chance
      - at: 5000
        reward: 50% daily Gilded Stamp chance
      - at: 10000
        reward: a Gilded Stamp every login day
    text: "{total:int} total stamp levels across {collected:int} stamps"
    why: Once Rift {rift} (Stamp Mastery) is done, every 100 total stamp levels adds 1% to a daily chance of a Gilded Stamp; before that the total only measures progress.
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: "M26 stamps map, dossier M7/M14 (C11, C26). Rift 26 gate: Stamp_Mastery is the riftBonus on riftInfo index 25 (tier 1; the dossier carried it as C12 tier 3). The milestone rewards say Gilded only; community tier thresholds (C34, C35) are L and are not used. kb-convert: milestones.0.reward: Rift 26 -> Rift {rift} (shown numbers; the Detector fills {rift} via riftLabel()); why: Rift 26 -> Rift {rift} (shown numbers; the Detector fills {rift} via riftLabel())"
