  - id: stamps.check.coins-outrun-caps
    system: stamps
    type: check
    title: Your coins have outrun your stamp caps
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 300
    detector:
      id: stamps/coins-outrun-caps
    text: "{capped:int} of {owned:int} stamps are at their cap; raise {ready:int} caps you can pay now to keep buying levels"
    why: Coins only buy stamp levels below the cap, and every owned stamp you can still level costs less than the coins you hold; each cap raise you already have the material for opens {step:int} or more new levels.
    doneWhen:
      field: account.spend.stamps
      change: lower
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: "M26 stamps map, dossier M3/M4/M20 (C5, C8, C51). Headline for the Spend Plan stamp raise items, not a second price: ready = raise.atDiscount.hasMaterials && carryOk. Silent while any raise needs farming only (spend.check.stamp-not-ready owns that). Fold into the Spend Plan header if M7 already shows it."
    sources:
