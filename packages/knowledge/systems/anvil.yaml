# SPDX-License-Identifier: GPL-3.0-only
# M3 AFK Safety: the anvil production cap (docs/specs/M3-afk-safety.md FR-18, D7, Final rulings RT-14, #70 A1 and A5,
# R-PILL-1: a cap pill, never a blocker).
# M6 Unspent & idle: the anvil point plan (M6 FR-23, Final rulings #70 A2 to A4).
system: anvil
entries:
  - id: anvil.check.caps-before-return
    system: anvil
    type: check
    title: Anvil fills while you're away
    text: "Collect {product:name} from the anvil"
    values:
      timelineKind: storage
      timelineWhat: "anvil"
      fill: anvil
      pill: "Anvil full · collect"
      pill-soon: "Anvil full {fullIn:in} · collect"
    why: "Full {fullIn:in}; it refills in {fromEmpty:duration} after you collect. Anvil production stops at capacity, so every hour past it is lost production and Smithing EXP."
    notes: "#70 A5: fires only when it changes the outcome: the product is full now (RT-14), or collecting now keeps it producing until the return. A cap that refills before the return even after collecting is not a per-character line; the account-level point plan (anvil.check.spend-points, anvil.check.respec) covers it. R-PILL-1 (owner, 2026-10-17): it renders as a compact pill on the row and in Focus (values.pill full now, values.pill-soon before the return), never a blocker or a Fix card, and never changes the Verdict."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts
        title: IdleOn Toolbox, getTimeTillCap and getAnvilFutureProduction
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - url: https://idleon.wiki/wiki/Smithing#Anvil_Production
        title: "IdleOn Wiki: Smithing, anvil production"
        tier: 2
        claimDate: 2026-10-05
        verified: 2026-10-17
        gameVersion: 2.3.540
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: character
    effect: next-action
    category: nice
    usesExpectedReturn: true
    detector: { id: anvil/caps-before-return }
  - id: anvil.check.fill-time
    system: anvil
    type: check
    title: Anvil fill time
    subject: character
    effect: next-action
    category: nice
    detector: { id: anvil/fill-time }
    text: "Anvil full {fullIn:in} at current speed"
    values: { timelineKind: storage, timelineWhat: "anvil" }
    why: "Anvil production stops at capacity; this is when the first product with a hammer on it gets there."
    notes: "#70 A1: a quiet per-character info line, never a Goal or Next Action. M3's module emits it as CharacterResult.info; M6 does not run it."
    appliesTo: { stages: all }
    confidence: H
    status: active
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts", title: "IdleOn Toolbox, getTimeTillCap", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Smithing#Anvil_Production", title: "IdleOn Wiki: Smithing, anvil production", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
  - id: anvil.check.spend-points
    system: anvil
    type: check
    title: Spend anvil points
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 30
    detector: { id: anvil/points }
    text: "Unspent anvil points on {count:int} characters → Speed"
    values:
      text-many-capacity: "Unspent anvil points on {count:int} characters → Capacity"
      text-many-mixed: "Unspent anvil points on {count:int} characters → Speed and Capacity"
      text-one-speed: "Unspent anvil points on {class:name} Lv {level:int} → Speed"
      text-one-capacity: "Unspent anvil points on {class:name} Lv {level:int} → Capacity"
      text-one-mixed: "Unspent anvil points on {class:name} Lv {level:int} → Speed and Capacity"
      detail: "{character}: {speed:int} into Speed, {capacity:int} into Capacity"
    why: "Unspent anvil points do nothing. The split makes the most anvil work in {hours:hours} from empty: Speed until a product would fill sooner, Capacity after that."
    notes: "#70 A2: one account line replaces the per-character Goals. The split is a brute force over every integer split, scored with Toolbox getPlayerAnvil (characters[].afk.anvilPlan.spend); ties go to Speed. Exp points are never touched (A4)."
    doneWhen: { field: "characters[*].anvilPointsAvailable", change: lower }
    appliesTo: { stages: all }
    confidence: H
    status: active
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts", title: "IdleOn Toolbox, getPlayerAnvil anvilSpeed and anvilCapacity", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Smithing#Anvil_Points", title: "IdleOn Wiki: Smithing, anvil points", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/research/priority-verification/docs/research/2026-10-17-priority-verification.md", title: "Priority verification 3.1: all points into Speed", tier: 3, claimDate: 2026-10-17, verified: 2026-10-17, gameVersion: 2.3.540, verification: confirmed }
  - id: anvil.check.respec
    system: anvil
    type: check
    title: Re-split anvil points
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 300
    detector: { id: anvil/respec, params: { minGain: 0.25, shopWorld: 3 } }
    text: "Whetstone respec → about {times:int}× {product:name} at {hours:hours}"
    values:
      text-pct: "Whetstone respec → about {morePct:pct} more {product:name} at {hours:hours}"
      text-mixed: "Whetstone respec → about {times:int}× anvil output at {hours:hours}"
      text-mixed-pct: "Whetstone respec → about {morePct:pct} more anvil output at {hours:hours}"
      startWith: " Start with the first character."
      detail: "{character}: respec to {speed:int} Speed / {capacity:int} Capacity, about {morePct:pct} more"
    why: "Points only move with an Anvil Reset Whetstone: 1.2M coins at the Frostbite Towndra shop, one a day, and it resets Exp too. This split fills right at {hours:hours}, wasting no Speed or Capacity.{startWith}"
    notes: "#70 A3: account-level, planned against the typical AFK length (8 h until a pref exists), shown only when a character gains at least 25%, the W3 town shop is reached (currentWorld >= 3) and coins >= 1.2M. Price and daily stock of 1: wiki Vendors, Frostbite Towndra row 23."
    appliesTo: { stages: all }
    confidence: H
    status: active
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts", title: "IdleOn Toolbox, getPlayerAnvil anvilSpeed and anvilCapacity", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Smithing#Anvil_Points", title: "IdleOn Wiki: Smithing, anvil points and the Anvil Reset Whetstone", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Vendors", title: "IdleOn Wiki: Vendors, Frostbite Towndra (Whetstone: 1 platinum 20 gold, 1 a day)", tier: 2, claimDate: 2026-10-12, verified: 2026-10-17, gameVersion: 2.3.540 }
  # M26 F-C FR-C4 (Wave C, pulled forward from FR-57): the next anvil tab as a Walkthrough on the Anvil page
  # (page scope only: it never adds a Now card and never feeds Now's Demand), and a free hammer. The spec's
  # anvil.goal.next-tab is a check here (no Milestone ladder).
  - id: anvil.check.next-tab
    system: anvil
    type: check
    title: Next anvil tab
    text: "{text}"
    why: "{why}"
    values:
      answer: "Craft Anvil Tab {tab:int}: {ready:int} of {of:int} materials ready"
      answer-short: "Craft Anvil Tab {tab:int}: {ready:int} of {of:int} ready"
      cap: "Do this next"
      tab-card: "Craft Anvil Tab {tab:int} once and every anvil gets it"
      detail-tab-locked: "{n:int} open recipes wait behind it"
      detail-smithing: "Smithing {lv:int} (wiki)"
      detail-smithing-best: "Best Smithing on the account: {best:int}. The game data has no Smithing level per recipe, so the wiki's is shown."
      gate-ready: "{ready:int} of {of:int} ready"
      why: "A tab is crafted once and opens its recipes on every anvil."
      open: "Open the Walkthrough"
      all-owned: "Every W1-W4 anvil tab is owned"
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/crafts.json", title: "IdleOn Toolbox game data: crafts (Anvil_Tab_2 to Anvil_Tab_4 recipes)", tier: 1, verified: 2026-10-19, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Smithing", title: "IdleOn Wiki: Smithing (anvil tabs and the Smithing level each needs)", tier: 2, claimDate: 2026-10-05, verified: 2026-10-19, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: M
    status: active
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector: { id: anvil/next-tab }
    doneWhen: { field: "account.anvilTabsOwned", change: higher }
  - id: anvil.check.hammers
    system: anvil
    type: check
    title: Free anvil hammer
    text: "{text}"
    why: "{why}"
    values:
      text-free: "Pick a product for the free anvil hammer on your {who}"
      detail-free: "It has {used:int} of {n:int} hammers on a product; a free hammer makes nothing."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts", title: "IdleOn Toolbox, getAnvil (AnvilPAselect: one product per hammer, -1 none)", tier: 1, verified: 2026-10-19, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Smithing#Anvil_Production", title: "IdleOn Wiki: Smithing, anvil production (hammers)", tier: 2, claimDate: 2026-10-05, verified: 2026-10-19, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: M
    status: active
    subject: character
    effect: next-action
    category: spendable
    effortSeconds: 30
    detector: { id: anvil/hammers }
    notes: "Reads the raw AnvilPAselect_i list (save order, V33): a -1 entry is a free hammer (seen on the public saves). The draft anvil.check.empty-hammer is retired into it. Rendered as the anvil row of the Production Plan in Wave C."
