  - id: boss-keys.goal.amarok-slabs
    system: boss-keys
    type: goal
    title: Amarok Slabs for Dog Bone
    text: Collect 25 Amarok Slabs ({have:int}/25)
    why: "Dog Bone's second quest pays 5 Forest Villa Keys and his token, and doesn't take the Slabs. Normal Amarok (1 key) drops a Slab 30% of the time: the best Slabs per key."
    values:
      detail-runs: About {runs:int} more Normal Amarok runs at 0.3 Slabs a key
    scope: account
    category: compounding
    unit: slabs
    progress:
      id: boss-keys/amarok-slabs
    milestones:
      - at: 25
        reward: "Dog Bone quest 2: 5 Forest Villa Keys + Dog Bone Token"
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Active only while some character has Dog Bone 2 accepted or Dog Bone 1 done and 2 not done. 'Normal is the most key-efficient for Slabs' is inference from tier-1 drop data (C33: 0.3/key Normal vs 0.24/key Chaotic, M); entry costs are wiki-only (C10 M). Slab rawName Quest17."
    sources:
