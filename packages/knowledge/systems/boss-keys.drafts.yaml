  - id: boss-keys.check.first-key
    system: boss-keys
    type: check
    title: Get your first key for this world's boss
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 600
    detector:
      id: boss-keys/first-clear
      params:
        part: no-key
    text: "{text}"
    why: "{why}"
    values:
      text-1: "Do Dog Bone's quest 'Why he Die???' (3 Wood Board Bone): 6 Forest Villa Keys"
      text-2: "Do Djonnut's first quest (10 Shrapshell, a Kebab Stick, a Meat Pie): 5 Efaunt's Tomb Keys"
      text-3: "Do Bellows' first quest (kill 50 Neyeptunes actively): 1 Chizoar's Cavern Key"
      text-4: Get a Troll's Enclave Key from Mutated Mush or a Colosseum chest
      why: You need 1 key to fight {boss}, and its first kill opens World {next:int}. You hold none and none are banked.
      why-4: "World 4 has no daily key NPC: Troll's Enclave Keys come from Mutated Mush, Colosseum chests, rare Stilted Seeker drops and the Post Office."
    doneWhen:
      field: account.keys[*].held
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: Same gates as first-clear but key n held = 0 and banked = 0. Quest requirements are game data (C6, C7, C8 H). W4 sources C21 H (data), C23 H (wiki, Post Office); the Mush drop rate is disputed 100x (C30 L) so the text promises no rate.
