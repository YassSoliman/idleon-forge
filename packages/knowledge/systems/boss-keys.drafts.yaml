  - id: boss-keys.check.unlock-daily
    system: boss-keys
    type: check
    title: Unlock a daily key on another character
    subject: character
    effect: next-action
    needsCharacter: true
    category: compounding
    effortSeconds: 900
    detector:
      id: boss-keys/daily-coverage
      params:
        part: next
    text: "Finish {npc}'s quest {quest:int} on this character: +1 {key} a day"
    why: Each character that gets this far with {npc} adds one key to the daily bank, forever. {earning:int} of {total:int} characters earn it now.
    values:
      detail-req: "Needs: {req}"
    doneWhen:
      field: account.keys[*].perDay
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "One finding per NPC (Dog Bone, Djonnut, Bellows) whose world the account has reached: the highest-level character whose npcDialog is at or below the earner threshold, preferring one whose unlock quest is already accepted (characters[].quests status 0). Unlock quest: Dog Bone 1, Djonnut 2, Bellows 3 (wiki C9 M). Threshold dispute: Toolbox earns Djonnut keys at npcDialog > 6 (C3), the adapter at > 5 (M6 R1); keep the adapter's KEYS table as the single source and note the open question. Requirements text from quests.json (C6-C8 H)."
