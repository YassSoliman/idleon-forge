    title: Open the next world's portal
    subject: account
    effect: next-action
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 300
    detector:
      id: boss-keys/first-clear
    text: Spend 1 {key} on Normal {boss} for the {crystal}
    why: The first {boss} kill drops the {crystal}, which {npc} takes to open World {next:int}. Normal costs 1 key and you hold {held:int}.
    values:
      detail-hp: "Normal {boss}: {hp} HP in the game data"
      w4-npc: the next gatekeeper
    doneWhen:
      field: account.worldCrystals
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Fires per world n in 1..4 when: the world is reached (account.currentWorld >= n or finishedWorlds.World(n-1)), finishedWorlds.World(n) is false, the crystal n is not held (worldCrystals), and key n held >= 1 (account.keys[n].held). Crystal recipients C14 (M; Magma Geode recipient L, so W4 text names no NPC). Entry cost 1 for Normal is wiki-only (C10, M). World completion is inferred from gatekeeper dialogue, not a kill record (C15 H). Does not judge whether the character can win (O7: no damage thresholds in any source)."
