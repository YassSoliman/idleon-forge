  - id: boss-keys.check.quest-ready
    system: boss-keys
    type: check
    title: Hand in a key quest
    subject: character
    effect: next-action
    needsCharacter: true
    category: spendable
    effortSeconds: 120
    detector:
      id: boss-keys/quest-ready
    text: "Hand in {npc}'s '{quest}' on this character: {reward}"
    why: You already hold what it asks for ({req}).
    doneWhen:
      field: characters[*].quests
      change: higher
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: "Item-only key quests: Dog Bone 1 (3 Wood Board Bone -> 6 keys), Dog Bone 2 (25 Amarok Slab, not consumed -> 5 keys + token), Djonnut 1 (10 Shrapshell + Kebab Stick + Meat Pie -> 5 keys), Djonnut 3 (2500 each Melty Cube, Sticky Stick, Mamooth Tusk -> 5 keys + token). Fires on a character with the quest accepted (status 0) or the previous one done and this one not started, when storage + that character's bag hold the items. Kill quests (Djonnut 2, Bellows 1-3) are not item-checkable and stay with unlock-daily/first-key."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json (Dog_Bone.1-2, Djonnut.1-3, Bellows.1-4)
