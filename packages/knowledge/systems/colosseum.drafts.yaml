system: colosseum
entries:
  - id: colosseum.check.first-run
    system: colosseum
    type: check
    title: Run a Colosseum you have never scored in
    subject: account
    effect: next-action
    usesExpectedReturn: false
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 360
    detector:
      id: colosseum/arena-unscored
    text: "Run the {arena:name} Colosseum: you hold {balance:int} tickets and have no score there"
    why: A run costs {cost:int} tickets. Your best score there counts toward the Tome's Total Colosseum Score and the {arena:name} achievement ({threshold:int} points).
    doneWhen:
      field: account.colosseum.highscores[*].score
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Fires for the lowest reachable arena (Dewdrop W1, Sandstone W2, Chillsnap W3, Astro W4 by account.currentWorld) whose high score is 0 while balance >= its cost. Costs 1 and 2 are game data (ColosseumInfo[n][3], already in star-signs.facts.yaml V7); 3 and 6 are wiki (M). Never ranks arenas against each other: the ticket-per-chest ordering is L."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/highScores.ts#L61
        title: "Toolbox parseColosseum: six account-wide best scores"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/tome.ts#L345
        title: "Toolbox Tome: Total Colosseum Score is the sum of the six bests"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/achievements.json
        title: "Toolbox game data: Colosseum score achievements"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://idleon.wiki/wiki/Colosseum
        title: "IdleOn Wiki: Colosseum (ticket cost per arena)"
        tier: 4
        verified: 2026-10-19
        gameVersion: 2.3.540
  - id: colosseum.goal.score-achievements
    system: colosseum
    type: goal
    title: Colosseum score achievements
    scope: account
    category: nice
    unit: score
    progress:
      id: colosseum/state
      params:
        view: achievements
    milestones:
      - at: 25000
        reward: "Colosseum Contender (Dewdrop): an RNG item unlock"
      - at: 200000
        reward: "Sweet Victory (Sandstone): +2% Arcade balls an hour"
      - at: 2500000
        reward: "Cool Score! (Chillsnap): W3 Colosseum and W3 Shops EZ-Access"
      - at: 10000000
        reward: "Zero G Scorin' (Astro): +5% cash from monsters"
    text: "{line}"
    why: Each arena has one score achievement; your best score in that arena is what counts.
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: Milestone shown is the next not-completed achievement among arenas the account can reach; progress is that arena's best score. Each milestone belongs to a different arena (Dewdrop, Sandstone, Chillsnap, Astro), so the progress bar switches arena per milestone.
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/achievements.json
        title: "Toolbox game data: TaskAchA25, B34, C44, D26 thresholds and rewards"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/highScores.ts#L61
        title: Toolbox parseColosseum
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
  - id: colosseum.goal.centurion-ranks
    system: colosseum
    type: goal
    title: Centurion's Colosseum ranks
    scope: account
    category: nice
    unit: rank
    progress:
      id: colosseum/state
      params:
        view: ranks
    milestones:
      - at: 1
        reward: "High Scorer: a 200,000 score; 2 two-hour candies, 20k coins"
      - at: 2
        reward: "Colosseum Champ: all 15 waves and 350,000 in one run; candies, 50k coins"
      - at: 3
        reward: "Colosseum GDQ: three arenas cleared with 180 seconds left; 12-hour candy, 30 gems, 100k coins"
      - at: 4
        reward: "Centurio Rank: win Astro (W4); 12-hour candy, 5 Holy Pearls"
    text: "{line}"
    why: Centurion's quests after the ticket quests are a rank ladder paid in candy, gems and pearls. When your best score already meets the next rank, talk to Centurion to hand it in.
    appliesTo:
      stages:
        - from: W2-early
          to: W4-late
    confidence: H
    status: draft
    notes: Progress = count of Centurion3-6 with a non-empty completed[]. Legatus (Centurion7, Molten W5) and Glorious Gladiator (Centurion8, Whimsical W6) are out of the W1-W4 scope. The Lv55 gate (wiki) is L and not shown; which three arenas count for GDQ is L, so the GDQ milestone is never marked 'ready'.
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json
        title: "Toolbox game data: Centurion3-8 requirements and rewards"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
      - url: https://idleon.wiki/wiki/Centurion
        title: "IdleOn Wiki: Centurion"
        tier: 2
        claimDate: 2026-10-12
        verified: 2026-10-19
        gameVersion: 2.3.540
  - id: colosseum.check.start-ticket-quest
    system: colosseum
    type: check
    title: Do a ticket NPC's quest
    subject: account
    effect: next-action
    usesExpectedReturn: false
    category: nice
    priority:
      frame: by-urgency
    effortSeconds: 300
    detector:
      id: colosseum/ticket-quest-missing
    text: "Do {npc}'s quest {quest}: +{tickets:int} Colosseum tickets"
    why: "{npc} pays a Colosseum ticket for this quest, and his daily ticket is meant for players who have done his first quest."
    doneWhen:
      field: account.colosseum.npcQuests
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "Ticket rewards are game data (H): Typhoon1 1, Centurion1 1, Centurion2 2, Lonely_Hunter2 2, Lonely_Hunter3 2. The 'daily ticket needs the first quest' half is wiki-only (M) and both private test accounts contradict Toolbox's reach rule, so the why line stays soft until an in-game check. Fires only for an NPC reachable by the Toolbox rule whose quest has no completed[] entry."
    sources:
