  - id: obols.check.main-stat
    system: obols
    type: check
    title: Main-stat obols on each character
    subject: character
    effect: next-action
    category: compounding
    needsCharacter: true
    effortSeconds: 60
    detector:
      id: obols/main-stat
    text: Put the stored {stored} on {who} in place of the {equipped}
    why: "{class} uses {stat}; the {equipped} gives {offStat}, which does less for this character."
    appliesTo:
      stages:
        - from: W2-early
          to: W4-entry
    confidence: M
    status: draft
    notes: "Only pure stat obols (lines only in STR/AGI/WIS/LUK). Fires when a personal slot holds an off-stat one and a stored obol of the same shape has the character's main stat (Toolbox mainStatMap) at >= that obol's value. Dossier per-class rule: Warrior STR, Archer AGI, Mage WIS, Journeyman/Beginner LUK. M: LUK also feeds drop rate, so off-stat LUK on a farmer is never flagged."
