entries:
  - id: obols.check.swap-better
    system: obols
    type: check
    title: Swap in a better obol
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 60
    detector:
      id: obols/swap
    text: Swap the {stored} from storage in for the {equipped} on {where}
    why: It has at least as much of every stat the {equipped} gives and more of {better}, so the swap only adds.
    values:
      groupText: Swap {count:int} stored obols in for weaker ones
      detailText: "{where}: {equipped} → {stored}"
      maxDetails: 3
    appliesTo:
      stages:
        - from: W2-early
          to: W4-entry
    confidence: H
    status: draft
    notes: "Fires only for strict dominance on the same shape: every summed line of the equipped obol (final stats, rerolls included) <= the stored obol's catalogue line, one strictly greater. Stored obols are compared at base stats (their reroll maps are not parsed), so a rerolled stored obol is under-rated, never over-rated. Family slots first. No stat-type judgment (that would be L)."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/obols.ts#L60-L78
