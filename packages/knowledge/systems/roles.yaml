  - id: roles.goal.skill
    system: roles
    type: goal
    title: The team's Role skills
    scope: character
    category: compounding
    unit: role
    progress: { id: metapath/roster }
    milestones:
      - { at: 1, reward: "doing its Role" }
    text: "Doing its Role on your team"
    why: "Each class has a job on the Meta Path; a character on its job keeps that skill moving for the account."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "M4 TR-4: the Goal roles.contribution.* point at. Its progress is M2's roster (engine)."
