# M4 Purpose & Milestones (docs/specs/M4-purpose-milestones.md TR-4, D6): a character doing the skill an
# active M2 Role gives it serves the team by doing its job, even past its last door. The Roles are M2's
# (metapath.yaml); the engine checks the character holds one that owns this AFK type.
system: roles
entries:
  - id: roles.contribution.mining
    system: roles
    type: contribution
    title: Role skill
    activity: { afkType: MINING }
    goal: roles.goal.skill
    detector: { id: roles/skill, params: { afkType: MINING } }
    eta: none
    text: "Mining: its job on your team"
    why: "Your team's Roles give each class a job; this character holds the Mining Role, so its skilling is on purpose."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "D6 (b). Only an active M2 Role that owns MINING counts (meta.roles)."
    sources:
      - { url: "https://idleon.wiki/wiki/Mining", title: "IdleOn Wiki: Mining (its class)", tier: 2, claimDate: 2026-10-06, verified: 2026-10-18, gameVersion: 2.3.540, note: "The skill's info box names Warrior as its class." }
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/main/docs/specs/M2-stage-meta-path.md", title: "ActiveOn Meta Path: Roles", tier: 4, verified: 2026-10-17, gameVersion: 2.3.540 }
