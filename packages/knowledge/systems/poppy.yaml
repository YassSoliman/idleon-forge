# M6 Unspent & idle: Poppy's unconverted fish (M6 FR-18).
system: poppy
entries:
  - id: poppy.check.open
    system: poppy
    type: check
    title: Open Poppy's pond
    subject: account
    effect: next-action
    category: nice
    effortSeconds: 30
    detector: { id: poppy/pending-fish }
    text: "Open Poppy's pond to convert your fish"
    why: "Fish Poppy caught while you were away convert only when you open the pond."
    doneWhen: { field: "account.poppy.pendingFish", change: lower }
    appliesTo: { stages: all }
    confidence: M
    status: active
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/kangaroo.ts#L104", title: "Toolbox getKangaroo: pendingFish", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Poppy_the_Kangaroo_Mouse%27s_Fish_Pond", title: "IdleOn Wiki: Poppy the Kangaroo Mouse's Fish Pond", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
  # M26 FR-55 (Wave 6): Poppy's prestige buys and the Megafish ladder, promoted from poppy.drafts.yaml.
  - id: poppy.check.fisheroo-reset
    system: poppy
    type: check
    title: Fisheroo Reset ready
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 60
    detector: { id: poppy/state, params: { part: fisheroo-reset } }
    text: "Fisheroo Reset {next:int} is affordable at Poppy"
    why: "Your fish, with the ones banked since your last visit, cover the reset. Each reset gives points for the reset spirals, which multiply fish, shiny speed and upgrade prices for good."
    doneWhen: { field: account.poppy.fisherooResets, change: higher }
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "Rule = Toolbox's own Poppy alert (utility/dashboard/account.js): the upgrade is open on this run and totalFish covers its cost (H). Whether to reset at once or keep buying first is community-only (dossier C50, C52, L), so the text says 'affordable', never 'reset now'."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/kangaroo.ts#L51-L79", title: "IdleOn Toolbox getKangaroo: each upgrade's cost and its unlock by run progress", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L674-L697", title: "IdleOn Toolbox dashboard: the Fisheroo Reset alert when the upgrade is open and totalFish covers it", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Poppy_the_Kangaroo_Mouse%27s_Fish_Pond", title: "IdleOn Wiki: Poppy the Kangaroo Mouse's Fish Pond", tier: 2, claimDate: 2026-10-07, verified: 2026-10-19, gameVersion: 2.3.540 }
  - id: poppy.check.greatest-catch
    system: poppy
    type: check
    title: Greatest Catch ready
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 60
    detector: { id: poppy/state, params: { part: greatest-catch } }
    text: "Greatest Catch is affordable: Megafish {next:int}"
    why: "A Megafish stays for good: the first ones open the Tar Pit and multiply all of Poppy's bonuses, and 12 complete the Tome's Megafish row."
    doneWhen: { field: account.poppy.megafish, change: higher }
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "Rule = Toolbox's Greatest Catch alert (dashboard account.js). What each Megafish gives is Toolbox megaFishDesc (H); M because what Greatest Catch resets is game-side only."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/kangaroo.ts#L23-L36", title: "IdleOn Toolbox megaFishDesc: what each Megafish gives", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L674-L697", title: "IdleOn Toolbox dashboard: the Greatest Catch alert when the upgrade is open and totalFish covers it", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Poppy_the_Kangaroo_Mouse%27s_Fish_Pond", title: "IdleOn Wiki: Poppy the Kangaroo Mouse's Fish Pond", tier: 2, claimDate: 2026-10-07, verified: 2026-10-19, gameVersion: 2.3.540 }
  - id: poppy.goal.megafish
    system: poppy
    type: goal
    title: Megafish
    text: "Megafish {value:int} of {next:int}: {reward}"
    why: "Greatest Catch turns a run's fish into a Megafish that stays for good. Megafish 1 opens the Tar Pit, 2 and 4 multiply Poppy's bonuses, and 12 complete the Tome's Megafish row."
    scope: account
    category: compounding
    unit: megafish
    progress: { id: poppy/megafish }
    milestones:
      - { at: 1, reward: "the Tar Pit opens" }
      - { at: 2, reward: "Poppy's bonuses x1.5" }
      - { at: 3, reward: "two more reset spirals" }
      - { at: 4, reward: "Poppy's bonuses x2" }
      - { at: 12, reward: "the Tome's Megafish row, 250 points" }
    appliesTo: { stages: [{ from: W2-early, to: W4-late }] }
    confidence: H
    status: active
    notes: "Dossier C46, C12. The W3 Equinox 'Dream' needing 12 Megafish (C54) is carried from N.js (L), so it is not a milestone here."
    sources:
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/kangaroo.ts#L23-L36", title: "IdleOn Toolbox megaFishDesc: what each Megafish gives", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/tome.ts#L378", title: "IdleOn Toolbox Tome: the Megafish row reads accountOptions[279]", tier: 1, verified: 2026-10-20, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Poppy_the_Kangaroo_Mouse%27s_Fish_Pond", title: "IdleOn Wiki: Poppy the Kangaroo Mouse's Fish Pond", tier: 2, claimDate: 2026-10-07, verified: 2026-10-19, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Tome", title: "IdleOn Wiki: Tome", tier: 2, claimDate: 2026-10-12, verified: 2026-10-19, gameVersion: 2.3.540 }
