# SPDX-License-Identifier: GPL-3.0-only
# M15 F2 Construction "build this next" (docs/specs/M15-account-depth.md FR-7 to FR-13), owned by M6;
# its order is `construction.fact.build-order` (TR-6, M2's list, construction.facts.yaml). One Account
# Goal naming one building, with one Next Action per FR-9 step (`text-<form>`; the plain `text` is
# step 3, pay). A building's level is paid in the Build menu from inventory and the storage chest,
# never from the Refinery's storage (N.js @8779435, @8740784, game 2.3.540); the amount is the game's
# (D-1). In a slot and building: no Goal. The Death Note's first level is M6's (FR-12).
system: construction
entries:
  - id: construction.check.build-next
    system: construction
    type: check
    title: Build this next
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector: { id: construction/build-next, params: { parts: [W3-early] } }
    text: "Upgrade the {building:name} in the Build menu"
    why: "One building at a time, in the order that pays most now: at the Construction Table in Frostbite Tundra town, on any character. Then: {then1:name} to level {then1Level:int}, then {then2:name} to level {then2Level:int}."
    values:
      text-collect: "Collect your {salt:name} from the Refinery's storage into the chest"
      text-pay-timed: "Upgrade the {building:name} in the Build menu"
      text-slot-salt-off: "Put the {building:name} in an empty build slot"
      text-slot: "Put the {building:name} in an empty build slot at the Construction Table"
      text-swap: "Swap the {building:name} into the build slot holding the {holder:name}"
      why-lead-collect: "Then check the {building:name} in the Build menu: it upgrades when you have enough."
      why-lead-pay-timed: "It upgrades when you have its {salt:name}; you have {held:int} in storage. Its bar is full {fullIn:in}: refine it then."
      why-lead-pay: "It upgrades when you have its {salt:name}; you have {held:int} in storage."
      why-lead-slot-salt-off: "The slot is at the Construction Table. It is paid in {salt:name}, which is not running yet."
      why-then-none: "One building at a time, in the order that pays most now: at the Construction Table in Frostbite Tundra town, on any character. It is the last one on this Stage's list."
      why-then-one: "One building at a time, in the order that pays most now: at the Construction Table in Frostbite Tundra town, on any character. Then: {then1:name} to level {then1Level:int}."
    doneWhen: { field: "account.construction.buildings[*].level", change: higher }
    appliesTo: { stages: [W3-early] }
    confidence: M
    status: active
    notes: "Silent past W3-early until W3-mid and W3-late orders have a dated human Source (M15 D-7). No urgency escalation (FR-13): the game resets build progress to 0 when a full bar is claimed (N.js @8779435), but whether time past a full bar is lost is not settled, so it stays banked."
    sources:
      - { url: "https://idleon.wiki/wiki/Construction", title: "IdleOn Wiki: Construction (build the 3D Printer first)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://gist.github.com/shnaps/161a370ed795e6141e0553eb30ddc8fa", title: "shnaps, IdleOn progression gist (Construction buildings order)", tier: 3, claimDate: 2026-09-18, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/construction.ts#L433", title: "Calculated by IdleOn Toolbox (getBuildCost, getTowers)", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

  # ---- M20 F2 (docs/specs/M20-skills-parallel-slots.md FR-20, FR-21, D-9): the Cog Board seat, taken
  # over from M3 FR-27. Built by the engine module (packages/engine/src/slots) from these templates.
  - id: construction.check.cog-seat-free
    system: construction
    type: check
    title: Fill the Cog Board
    text: "{text}"
    why: "{why}"
    values:
      shelf: "Put your {who} on the Cog Shelf"
      seat: "Seat your {who} on the free Cog Board square"
      why-shelf: "In the cog inventory it earns nothing; on the Cog Shelf (Construction screen, W3 town) it makes cogs and earns Construction EXP."
      why-seat: "On the board it adds build rate for your buildings; on the shelf it makes cogs instead. Both earn the same Construction EXP."
      board-full: "Board full: place a flag to open more squares"
    sources:
      - { url: "https://idleon.wiki/wiki/Construction", title: "IdleOn Wiki: Construction (the Cog Board and the Cog Shelf)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/construction.ts", title: "Calculated by IdleOn Toolbox (the board, player build speed and EXP)", tier: 1, verified: 2026-10-18, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector: { id: construction/cog-seat-free }
    notes: "FR-20: inventory characters to the shelf first (they earn nothing there), then free open squares to the character not on the board with an active construction-builder Role, then the largest Toolbox constructionSpeed, then constructionExpPerHour, then the lower index. No build-rate number is quoted (ADR 0005)."
