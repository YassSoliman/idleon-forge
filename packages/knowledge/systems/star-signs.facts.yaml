  - id: star-signs.fact.rules
    system: star-signs
    origin: authored
    title: Star sign rules (charts, slots, Telescope, candies)
    notes: "Hydron chart above 23 and Seraph above 57 unlocked nodes among rows 0-63, node 0 always counts (N.js @7554573, @7735821). Slots 1, +1 per Cosmos (Toolbox starSignsAlerts). Alignment only on map 31 at the Telescope (@5315002). Telescope4 is an AccountWideQuests entry: the hand-in sets every other character's dialogue to 9999 (@6172997), and NewCharStuffs gives it to characters made later (@19908843, V9). A candy is refused for Lab, Cooking or no AFK Target (@8201286) and credits the current map (@5580046)."
    rows:
      chartGates: { hydron: 24, seraph: 58, countedNodes: 64 }
      cosmos: [{ sign: Chronus_Cosmos, slots: 2 }, { sign: Hydron_Cosmos, slots: 3 }]
      starters: [The_Fuzzy_Dice, The_Buff_Guy, The_Book_Worm, Flexo_Bendo]
      telescope: { mapIndex: 31, npc: Telescope, questKey: "1", bagSlots: 2, rewards: { Timecandy2: 2, Timecandy3: 2 } }
      route:
        - { mapIndex: 16, door: 1 }
        - { mapIndex: 13, door: 0 }
        - { mapIndex: 18, door: 0 }
      candies: [{ rawName: Timecandy1, hours: 1 }, { rawName: Timecandy2, hours: 2 }, { rawName: Timecandy3, hours: 4 }]
      noCandy: [LABORATORY, COOKING, Nothing]
      keys: { Key1: Forest_Villa_Key, Key2: "Efaunt's_Tomb_Key" }
      classLines: { archer: { min: 18, max: 30 }, mage: { min: 31, max: 43 }, beginner: { min: 0, max: 4 } }
    sources:
      - { url: "https://idleon.wiki/wiki/Star_Signs", title: "IdleOn Wiki: Star Signs (constellations, the three charts, sign costs, slots)", tier: 2, claimDate: 2026-10-05, verified: 2026-10-18, gameVersion: 2.3.540 }
