    sources:
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn wiki, Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: M
    status: active
