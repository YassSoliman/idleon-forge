# M7 Spend Plan (docs/specs/M7-spend-plan.md TR-6): the Spend Checks, the shared frame block and one
# Spend Priority List per Stage. Positions follow the Spend frame: 1 guards, 2 one-offs, 3-4 stamps
# (carry stamps first), 5 engine rows to the Stage's checkpoint, 6 cheap capped rows, 7 statue Gold
# (W2+), 8 the Stage's band table, last the unlock fuel. Orders are unverified (PV 7.6, 3.6, 4.4), so
# items are confidence L unless PV confirmed them (bribes 3.2, statues 3.7: M).
#
# Item conventions the engine reads (packages/engine/src/spend/candidates.ts):
#  - An item whose slug starts with "every-" sweeps its sink: every purchase of that sink not claimed by
#    an earlier item. Its ref is any Acquisition of the sink (the reference rule needs one).
#  - Every list has the frame's 9 positions; the first (W1-early) names the whole frame and later lists
#    name one anchor item per position plus their own engine rows and band table. carryForward items of
#    earlier lists keep their frame position in later lists.
#  - Bribe sweeps: target "next" covers the sets up to the Stage's world, "levels: N" N sets further. Stamp items: target "next" is the cap raise
#    (then the new levels), "to-max" the coin levels below the cap.
#  - One list per band of Stages, the Vault dossier's stage tables: W1-early (W1 to early W2), W2-mid
#    (late W2) and W3-early (W3 and W4 entry). A Stage without its own list uses the nearest earlier one.
#  - Happy Doggy (row 19) is never an item; it is bought only as unlock fuel.
system: spend
entries:
  - id: spend.check.duplicate-entries
    system: spend
    type: check
    title: Duplicate Entries before tickets
    subject: account
    effect: next-action
    category: spendable
    detector: { id: spend/duplicate-entries-guard }
    text: "Buy Duplicate Entries (Vault) on {payer} before you redeem Colosseum tickets: {coins:coins}"
    why: "Doubles every Colosseum ticket you redeem; {tickets} are waiting at the NPCs. Collecting them is fine, redeeming before it loses half."
    notes: "Ship gate (FR-12, RT-1) settled in N.js v1.23: the doubling applies when a ticket item is redeemed onto the account (TixCol drop, VaultUpgBonus 52), not on NPC collection. So collect anyway; buy it before you redeem."
    sources:
      - { url: "https://idleon.wiki/wiki/Upgrade_Vault", title: "IdleOn wiki, Upgrade Vault", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/ca0bbe5be17250f2b6d382b3cec59ba6ce58efb0/docs/research/systems/account-wide/upgrade-vault.md", title: "Vault dossier, min-max by stage", tier: 4, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
  - id: spend.check.hydrogen-hold
    system: spend
    type: check
    title: Hold stamp cap raises for the Hydrogen discount
    subject: account
    effect: next-action
    category: spendable
    detector: { id: spend/stamp-hydrogen }
    text: "Hold stamp cap raises: discount {discount}%, {needed}% needed for {stamp}, about {days} days"
    why: "Any cap raise resets the Hydrogen discount, and only the first raise gets it; {stamp} fits in an inventory once the discount reaches {needed}%."
    sources:
      - { url: "https://idleon.wiki/wiki/Atom_Collider", title: "IdleOn wiki, Atom Collider (Hydrogen)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn wiki, Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: M
    status: active
  - id: spend.check.stamp-not-ready
