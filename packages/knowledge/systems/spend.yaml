    type: check
    title: Stamp cap raises that need materials or carry capacity
    subject: account
    effect: next-action
    category: nice
    detector: { id: spend/stamp-raise-ready }
    text: "{count} stamp cap raises need more of their material or more carry capacity"
    why: "A cap raise needs its material in storage and one character able to carry it; until then it is not a Spend line."
    values:
