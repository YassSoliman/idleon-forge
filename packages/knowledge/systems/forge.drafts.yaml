      id: forge/brimstone-ore
    text: Smelt {ore:name} in your Brimstone slots, not {current:name}
    why: Brimstone slots smelt 1.5x faster, so they pay most on the slowest ore you can keep them full of.
    notes: "Dossier per-session action 'scarcest bar on Brimstone slots' and common mistake 'smelting copper in a Brimstone slot'. Rule: among ores the account holds enough of for at least 10 bars, the one with the highest Cooldown; fires when a Brimstone slot smelts a lower-Cooldown ore. Brimstone's +50% multi-bar (in-game text) is unmodelled by Toolbox and not used."
