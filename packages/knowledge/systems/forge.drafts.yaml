  - id: forge.check.runs-out-before-return
    system: forge
    type: check
    title: Forge runs dry while you're away
    subject: account
    effect: next-action
    usesExpectedReturn: true
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: forge/runs-out-before-return
    text: "Top up {slots:int} Forge slots: empty {emptyIn:in}"
    values:
      pill: Forge dry · top up
      pill-soon: Forge dry {emptyIn:in} · top up
      timelineKind: storage
      timelineWhat: forge
    why: At this speed the slot smelts its ore in {emptyIn:duration}, before your return. Filling it to capacity ({capacity:int} ore) keeps it running {fullRun:duration}.
    notes: "Fires only when topping up changes the outcome (anvil #70 A5 precedent): the slot is smelting, empties before the Expected Return, and the account holds more of that ore. When capacity itself is shorter than the stretch, the text still fires once and the Forge page shows capacity as the limit (dossier 'capacity too small for AFK'). Speed-barrel slots use Toolbox's two-phase time (barrel cycles, then base speed)."
    doneWhen:
      field: account.forge.slots[*].emptyAt
      change: higher
    appliesTo:
      stages: all
    confidence: H
    status: draft
    sources:
