  - id: forge.check.fill-empty-slots
    system: forge
    type: check
    title: Fill your empty Forge slots
    subject: account
    effect: next-action
    usesExpectedReturn: true
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 90
    detector:
      id: forge/idle-slots
    text: Fill {idle:int} empty Forge slots with {ore:name}
    values:
      detail-more: You also hold {others}
      timelineKind: storage
      timelineWhat: forge
    why: An unlocked slot without enough ore for one bar smelts nothing. You hold {held:int} {ore:name}, enough for {bars:int} bars.
    notes: "Counts only unlocked slots (index < New Forge Slot level); Toolbox's emptySlots alert counts all 16 rows, locked ones included (M21). A slot whose ore is below the ore's Amount counts as empty: the leftover never smelts (M2). Ore choice: the forgeable ore held in storage and bags with the highest Cooldown that fills at least one slot to capacity, else the most-held one; no tier 1-3 Source gives an ore order, so the text names one ore and lists the rest."
    doneWhen:
      field: account.forge.slots[*].ore.amount
      change: higher
    appliesTo:
      stages: all
    confidence: H
    status: draft
