  - id: forge.check.idle
    system: forge
    type: check
    title: Load the Forge
    subject: account
    effect: next-action
    category: spendable
    effortSeconds: 60
    detector:
      id: forge/idle
    text: "{text}"
    why: "{why}"
    values:
      empty: Load ore into {n:int} empty Forge slots
      empty-all: "The Forge is idle: load ore into all {n:int} slots"
      collect: " and collect {bars}"
      why: A slot with no ore makes no bars. Bars feed every metal recipe and Anvil Tab; the Forge runs while you're away.
      detail: "Slot {slot:int}: {state}"
      state-empty: no ore
      state-low: "{ore} runs out {emptyIn:in}"
    notes: "A slot counts when it is unlocked (index < New Forge Slot level; confirm the base slot count in game, OQ-F1) and its ore is Blank or below one cycle's ore.Amount (a leftover below ore.Amount never smelts, forge.ts). Bars waiting are the existing account.forgeOutput. kb-convert: category idle -> spendable"
    appliesTo:
      stages: all
    confidence: H
    status: draft
    sources:
