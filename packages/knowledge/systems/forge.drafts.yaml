  - id: forge.check.collect-bars
    system: forge
    type: check
    title: Collect your Forge bars
    subject: account
    effect: next-action
    category: nice
    priority:
      frame: by-urgency
    effortSeconds: 20
    detector:
      id: forge/collect-bars
    text: Collect {bars:int} bars from the Forge
    values:
      detail: "{list}"
    why: Bars wait in the Forge's output until you collect them; the Anvil, stamps and vials only use bars in storage or a bag.
    notes: "Confidence M: the per-session 'collect bars' action is H in the dossier, but no Source says the output slot caps or blocks smelting. Suppressed when a Walkthrough already emits its 'in the Forge: collect' step for the same bar (engine/src/walkthrough/build.ts L366), so the two never show twice."
