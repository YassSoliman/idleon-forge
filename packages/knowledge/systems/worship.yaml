# SPDX-License-Identifier: GPL-3.0-only
# M3 AFK Safety: worship charge caps (docs/specs/M3-afk-safety.md FR-19, D2). Split into two entries
# because one entry had one effect (RT-12): a blocker with a skull, a Next Action without one. Since
# R-PILL-1 (owner, 2026-10-17) both are cap pills ("Worship full · spend"), never blockers.
system: worship
entries:
  - id: worship.check.charge-caps-skull
    system: worship
    type: check
    title: Worship charge fills while you're away
    text: "Spend worship charge, or let the Wizard's Charge Syphon take it"
    values:
      timelineKind: production
      timelineWhat: "worship charge"
      fill: worship charge
      pill: "Worship full · spend"
      pill-soon: "Worship full {fullIn:in} · spend"
    why: "Charge {charge:int} of {max:int}; full {fullIn:in}. Charge stops building at its maximum, so a full bar wastes every hour you're away."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/worship.ts
        title: IdleOn Toolbox, getPlayerWorship (charge, max and rate)
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Worship", title: "IdleOn Wiki: Worship", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: character
    effect: next-action
    category: nice
    usesExpectedReturn: true
    detector: { id: worship/charge-caps-skull }

  - id: worship.check.charge-caps-no-skull
    system: worship
    type: check
    title: Worship charge is full
    text: "Spend worship charge or Syphon it"
    values:
      timelineKind: production
      timelineWhat: "worship charge"
      fill: worship charge
      pill: "Worship full · spend"
      pill-soon: "Worship full {fullIn:in} · spend"
    why: "Full {fullIn:in}. Without a skull the bar is small, so this is worth a minute when you have one, but it never blocks."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/worship.ts
        title: IdleOn Toolbox, getPlayerWorship (charge, max and rate)
        tier: 1
        verified: 2026-10-17
        gameVersion: 2.3.540
      - { url: "https://idleon.wiki/wiki/Worship", title: "IdleOn Wiki: Worship", tier: 2, claimDate: 2026-10-07, verified: 2026-10-17, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: character
    effect: next-action
    category: nice
    usesExpectedReturn: true
    detector: { id: worship/charge-caps-no-skull }

  # ---- M20 F2 (docs/specs/M20-skills-parallel-slots.md FR-22, D-11): one account line for skulls.
  - id: worship.check.no-skull
    system: worship
    type: check
    title: Worship skulls
    text: "{text}"
    why: "{why}"
    values:
      many: "Buy a Wax Skull for each of {n:int} characters"
      one: "Buy a Wax Skull for your {who} at the Frostbite Towndra shop"
      why: "Wax Skulls are sold at the Frostbite Towndra shop. Without a skull, charge stops at {max:int}; a Wax Skull doubles that cap and charges faster."
      detail: "{who}: {charge:int} of {max:int} charge"
      detail-full: "{who}: full, {charge:int} of {max:int} charge"
    sources:
      - { url: "https://idleon.wiki/wiki/Worship", title: "IdleOn Wiki: Worship (Wax Skull, Frostbite Towndra; max charge 100)", tier: 2, claimDate: 2026-10-07, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/worship.ts", title: "Calculated by IdleOn Toolbox (getMaxCharge without a skull)", tier: 1, verified: 2026-10-18, gameVersion: 2.3.540 }
    appliesTo: { stages: all }
    confidence: H
    status: active
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector: { id: worship/no-skull }
    notes: "FR-22: fires once the Frostbite Towndra vendor is reachable (currentWorld 3) and a character has no skull. The wiki gives no vendor price (5,000 is the item's sell price), so the line quotes none; the buyer line waits for a verified price."
