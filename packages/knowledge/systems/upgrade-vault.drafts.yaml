  - id: upgrade-vault.check.baby-on-board-idle
    system: upgrade-vault
    type: check
    title: Baby on Board pays nobody
    subject: account
    effect: next-action
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: upgrade-vault/baby-on-board
    text: "Baby on Board (Lv {level:int}) gives no Class EXP: {reason}"
    values:
      reason-merit: buy 1 level of the W1 merit "EXP Gain for the lowest leveled character"
      reason-tie: two characters tie for the lowest level ({lowest:int}); level one of them
    why: The Vault row and the merit only pay the one character whose level is strictly below every other's, and only once that merit has a level.
    doneWhen:
      field: account.merits[0].rows[2].level
      change: higher
    appliesTo:
      stages: all
    confidence: H
    status: draft
    notes: "Dossier C7 (Disputed/Corrected, H after correction): isLowestLevel = meritLevel > 0 && strictly lowest. Fires only when row 12 has levels, so coins were spent on it."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L1929-L1942
        title: "Toolbox: isLowestLevel needs tasks[2][0][2] > 0 and a strict minimum"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
  - id: upgrade-vault.check.mastery-unbought
    system: upgrade-vault
    type: check
    title: Open Vault Mastery
    subject: account
    effect: next-action
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 30
    detector:
      id: upgrade-vault/row-unbought
      params:
        rows:
          - 32
          - 61
    text: "Buy {row:name} on {payer}: {coins:coins}"
    why: Each Vault Mastery level multiplies every other row of its Vault by +1%, so it lifts the levels you already own.
    doneWhen:
      field: account.spend.vault.rows[{index}].level
      change: higher
    appliesTo:
      stages:
        - from: W2-mid
          to: W4-entry
    confidence: M
    status: draft
    notes: Dossier common mistake 'forgetting Vault Mastery after 1050' and detection rule C74 (tier 1-derived, M). Suppress when the Spend Plan's first line is already this row (no double advice).
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc/upgradeVault.ts#L210-L268
