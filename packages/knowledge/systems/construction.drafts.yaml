  - id: construction.check.flag-done
    system: construction
    type: check
    title: Move your finished flag
    subject: account
    effect: next-action
    usesExpectedReturn: true
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 30
    detector:
      id: construction/flag-done
    text: Move the flag off the square it finished to a locked one
    why: That square is open. A flag left on it fills nothing while {locked:int} squares are still locked.
    values:
      text-soon: "A Cog Board flag finishes {doneIn:in}: move it then"
      timelineKind: storage
      timelineWhat: cog-flag
    doneWhen:
      field: account.cogBoard.flags[*].square
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: M
    status: draft
    notes: "Dossier per-session action and common mistake ('finished flag left placed'); the save keeps FlagsPlaced per index and FlagUnlock -11 = done (C13/H). Not verified: whether the game lifts a finished flag on its own (if it does, the check is silent by construction because flagPlaced is false). The 'soon' form only feeds the Timeline (nextAt = earliest (required - current) / flagSpeed), plain arithmetic on Toolbox numbers (ADR 0005). M26 W3 synth (from maps/cog-board.json). kb-convert: doneWhen.change any -> changed"
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/construction.ts#L97
