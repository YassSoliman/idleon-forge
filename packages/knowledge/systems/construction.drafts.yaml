  - id: construction.check.cog-swap-better
    system: construction
    type: check
    title: Swap in a better cog
    subject: account
    effect: next-action
    usesExpectedReturn: false
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 45
    detector:
      id: construction/cog-swap-better
    text: Swap the cog in row {row:int}, column {col:int} for a stronger one from your inventory
    why: Your inventory holds a cog with {better:int} Build Rate; the board cog there has {worse:int}.
    doneWhen:
      field: account.cogBoard.buildRate
      change: higher
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: M
    status: draft
    notes: "Plain arithmetic on Toolbox numbers (ADR 0005): for non-boost board cogs and non-boost spares only, gain = (spare.a - board.a) x (1 + sum e of boosters reaching that square / 100) (C6/H). Pick the largest gain; tie -> lower square. Ignores flaggy/EXP stats, matching Toolbox's default objective totalBuildRate; confidence M because a swap can lower Flaggy Rate (c) and the dossier gives no stat weighting Source. M26 W3 synth (from maps/cog-board.json)."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/constructionOptimizer.ts#L951
        title: "IdleOn Toolbox evaluateBoard: buildRate = a x (1 + sum e / 100) (vendored constructionOptimizer.ts#L951-998)"
        tier: 1
        verified: 2026-10-19
        gameVersion: 2.3.540
