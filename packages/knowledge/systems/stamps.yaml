  - id: stamps.priority.acquire
    system: stamps
    type: priority
    title: Stamp acquisition order
    list: order
    text: "Stamps in the order to collect them"
    why: "Carry stamps first, because every later cap raise needs the carry space; then Anvil Zoomer, Fishing Rod and Catch Net; then the rest, cheapest route first."
    appliesTo: { stages: all }
    confidence: L
    status: active
    notes: "Lists only stamps with a shop or quest route in W1–W3 (the routes M8 ships; TR-12 and the bundle budget); every other stamp, W4's included, counts as later. PV 3.6 is unverified."
    sources:
      - { url: "https://github.com/YassSoliman/idleon-forge/blob/research/w1-systems/docs/research/systems/w1-systems/stamps.md#min-max-by-stage", title: "W1 stamps dossier: min-max by stage", tier: 3, claimDate: 2026-10-17, verified: 2026-10-17, gameVersion: 2.3.540, verification: unverified, note: "Carry stamps first, then Anvil Zoomer, Fishing Rod and Catch Net (PV 3.6 unverified)." }
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn Wiki: Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540 }
    tiers:
      # Carry stamps: Matty Bag, Lil' Mining Baggy, Choppin' Bag, Mason Jar.
      - [stamps.acquisition.stamp-b8, stamps.acquisition.stamp-b4, stamps.acquisition.stamp-b6, stamps.acquisition.stamp-c2]
      # Anvil Zoomer, Fishing Rod, Catch Net.
      - [stamps.acquisition.stamp-b3, stamps.acquisition.stamp-b17, stamps.acquisition.stamp-b19]
      # The rest: shop buys, then hand-ins, then custom quests, each by world.
      - - stamps.acquisition.stamp-a12
        - stamps.acquisition.stamp-a3
        - stamps.acquisition.stamp-a5
        - stamps.acquisition.stamp-a6
        - stamps.acquisition.stamp-a15
        - stamps.acquisition.stamp-c11
        - stamps.acquisition.stamp-a14
        - stamps.acquisition.stamp-a16
        - stamps.acquisition.stamp-a26
        - stamps.acquisition.stamp-a4
        - stamps.acquisition.stamp-a9
        - stamps.acquisition.stamp-c6
        - stamps.acquisition.stamp-c7
        - stamps.acquisition.stamp-a28
        - stamps.acquisition.stamp-b20
        - stamps.acquisition.stamp-b22
        - stamps.acquisition.stamp-a18
        - stamps.acquisition.stamp-a21
        - stamps.acquisition.stamp-b26
        - stamps.acquisition.stamp-a19
        - stamps.acquisition.stamp-c1
        - stamps.acquisition.stamp-a24
        - stamps.acquisition.stamp-b14
        - stamps.acquisition.stamp-b18
        - stamps.acquisition.stamp-c14
        - stamps.acquisition.stamp-c18
        - stamps.acquisition.stamp-a22
        - stamps.acquisition.stamp-a25
        - stamps.acquisition.stamp-c15
        - stamps.acquisition.stamp-c20

  # ---- M4 Purpose & Milestones (TR-4): gathering a stamp's cap-raise material ----
  - id: stamps.goal.cap-material
    system: stamps
    type: goal
    title: Stamp cap raise materials
    scope: account
    category: compounding
    unit: items
    progress: { id: stamps/status, params: { view: collect } }
    milestones:
      - { at: 1, reward: "an owned stamp's next cap raise" }
    text: "Materials for the next stamp cap raises"
    why: "A stamp's max level rises only when you pay its material; gathering it lets you keep buying levels."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "M4 TR-4: the Goal stamps.contribution.material-* point at. The shortfall is M7's worker price (spend.stamps[].raise), never the parsed gilded price."
    sources:
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn Wiki: Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-18, gameVersion: 2.3.540, note: "Stamps level with coins and their material." }
