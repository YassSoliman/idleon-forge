# SPDX-License-Identifier: GPL-3.0-only
# M8 Collections: stamp acquisition (docs/specs/M8-collections.md FR-1 to FR-12, TR-4). Buying stamp
# levels and raising caps is M7's Spend Plan. Every route is a generated Acquisition
# (stamps.acquisition.<slug>, generators/stamps.gen.ts); these entries hold only the words, the order
# and the judgment. The engine module is packages/engine/src/collections (Detector stamps/status).
system: stamps
entries:
  - id: stamps.goal.collect
    system: stamps
    type: goal
    title: Stamps collected
    scope: account
    category: nice
    unit: stamps
    progress: { id: stamps/status, params: { view: collect } }
    milestones:
      - { at: 25, reward: "25 stamps collected" }
      - { at: 50, reward: "50 stamps collected" }
      - { at: 75, reward: "75 stamps collected" }
    text: "Stamps {owned:int} of {obtainable:int} · {now:int} now · {active:int} with active play · {toward:int} in progress · {later:int} later"
    why: "Each collected stamp is a permanent bonus; later ones need a new world, an earlier quest or a drop nobody is farming."
    values:
      unknownText: "Stamps: can't tell right now"
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "Show-more line (nice, unlisted). 'later' is a count only (FR-9). unknownText is shown when a section M8 needs failed (FR-26, US-9)."
    sources:
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn Wiki: Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540, note: "Lists each stamp's source and the 7 unobtainable stamps." }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/stamps.json", title: "Toolbox game data: stamps", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

  - id: stamps.check.shop-now
    system: stamps
    type: check
    title: New stamps from town shops
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 300
    detector: { id: stamps/status, params: { view: shop-now } }
    text: "Buy {count:int} new stamps from town shops on one trip: {stamps}"
    why: "A stamp you don't own gives nothing; these town shops have them in stock now for coins (the game data has no buy price, so check your coins)."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "D1: one account Goal for every shop buy, towns in world then shop order, stamps in stamps.priority.acquire order. Confidence M: the pinned shop data carries no price (TR-8 rule 5), so affordability isn't checked (FR-3)."
    sources:
      - { url: "https://idleon.wiki/wiki/Vitality_Stamp", title: "IdleOn Wiki: Vitality Stamp (sold in Encroaching Forest Villas)", tier: 2, claimDate: 2026-09-12, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Matty_Bag_Stamp", title: "IdleOn Wiki: Matty Bag Stamp (sold in Faraway Piers)", tier: 2, claimDate: 2026-09-12, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json", title: "Toolbox game data: town shops", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

  - id: stamps.check.handin-now
    system: stamps
    type: check
    title: A stamp quest you can hand in now
    subject: character
    effect: next-action
    category: compounding
    needsCharacter: true
    effortSeconds: 300
    detector: { id: stamps/status, params: { view: handin-now } }
    text: "{action} → {stamps}{note}"
    why: "{quest} is open on this character and you already hold what it needs, so the stamp costs one trip."
    appliesTo: { stages: all }
    confidence: H
    status: active
    notes: "FR-4, FR-5 (craft one level deep, or buy then hand in), FR-7 look-ahead, TR-6 carry caveat, D4 shared-resource note. Equipped items never count."
    sources:
      - { url: "https://idleon.wiki/wiki/Hamish", title: "IdleOn Wiki: Hamish (Copper Chopper for the Tomahawk Stamp)", tier: 2, claimDate: 2026-10-12, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://idleon.wiki/wiki/Snouts", title: "IdleOn Wiki: Snouts (30 Redox Salts for the Buckler Stamp)", tier: 2, claimDate: 2026-09-27, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json", title: "Toolbox game data: quests", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

  - id: stamps.check.held-now
    system: stamps
    type: check
    title: A stamp you already have
    subject: character
    effect: next-action
    category: compounding
    effortSeconds: 30
    detector: { id: stamps/status, params: { view: held-now } }
    text: "{where} {stamp}{place}"
    why: "This stamp item is in your bag or storage but not collected, so its bonus isn't on yet."
    values:
      groupText: "Use the {stamp}: {characters:int} characters carry one"
    appliesTo: { stages: all }
    confidence: H
    status: active
    notes: "FR-2a. A stamp item in a character's bag goes on that row; one in storage goes in the Account section."
    sources:
      - { url: "https://idleon.wiki/wiki/Stamps", title: "IdleOn Wiki: Stamps", tier: 2, claimDate: 2026-10-05, verified: 2026-10-17, gameVersion: 2.3.540, note: "Stamps are collected by using the stamp item." }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/stamps.json", title: "Toolbox game data: stamps", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

  - id: stamps.check.quest-toward
    system: stamps
    type: check
    title: Stamps in progress
    subject: character
    effect: next-action
    category: nice
    detector: { id: stamps/status, params: { view: quest-toward } }
    text: "{quest}: {gap} → {stamps}{note}"
    why: "This stamp is within reach but needs more of something first; it isn't a task for today."
    appliesTo: { stages: all }
    confidence: M
    status: active
    notes: "FR-8, FR-12: show-more lines (nice, unlisted), never a Next Action that ranks; a shop that's sold out restocks. Drop ETAs are at base rate (R6)."
    sources:
      - { url: "https://idleon.wiki/wiki/Snouts", title: "IdleOn Wiki: Snouts", tier: 2, claimDate: 2026-09-27, verified: 2026-10-17, gameVersion: 2.3.540 }
      - { url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json", title: "Toolbox game data: quests", tier: 1, verified: 2026-10-17, gameVersion: 2.3.540 }

