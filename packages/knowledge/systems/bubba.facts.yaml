        - { id: kanumar, name: "Kanumar", date: "2025-12-13", until: 6 }
      targets:
        - { source: gameslikefinder, from: 1, levels: [45, 15, 15, 0, 0, 0] }
        - { source: gameslikefinder, from: 4, levels: [120, 120, 0, 0, 0, 0] }
        - { source: gameslikefinder, from: 6, levels: [80, 100, 30, 0, 120, 0] }
        - { source: gameslikefinder, from: 9, levels: [80, 100, 30, 0, 120, 20] }
        - { source: kanumar, from: 1, levels: [120, 120, 0, 0, 0, 0] }
    sources:
      - { url: "https://gameslikefinder.com/article/idleon-bubba-guide/", title: "gameslikefinder: Idleon Bubba Seal Guide (Charisma targets per Megaflesh)", tier: 3, claimDate: 2026-05-27, verified: 2026-10-18, gameVersion: 2.3.540 }
      - { url: "https://www.youtube.com/watch?v=Tz1ow2H_6aA", title: "Kanumar: Bubba guide, Megaflesh 1-6 (Rizz first, then Hustle, to 120)", tier: 3, claimDate: 2025-12-13, verified: 2026-10-18, gameVersion: 2.3.540 }
