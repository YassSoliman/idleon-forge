  # Joy, Courage, Mindful, Savvy), 0 for no target. Contested on the first attribute: bubba.priority.charisma.
  - id: bubba.fact.charisma-targets
    system: bubba
    origin: authored
    title: Charisma Chart community targets
    rows:
