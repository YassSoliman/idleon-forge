  - id: drop-rate.check.clover-shrine-farmer
    system: drop-rate
    type: check
    title: Clover Shrine away from your loot farmer
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector:
      id: drop-rate/clover-shrine-farmer
    text: "Move the Clover Shrine to {map:name}: +{bonus:int}% drop rate for the {who}"
    why: The Clover Shrine's drop rate counts only for characters on its own map, and your loot farmer is somewhere else.
    doneWhen:
      field: account.shrines[4].mapId
      change: changed
    appliesTo:
      stages:
        - from: W3-early
          to: W4-late
    confidence: M
    status: draft
    notes: "Fires when Clover Shrine (account.shrines index 4) level >= 1, the loot farmer (account.dropRate.bestFighterIndex, or the fighting character a Walkthrough farm step names) is FIGHTING on a map != shrine mapId, and neither Shrine World Tour (same world) nor Moai Head applies. bonus = (1 + passive card/100) x ((level-1) x 3 + 15). Same rule family as shrines.check.idle/stack (shrines map): when both fire for the Clover Shrine show this one only. Map-scoping is H (code); 'move the shrine to the farmer' is derived (M)."
