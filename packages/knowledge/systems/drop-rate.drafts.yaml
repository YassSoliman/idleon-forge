  - id: drop-rate.check.next-lever
    system: drop-rate
    type: check
    title: Cheapest drop rate step
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 300
    detector:
      id: drop-rate/levers
    text: "{lever}: drop rate {from}x → {to}x on the {who}"
    why: "{leverWhy}"
    values:
      why-bubble: "Droppin' Loads is an account-wide bubble: every level adds drop rate to all your characters."
      why-post-office: The Non Predatory Loot Box adds up to +33% drop rate on that character, and its second line adds LUK.
      why-stamp: "Golden Sixes is an account-wide stamp: +% drop rate for every character."
      why-guild: Gold Charm gives every guild member drop rate, up to +20% at level 50.
      why-arcade: The arcade drop row adds up to +15% drop rate for all characters.
      why-equinox: Faux Jewels adds +5% drop rate per level for all characters, up to +30%.
      why-efaunt: The Efaunt set gives +25% drop rate to every character once registered.
      why-card: "{card} adds drop rate while equipped; your loot farmer has a free or off-task slot."
    doneWhen:
      field: account.dropRate.best
      change: higher
    appliesTo:
      stages: all
    confidence: M
    status: draft
    notes: "One Next Action at a time: the top of drop-rate/levers. Formulas per lever are tier 1 (H, drop-rate dossier A5, A8, A12, A18, A19, A25, A26, A9). Shown on the Drop Rate page in full; on Now only when the Walkthrough has an open farm step (drops matter now). Never suggests LUK past ~2500 (dossier E3) or Midas Minded (curse; prayers map holds it, L). kb-convert: text: < and > spelled out"
