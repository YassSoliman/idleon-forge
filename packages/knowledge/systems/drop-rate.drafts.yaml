  - id: drop-rate.priority.levers
    system: drop-rate
    type: priority
    title: Drop rate levers
    text: Raise drop rate with the lever that adds most for its cost
    why: Most of your drop rate is one additive sum, so a cheap new source beats one more level of a source you already stack.
    notes: "Order is computed, not authored: drop-rate/levers ranks each reachable free lever (Clover Shrine, Droppin' Loads, Post Office Non Predatory Loot Box, Golden Sixes stamp, Gold Charm, arcade drop row, Equinox Faux Jewels, Efaunt set, DR cards) by new total / old total on the loot farmer, using Toolbox's own breakdown (each additive % is scaled by the multiplier layer above it). Real-money levers (bun_v, bun_p, companions) show as owned or not only, never ranked or suggested. Upgrade Vault Drops for Days stays in the Spend Plan (spend item max-drops-for-days)."
    sources:
