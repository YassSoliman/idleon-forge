  - id: death-note.check.overkill
    system: death-note
    type: check
    title: This fighter earns no multikill here
    subject: character
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 30
    detector:
      id: death-note/overkill
    text: "{who} doesn't overkill {monster:name} ({reason}), so multikill gives no extra kills there"
    why: Multikill only fires while a character's max damage is at least 2x the monster's HP and its accuracy beats 1.5x the monster's Defence; below that, Death Note ranks add nothing to this fight.
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: M
    status: draft
    notes: "Mechanic H (damage.ts L1511, overkill = maxDamage >= 2 x HP AND towersTwo > 0.5 AND accuracy > 1.5 x Def). Advice M: some fights are worth it without overkill (EXP, cards, quests), so this is a hint, never a Verdict. reason slot: 'damage under 2x HP' | 'accuracy under 1.5x Defence'. Silent while the building is Lv 0. M26 W3 synth (from maps/death-note.json)."
    sources:
      - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts#L1503-L1760
