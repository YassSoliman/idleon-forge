entries:
  - id: death-note.check.cheap-point
    system: death-note
    type: check
    title: Take the cheapest Death Note point
    subject: account
    effect: next-action
    category: compounding
    priority:
      frame: by-urgency
    effortSeconds: 30
    detector:
      id: death-note/cheap-point
    text: "{monster:name} is {left:int} kills from its next Death Note point ({rank}): move a fighter there"
    why: Rank points get dearer as a monster climbs (25k kills for the first, 4M for the step from 1M to 5M), so the lowest monsters of a world are always the cheapest points, and each point adds multikill per damage tier in that world.
    doneWhen:
      field: account.deathNotePages
      change: higher
    appliesTo:
      stages:
        - from: W3-early
          to: W4-entry
    confidence: M
    status: draft
    notes: "Dossier Min-max line 1 (derived from tier-1 thresholds, no community priority list retrievable: M). Fires only with the building at Lv >= 1 (else ranks bank: death-note.check.build owns that), only for monsters on maps the account reaches, only when no character fights it, and only when left <= 20% of the step. W3-early start: before the building the ranks pay nothing. M26 W3 synth (from maps/death-note.json)."
    sources:
