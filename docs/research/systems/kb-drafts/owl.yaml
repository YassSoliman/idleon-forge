- id: owl.check.mega-reset
  system: owl
  type: check
  title: Great Mega Reset ready
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 60
  detector:
    id: owl/state
    params:
      part: mega-reset
  text: '{text}'
  why: '{why}'
  values:
    text: 'Buy The Great Mega Reset at Orion: Megafeather {next:int} ({label})'
    why: Each Megafeather is permanent. Leftover feathers are lost at the reset, so buy Bonuses of Orion first.
    detail-bonuses: First buy Bonuses of Orion {level:int} ({stat}) with the leftover
    label-1: feathers x10
    label-2: Orion's bonuses x2
    label-3: costs -1% per Feather Generation level
    label-4: Orion's bonuses x3
    label-5: cheapeners add feathers/sec
    label-6: Orion's bonuses x4
    label-7: Restart gives x5
    label-8: Orion's bonuses x5
    label-9: Feather Generation cost grows slower
    label-10: Orion's bonuses x6
    label-more: Orion's bonuses +0.5x more
  notes: 'Rule = Toolbox megaFeatherRestart alert: nextLvReq === 0 && feathers >= upgrades[8].cost. OPEN before
    active: the wiki says ''There are 10 in total'' while Toolbox code makes the 10th slot endless (MF-9, 2.3.540);
    both test accounts sit at 12 Megafeathers with the reset ''affordable'' by ~1e6x, which may mean an in-game
    cap or extra gate the parser does not model. QA in game; if a cap exists add it as a param and stay silent at
    the cap. Labels are ours; game text in owl.fact.megafeathers.'
  doneWhen:
    field: account.owl.megafeathers
    change: higher
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L405-L421
    title: Toolbox dashboard alerts featherRestart / megaFeatherRestart (unlocked and feathers >= cost)
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/owl.ts#L146-L172
    title: 'Toolbox parsers/world-1/owl.ts: megaFeathers, getMegaFeather'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: owlData (costs, unlocks, upgrade texts)'
