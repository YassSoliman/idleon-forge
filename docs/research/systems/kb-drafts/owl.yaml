  type: check
  title: Start Orion
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: owl/state
    params:
      part: start
  text: Visit Orion at the Grand Owl Perch in Blunder Hills and follow the HOOT popups
  why: Orion makes feathers on his own and turns them into permanent Class XP, damage, Skill XP, Drop Rate and All
    Stats for every character.
  notes: Fires when accountOptions[253] (feathers) and [263] (progress) are both 0 (the Toolbox alert's own guard
    is [253] > 0). Location from the wiki only (C3 M).
