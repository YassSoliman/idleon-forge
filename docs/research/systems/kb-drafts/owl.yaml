    params:
      part: bonuses
  text: '{text}'
  why: '{why}'
  values:
    text: 'Buy Bonuses of Orion {level:int}: +{delta} {stat} for the whole account'
    why: It is the only Orion upgrade that never resets, and every level is a permanent stat for every character.
  notes: 'Fires when upgrades[1].cost <= feathers. Silent while the restart or mega-reset Check fires (it is their
    detail then), like bubba.check.boon under bubba.check.megaflesh. stat/delta from the 6-step cycle: base*multiplier
