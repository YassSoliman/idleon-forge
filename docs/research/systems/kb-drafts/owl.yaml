entries:
- id: owl.check.restart
  system: owl
  type: check
  title: Feather Restart ready
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 30
  detector:
    id: owl/state
    params:
      part: restart
  text: '{text}'
  why: '{why}'
  values:
    text: 'Buy Feather Restart {next:int} at Orion: feathers x{multi}'
    why: Restart multiplies all feather generation for good; Bonuses of Orion is kept, so buy it first with what
      you hold.
    detail-bonuses: First buy Bonuses of Orion {level:int} ({stat}) with the leftover
  notes: 'Rule = Toolbox featherRestart alert: (nextLvReq === 0 || upgrades[4].nextLvReq < nextLvReq) && feathers
    >= upgrades[4].cost. ''Spend leftover on Bonuses of Orion first'' rests on owlData texts (Restart ''Reset almost
    all Upgrades and Feathers''; BoO ''This upgrade never resets''), C35 M.'
  doneWhen:
    field: account.owl.restarts
    change: higher
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L405-L421
    title: Toolbox dashboard alerts featherRestart / megaFeatherRestart (unlocked and feathers >= cost)
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/owl.ts#L77-L89
    title: 'Toolbox parsers/world-1/owl.ts: upgrade cost, nextLvReq, unlocked'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: owlData (costs, unlocks, upgrade texts)'
    tier: 1
    verified: '2026-10-19'
