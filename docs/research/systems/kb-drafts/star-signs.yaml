  type: goal
  title: Infinite Star Signs
  text: '{text}'
  why: '{why}'
  values:
    locked: 'Infinite Stars opens in the Rift: then your first 5 unlocked signs count on every character'
    open: '{n:int} Infinite signs on every character: {signs}'
    next: 'Next Infinite sign: {sign} ({how})'
    how-unlock: unlock it on the Star Chart
    how-shiny: level a shiny pet with the Infinite Star Signs passive
