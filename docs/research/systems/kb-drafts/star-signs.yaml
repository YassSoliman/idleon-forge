    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Star_Signs
    title: 'IdleOn Wiki: Star Signs (slots, charts, Infinite Star Signs)'
    tier: 2
    claimDate: 2026-10-05
    verified: 2026-10-19
    gameVersion: 2.3.540
  notes: 'Dossier C8, C9, C36. Past W4-entry, where goal.signs stops: fires when pointsUnspent covers the next node(s)
    in the M16 chart order (the same leg lists on star-signs.goal.signs), so it never contradicts the M16 bank rule.'
- id: star-signs.check.more-characters
