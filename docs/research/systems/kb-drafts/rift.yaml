- id: rift.goal.next-bonus
  system: rift
  type: goal
  title: Reach the next Rift bonus
  detector:
    id: rift/next-bonus
  text: "Rift level {level:int} → {at:int}: {bonus}"
  why: "Every 5th Rift level unlocks a permanent account-wide bonus; {left:int} more levels to go."
  values:
    bonus-5: "Trap Box Vacuum: the World 3 trapper drone collects traps every 24 h"
    bonus-10: "Infinite Stars: your first 5 Star Signs count as worn by everyone"
    bonus-15: "Skill Mastery: account-wide skill totals of 150 / 200 / 300 / 400 / 500 / 750 / 1000 unlock bonuses"
    bonus-20: "Eclipse Skulls: Death Note rank 20 past 1B kills"
    bonus-25: "Stamp Mastery: a daily chance at a Gilded Stamp (1% per 100 stamp levels)"
    bonus-30: Eldritch Artifact (Sailing, World 5)
    bonus-35: "Vial Mastery: each Lv 13 vial boosts every vial"
    bonus-40: "Construct Mastery: total building levels give Refinery speed, damage, build speed, max levels"
    bonus-45: "Ruby Cards: cards can reach Lv 6"
    bonus-50: "Killroy Prime: damage from your Killroy best kills"
    bonus-55: Sneak Mastery (World 6)
    bonus-60: Cooking Mastery (needs 11 characters for levels 59 and 63 first)
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "Dossier C6, C7, C12. Unlock predicate Rift[0] >= 5*(b+1) (Toolbox isRiftBonusUnlocked: riftInfo index <= currentRift). Store Rift[0]; label as 'Rift level N' with N = Rift[0] (do not mix in the\
    \ wiki's 1-based labels, C35). Cap 65. Milestone values are short labels only; the effect text cites riftInfo[*].riftDescription."
  sources:
