- id: rift.check.afk-task
  system: rift
  type: check
  title: Put a fighter on The Rift
  subject: account
  effect: next-action
  category: idle
  priority:
    frame: by-urgency
  effortSeconds: 30
  detector:
    id: rift/task-kind
    params:
      kind: afk
  text: "Rift level {level:int} wants {quota:int} AFK kills ({progress:int} so far): AFK a fighter on The Rift"
  why: AFK-kill levels only fill while a character is AFK on The Rift's mob; nobody is on it now.
  doneWhen:
    field: account.rift.progress
    change: higher
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Dossier per-session actions + C9 (task ids/quotas from N.js RiftStuff, conf M; task text in riftInfo is tier 1 and states the quota). Fires when the current task is 200k / 1M / 5M AFK kills and\
    \ no character's AFK target is riftAll. No 'which fighter' pick here: the AFK module's survivability check decides that (respawn base 45 s, C14). Community 'best AFK class' advice is tier 4 undated\
    \ (L) and not used."
