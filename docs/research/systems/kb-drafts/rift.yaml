- id: rift.check.unlock-quest
  system: rift
  type: check
  title: Open The Rift
  subject: account
  effect: next-action
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 120
  detector:
    id: rift/unlock-quest
  text: "Finish the Rift Ripper's quest 'Entering The Rift...' in World 4: {missing}"
  why: The Rift is a ladder of challenge levels; every 5th level unlocks a permanent account bonus (displayed Rift 6 Trap Box Vacuum, Rift 11 Infinite Stars, Rift 16 Skill Mastery; numbers from riftLabel()). Nothing in it counts until the quest
    is done.
  doneWhen:
    field: account.rift.unlocked
    change: higher
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "Dossier C2 (tier 1 quests.json). Fires once the account is in World 4 and no character has Rift_Ripper1 done. {missing} lists the items short, e.g. '410 more Purple Mush Cap'; when all are held\
    \ it reads 'you hold the items, hand them in'. The quest consumes the items."
