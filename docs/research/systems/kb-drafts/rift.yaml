- id: rift.check.active-task
  system: rift
  type: check
  title: This Rift level is played, not AFKed
  subject: account
  effect: next-action
  category: active
  priority:
    frame: by-urgency
  effortSeconds: 600
  detector:
    id: rift/task-kind
    params:
      kind: active
  text: "Rift level {level:int}: {task}. Play it actively{withClass}"
  why: Timed, score and multi-character tasks only progress while you play them; characters left AFK on The Rift add nothing here.
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Dossier per-session actions, C9, C10 (score tasks keep the best score, 'total' mode). {task} is the riftInfo task text, shortened by the generator ('Defeat 500 monsters within 5 min'). {withClass}\
    \ = ' on your Divine Knight' etc. When characters are AFK on riftAll during an active task the text adds 'and move {n} AFK characters elsewhere'. Silent on a class-gated level with no such class (rift.check.class-gate\
    \ owns it)."
