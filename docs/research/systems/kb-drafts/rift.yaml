- id: rift.goal.skill-mastery
  system: rift
  type: goal
  title: Raise a skill's account total
  detector:
    id: rift/skill-mastery
  text: "{skill:name} total {total:int} → {at:int}: {reward}"
  why: With Skill Mastery (displayed Rift 16) every skill's level summed over all characters unlocks tiers at 150, 200, 300, 400, 500, 750 and 1000.
  values:
    tier-0: "150: +25% {skill:name} EXP"
    tier-1: "200: the skill's own efficiency or capacity bonus"
    tier-2: "300: all owned {skill:name} cards count as worn, and +5% total damage (not for Mining, Chopping, Fishing, Catching, Trapping, Worship)"
    tier-3: "400: +10 to the account's Smithing EXP sum"
    tier-4: "500: +5% skill efficiency (not for Mining, Chopping, Fishing, Catching, Trapping, Worship)"
    tier-5: "750: +1 to the 3D Printer sum"
    tier-6: "1000: +25 to the all-skill EXP sum"
    locked: banked until Rift 16
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "Dossier C15 (thresholds, tier 1 getSkillRank), C16 (per-skill tier 1/2 effects, M: tier-1 text is generic until per-skill strings are generated), C17 (cross-skill sums, wording M; the wiki's flat\
    \ phrasing is the open question 1). Pick the skill nearest its next threshold in absolute levels. Before Rift 15 the goal shows as 'banked' (levels count once it opens, C26), never worthwhile on its\
    \ own. Cooking tier 2 excepted (C40). Spelunking has its own table (C18, W7, out of scope)."
  sources:
