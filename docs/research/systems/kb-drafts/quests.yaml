# M26 KB drafts for quests (W1 synthesis), copied from m26/maps/*.json. status: draft on every entry;
# the live schema's status enum is active|contested|retired, so promotion flips draft -> active or contested.
# Topics: quests
system: quests
status: draft
entries:
- id: quests.goal.unique-quests
  system: quests
  type: goal
  title: Unique quests completed
  scope: account
  category: compounding
  unit: quests
  progress:
    id: quests/unique-count
  milestones:
  - at: 25
    reward: Achievement Do What You're Told (8 gems)
  - at: 300
    reward: 'Equinox dream: +75% Equinox bar fill rate (World 3+)'
  - at: 323
    reward: Tome row Unique Quests Completed at its 500-point max
  text: '{done:int} unique quests done · Tome {tomePoints:int} of 500'
  why: A quest counts once when any character finishes it, and the count feeds Quest Kapow damage, Studious Quester
    efficiency, the Tome and an Equinox dream.
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: Count = Toolbox calcTotalQuestsCompleted (distinct quest keys with status 1 on any character, world-less
    NPCs included). Tome points = ceil(min(1, q/323) * 500), confirmed on both test accounts (34 -> 53, 50 -> 78).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L1841-L1850
    title: 'Toolbox calcTotalQuestCompleted: a quest counts once on any character'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/tome.ts#L254-L256
    title: 'Toolbox tome: Unique Quests Completed row, 323 for 500 points'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/achievements.json
    title: 'Toolbox game data: TaskAchA14 Do What You are Told, 25 quests'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json#L7886-L7890
    title: 'Toolbox game data: Equinox dream Complete 300 different Quests'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: quests.check.missable-drop-last
  system: quests
  type: check
  title: Last chance at a quest drop
  subject: character
  effect: next-action
  needsCharacter: true
  category: nice
  effortSeconds: 60
  detector:
    id: quests/missable-last
  text: Farm {items} before finishing {quest} on the {who}
  why: '{items} only drop while {quest} is in progress, and every other character has finished it. Finishing it
    here ends that drop for good.'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: Fires only when no character is at status -1 (could still accept it) and the remaining ones are at status
    0. Items = Toolbox missableDrops (greenstackable, realistic). 'Rolls only while in progress' is a Toolbox code
    comment (M); the questLink list is H. Neither test account fires today.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/quests.ts#L11-L27
    title: Toolbox getMissableQuestDrops and questLink
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/monsterDrops.json
    title: 'Toolbox game data: questLink on monster drops'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: quests.check.key-quest-every-character
  system: quests
  type: check
  title: Earn daily boss keys on this character
  subject: character
  effect: next-action
  needsCharacter: true
  category: compounding
  effortSeconds: 600
  detector:
    id: quests/key-earners
  text: 'Finish {npc}''s quests on the {who}: +1 {key} a day'
  why: 'Each character past {npc}''s key quest adds one key to the daily pile, banked 3 days. Earning now: {earners:int}
    of {characters:int} characters.'
  doneWhen:
    field: characters[*].npcDialog.{npc}
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'Mechanic H (keys a day = characters whose npcDialog passes the earner threshold). Which quest number trips
    it is contested: Toolbox dialogue thresholds (Dog Bone > 5, Djonnut > 6 in Toolbox, > 5 in ActiveOn M6 R1, Bellows
    > 8.5) vs the wiki (after quest 2 / 2 / 3). The W2 test account earns 4 Forest Villa keys a day with Dog Bone
    2 still accepted (status 0) on those 4 characters, which supports the dialogue threshold over the wiki''s ''after
    quest 2''. Fire only for NPCs in a world the account has reached.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L599-L621
    title: 'Toolbox enhanceKeysObject: keys a day = characters past the dialogue threshold'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Djonnut
    title: 'IdleOn Wiki: Djonnut (daily keys after quest 2, other characters add to the same pickup)'
    tier: 2
    claimDate: 2026-09-27
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Bellows
    title: 'IdleOn Wiki: Bellows (daily key after quest 3)'
    tier: 2
    claimDate: 2026-10-01
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/YassSoliman/idleon-forge/blob/research/priority-verification/docs/research/2026-10-17-priority-verification.md
    title: 'Priority verification 7.14: key quests on every character'
    tier: 3
    claimDate: 2026-09-25
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: quests.check.quest-talent-past-cap
  system: quests
  type: check
  title: Quest talent past your quest count
  subject: character
  effect: next-action
  needsCharacter: true
  category: nice
  effortSeconds: 120
  detector:
    id: quests/scaler-headroom
    params:
      talents:
      - 658
      - 617
      - 618
  text: '{talent} is level {level:int}; only {useful:int} levels count at {quests:int} quests'
  why: '{talent} gives {perQuest} per unique quest, capped at {perLevel} per level, so levels above {useful:int}
    add nothing until you finish more quests. Spend new star points elsewhere first.'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'Formula H: Kapow min(q, 5*lvl) % damage; Studious Quester min(0.1*q, 0.4*lvl) % skill efficiency; Chungus
    LUK min(q, 4*lvl) (no Toolbox parser applies Chungus, compute it here). useful = ceil(q / 5) for Kapow, ceil(q
    / 4) for the other two. The advice (don''t add more levels yet) is derived, so M. On the W4 test account three
    characters hold 7 to 17 Kapow levels above the 10 that count.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts#L751-L753
    title: 'Toolbox damage: Quest Kapow min(totalQuests, talent bonus)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/efficiency.ts#L150-L184
    title: 'Toolbox efficiency: Studious Quester min(0.1 x quests, bonus)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/talents.json
    title: 'Toolbox game data: talents 617, 618, 658 (x1 per level)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
