- id: stamps.check.carry-wall
  system: stamps
  type: check
  title: A stamp cap raise too big to carry
  subject: account
  effect: next-action
  category: compounding
  detector:
    id: stamps/carry-wall
  text: '{stamp:name} needs {cost:int} {material:name} in one bag; your best carrier holds {capacity:int}'
  why: You have the material, but a cap raise is paid from one character's inventory. {fix}
  values:
    fixHydrogen: Hydrogen at {needed:int}% shrinks it enough.
    fixCarry: Level a carry stamp (Matty Bag for pouches, Lil' Mining Baggy, Choppin' Bag) or a bag first.
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: M26 stamps map, dossier M5/M15 (C23 consumption side M, C25). Fires per stamp with raise.atDiscount.hasMaterials
    && !carryOk. fixHydrogen when raise.minReduction != null and Hydrogen level > 0 (else spend.check.hydrogen-hold owns the
    wait); fixCarry otherwise. Refines spend.check.stamp-not-ready (a count) with the one stamp to act on; keep only one of
    the two lines on Now.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L87-L102
    title: 'Toolbox enoughPlayerStorage: best carrier capacity vs material cost'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L1134-L1152
    title: Toolbox getHighestCapacityCharacter
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L151-L221
