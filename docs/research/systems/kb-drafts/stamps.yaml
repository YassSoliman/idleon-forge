- id: stamps.check.coins-outrun-caps
  system: stamps
  type: check
  title: Your coins have outrun your stamp caps
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 300
  detector:
    id: stamps/coins-outrun-caps
  text: '{capped:int} of {owned:int} stamps are at their cap; raise {ready:int} caps you can pay now to keep buying levels'
  why: Coins only buy stamp levels below the cap, and every owned stamp you can still level costs less than the coins you
    hold; each cap raise you already have the material for opens {step:int} or more new levels.
  doneWhen:
    field: account.spend.stamps
    change: lower
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'M26 stamps map, dossier M3/M4/M20 (C5, C8, C51). Headline for the Spend Plan stamp raise items, not a second price:
    ready = raise.atDiscount.hasMaterials && carryOk. Silent while any raise needs farming only (spend.check.stamp-not-ready
    owns that). Fold into the Spend Plan header if M7 already shows it.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L231-L258
    title: 'Toolbox getGoldCost: coins buy levels only below maxLevel'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L261-L296
    title: Toolbox getGoldCostToMaxLevel and getMaterialCost (each raise adds the cap step)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/baseTrackers.js#L97-L100
    title: Toolbox dashboard affordableStampLevels alert
    tier: 2
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: stamps.check.skill-falloff
  system: stamps
  type: check
  title: A skill stamp levelled past your skill
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: stamps/skill-falloff
    params:
      ratio: 0.75
  text: '{stamp:name} Lv {level:int} acts as about Lv {effective:int} on your best {skill} character ({skill} {skillLevel:int})'
  why: Skill stamps lose strength when the stamp is far above the skill level of the character using it; levelling {skill}
    on that character gets back more than another cap raise on this stamp.
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'M26 stamps map, dossier M9 (C13 H, C14 M: the skillIndex to skill map is inferred from stamp names, hence M). Effective
    level is Toolbox getStampBonus falloff for the character with the highest level in that skill: sl = L*(200/(20m)); if
    sl>3, eff = min(floor((3+(sl-3)*(skill/(sl-3))^0.75)*20m/200), sl, L). Only stamps with skillIndex>0 and capStep>1; silent
    when Jade Level_Exemption is owned (W6). Fire when eff < ratio*L. Per class: it names the best character in that skill,
    never a class.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L366-L389
    title: 'Toolbox getStampBonus: skill-level falloff on skill stamps'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/stamps.json
    title: 'Toolbox game data: stamp skillIndex and cap step'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: stamps.check.gilded-banked
  system: stamps
  type: check
  title: Gilded Stamps waiting
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 120
  detector:
    id: stamps/gilded-banked
  text: 'Use a Gilded Stamp on {stamp:name}: its cap raise drops from {full:int} to {gilded:int} {material:name}'
  why: A Gilded Stamp cuts one cap raise's material by 95% and you hold {held:int}; the costliest raise you can now pay saves
    the most. Coins are not reduced.
  doneWhen:
    field: account.spend.gildedStamps
    change: lower
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: M26 stamps map, dossier M7 (C11). Silent at OLA[154] = 0. Pick = the raise with the highest atDiscount.cost whose
    gilded price hasMaterials && carryOk (same pick as spend/candidates raiseCandidates). Gilded applies to materials only
    (getMaterialCost x0.05).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/stamps.ts#L279-L296
    title: 'Toolbox getMaterialCost: Gilded x0.05 on materials only'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: riftInfo Stamp_Mastery (Gilded Stamp)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
