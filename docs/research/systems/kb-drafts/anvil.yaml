# M26 KB drafts for anvil (W1 synthesis), copied from m26/maps/*.json. status: draft on every entry;
# the live schema's status enum is active|contested|retired, so promotion flips draft -> active or contested.
# Topics: anvil, smithing
system: anvil
status: draft
entries:
- id: anvil.check.mat-points
  system: anvil
  type: check
  title: Buy anvil points with monster materials
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 60
  detector:
    id: anvil/mat-points
    params:
      minPoints: 3
  text: Buy {points:int} anvil points with {item} on {count:int} characters
  values:
    text-one: Buy {points:int} anvil points with {item} on {class:name} Lv {level:int}
    detail: '{character}: {points:int} points for {cost:int} {item}'
  why: Each character also buys anvil points with monster materials, and the first ones cost a handful of early
    drops ({cost:int} {item} for these). A point is permanent Speed or Capacity; the plan then places it.
  notes: 'Cost rule: Toolbox getMonsterMatCost / getAnvilUpgradeCostItem (dossier C9, C43, H). Spends only what
    is held, cheapest first. Confidence M, not H: the same low-tier drops also feed stamps and crafts, and whether
    the game pays from storage or the character''s inventory is unverified (open question). AutoReview''s 85-point
    tier (C39, L) is not used.'
  doneWhen:
    field: characters[*].anvil.points.mats
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L38-L54
    title: IdleOn Toolbox, getMonsterMatCost and getAnvilUpgradeCostItem
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: IdleOn Toolbox game data, anvilUpgradeCost (item per point band)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Smithing
    title: 'IdleOn Wiki: Smithing, anvil points from monster drops'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-19'
- id: anvil.check.empty-hammer
  system: anvil
  type: check
  title: Anvil hammer with nothing to make
  subject: character
  effect: next-action
  category: wasting
  effortSeconds: 15
  detector:
    id: anvil/empty-hammer
  text: Pick a product for {class:name} Lv {level:int}'s spare anvil hammer
  why: The Infinity Hammer and an equipped Hammer Hammer each let the anvil make one more item at once; a slot with
    no product makes nothing.
  notes: 'Slot sources are tier 1 (gemShop.json GemP1 desc ''produce TWO anvil items at once ... stacks with other
    +1 anvil hammer''; cauldrons.json HAMMER_HAMMER desc ''produce two items at once ... must be equipped''). Confidence
    M: Toolbox does not compute slot count, and whether a granted slot can sit empty in AnvilPAselect needs one
    in-game look. Silent on both test accounts.'
  doneWhen:
    field: characters[*].anvil.slots
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/gemShop.json#L504-L512
    title: IdleOn Toolbox game data, gem shop GemP1 Infinity Hammer
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/cauldrons.json#L1117-L1123
    title: IdleOn Toolbox game data, HAMMER_HAMMER bubble
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L135-L150
    title: IdleOn Toolbox, getPlayerAnvil hammers per product from AnvilPAselect
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Smithing
    title: 'IdleOn Wiki: Smithing (1 base slot, +1 Infinity Hammer, +1 Hammer Hammer)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-19'
- id: anvil.goal.next-tab
  system: anvil
  type: goal
  title: Craft the next Anvil Expansion
  subject: account
  effect: goal
  category: compounding
  detector:
    id: anvil/next-tab
  text: Craft Anvil Tab {tab:int}
  values:
    progress: '{have:int}/{need:int} {item}'
    gate: Smithing {level:int} to craft it
    gate-unsure: 'Smithing gate: check in game (sources disagree)'
  why: Each Anvil Expansion is crafted once and opens a new crafting tab on every character's anvil, with the gear,
    bags and quest items of the next worlds.
  notes: 'Recipes are tier 1 (crafts.json Anvil_Tab_2..7, C24 H). Gate levels disagree: wiki 15/35/50/65/80/80 vs
    items.json lvReqToCraft 15 for all (C23, M), so the gate line reads ''check in game'' where they differ. Dedupe
    with gear.check.next-piece / Walkthrough steps that already ask for Tab 2: when one of those fires for the same
    tab, this Goal shows as progress only.'
  doneWhen:
    field: account.anvilTabsOwned
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/crafts.json#L780
    title: IdleOn Toolbox game data, Anvil_Tab_2 to Anvil_Tab_7 recipes
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: IdleOn Toolbox game data, EquipmentSmithingTabs2-7 lvReqToCraft
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Anvil
    title: 'IdleOn Wiki: Anvil (tabs and their Smithing levels)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-19'
- id: anvil.check.hammers
  system: anvil
  type: check
  title: Put every anvil hammer to work
  subject: character
  effect: next-action
  category: idle
  effortSeconds: 30
  detector:
    id: anvil/hammers
  text: '{text}'
  why: '{why}'
  values:
    text-free: Pick a product for the free anvil hammer on your {who}
    text-bubble: 'Equip Hammer Hammer on your {who}: +1 anvil hammer'
    why-free: It has {have:int} of {can:int} hammers on a product; a free hammer makes nothing.
    why-bubble: 'Hammer Hammer is a big bubble: it gives its extra hammer and its speed only while equipped, and
      this character has a free big-bubble slot.'
    detail: '{who}: {have:int} of {can:int} hammers working'
  notes: Hammers per product = entries of AnvilPAselect equal to that product (Toolbox anvil.ts L149; L135 normalises
    a lone number to a list). Expected = 1 + Infinity Hammer (gemShopPurchases[103]) + Hammer Hammer equipped (bigBubbles
    has the Quicc a2 bubble). 'Max 3' is wiki-only (OQ10), so never cap the count; only compare against the sources
    we can see.
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L118-L160
    title: 'IdleOn Toolbox getPlayerAnvil: hammers per product from anvilSelected'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/cauldrons.json
    title: 'Toolbox game data: HAMMER_HAMMER (Quicc a2, bigBase 23/2): produce two items at once; big bubbles must
      be equipped'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/gemShop.json
    title: 'Toolbox game data: Infinity Hammer (GemP1), stacks with other +1 hammer bonuses'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Smithing#Anvil_Production
    title: 'IdleOn Wiki: Smithing, hammers (max 3)'
    tier: 2
    claimDate: 2026-10-05
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: anvil.check.product-exp
  system: anvil
  type: check
  title: Produce Thread for Smithing EXP
  subject: character
  effect: next-action
  category: nice
  effortSeconds: 30
  detector:
    id: anvil/product-exp
    params:
      demandFrom:
      - anvil-tabs
      - material-pouch
      - gear-plan
  text: Switch your {who}'s {product} hammer to Thread
  why: Every product uses the same anvil speed, and Thread gives the most Smithing EXP per unit of work ({threadRate:int}
    vs {rate:int} per 1,000). You hold {held:int} {product}, more than your next recipes need ({need:int}).
  values:
    detail: '{who}: {product} ({rate:int} EXP per 1,000 work), {held:int} held, {need:int} needed'
  notes: 'Silent while a known recipe (next Anvil Tab, next Material Pouch, a Gear Plan piece) still needs more
    of the product than storage + inventories + the anvil hold: products ARE needed for crafts, so the rule is never
    ''always Thread''. EXP per 1,000 work from anvilProducts (Thread 60, Trusty Nails 50, Boring Brick 46, Chain
    Link 36, Leather Hide 29, Pinion Spur 25, Lugi Bracket 22 ...).'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts
    title: 'IdleOn Toolbox: anvilProducts requiredAmount and exp per item; one anvilSpeed for every product'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-smithing-build-guide/
    title: 'Idleon Smithing build guide: the best thing to produce for XP is Thread'
    tier: 3
    claimDate: 2026-05-26
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: anvil.check.material-pouch
  system: anvil
  type: check
  title: Bigger Material Pouch
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: anvil/material-pouch
  text: Craft a {pouch} for your {who}
  why: Anvil capacity is the Material Pouch's carry cap times (2 + 0.1 x Capacity points), so a bigger pouch raises
    every product's cap at once; {product} fills {fullIn:in}, before you're back.
  values:
    many: Craft {pouch} for {n:int} characters
    gather: '{pouch}: gather {missing}'
    detail: '{who}: {current} -> {pouch}, {product} full {fullIn:in}'
  notes: 'Fires only when a product caps before the Expected Return (afk.anvil capAt) and the next craftable pouch
    is a bigger tier than the one in use. Ladder from carryBags.json bCraft: Mini 25 (not crafted), Cramped 50,
    Small 100 (not crafted), Average 250, Sizable 500, Big 1,000, Large 2,000, Massive 5,000, Volumetric 10,000
    (the dossier''s M13 list skips Mini and Small). Pairs with anvil.check.spend-points: pouch first, then Capacity
    points.'
  usesExpectedReturn: true
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts
    title: 'IdleOn Toolbox getPlayerAnvil: anvilCapacity = materialPouch capacityPerSlot x (2 + 0.1 x capPoints)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/carryBags.json
    title: 'Toolbox game data: bCraft Material Pouch tiers'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/crafts.json
    title: 'Toolbox game data: Material Pouch recipes (Average: 1 Glass Shard + 1,700 Chain Link)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: anvil.check.acme-trick
  system: anvil
  type: check
  title: Acme Anvil points before a respec
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 300
  detector:
    id: anvil/acme-trick
  text: Before resetting your {who}'s talents, spend its Acme Anvil points
  why: Acme Anvil adds anvil points from the Archer talent. Points already spent stay spent after a talent reset;
    the anvil balance just goes below zero until the talent is back.
  values:
    negative: 'Your {who}''s anvil points are {points:int} below zero: put Acme Anvil back to earn new ones'
  notes: 'Only the ''negative'' line is detectable (afk.anvilPlan.unspent < 0 on an Archer-line character); the
    ''before a reset'' line rides talent-resets.check.reset as detail for Archer-line characters with talent 281
    > 0. Acme formula: SkillLevels[281] + bonus x floor(Smithing/10) (anvil.ts); the meaning of x2=15 is L (OQ11),
    so no point count is promised.'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-1/anvil.ts#L84-L116
    title: 'IdleOn Toolbox getAnvil: pointsFromAcme from talent 281 and Smithing level'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Smithing#Anvil_Points
    title: 'IdleOn Wiki: Smithing, Acme Anvil and resets'
    tier: 2
    claimDate: 2026-10-05
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-smithing-build-guide/
    title: 'Idleon Smithing build guide: invest Acme Anvil, spend, respec'
    tier: 3
    claimDate: 2026-05-26
    verified: 2026-10-19
    gameVersion: 2.3.540
