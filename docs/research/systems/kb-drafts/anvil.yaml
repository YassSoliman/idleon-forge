- _kind: alternative-draft
  id: anvil.goal.next-tab
  change: Alternative draft of the same id from the smithing map; the owning topic version is kept in entries. Merge
    on promotion.
  draft:
    id: anvil.goal.next-tab
    system: anvil
    type: goal
    title: Craft the next Anvil tab
    subject: account
    effect: next-action
    category: compounding
    effortSeconds: 120
    detector:
      id: anvil/next-tab
    text: '{text}'
    why: '{why}'
    values:
      ready: Craft Anvil Tab {tab:int} on your {who} (Smithing {lv:int})
      gather: 'Anvil Tab {tab:int}: gather {missing}'
      level: Anvil Tab {tab:int} needs Smithing {lv:int} on one character (best is {best:int})
      why: 'A tab is crafted once and opens its recipes on every anvil: the next gear, tools, pouches and the next
        tab.'
      material: '{held:int} of {need:int} {item}'
    doneWhen:
      field: account.anvilTabsOwned
