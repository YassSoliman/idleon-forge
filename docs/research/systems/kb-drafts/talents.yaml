- id: talents.goal.veins-smithing
  system: talents
  type: goal
  title: Smithing feeds Veins of the Infernal
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 0
  detector:
    id: builds/veins-smithing
    params:
      minGainPct: 10
  text: 'Level {who:name}''s Smithing: Veins of the Infernal goes from +{now:int}% to +{atCap:int}% damage at Smithing 100'
  why: Veins multiplies damage by its value for every 10 Smithing levels, up to Smithing 100. The talent is already bought, so each Smithing level adds damage.
  values:
    goal: Talents
    unit: Smithing levels
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts#L674-L677
    title: 'IdleOn Toolbox, getDamageFromPerX: Veins multiplier 1 + V x min(100, Smithing)/10 / 100'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/talents.json
    title: 'IdleOn Toolbox game data: VEINS_OF_THE_INFERNAL (284), decay 35/50'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  appliesTo:
    stages: all
    classes:
    - Archer
    - Bowman
    - Hunter
    - Beast_Master
  confidence: M
  status: draft
  notes: 'Dossier M8/C14 (M). Fires only when the fighting-role preset has VEINS base >= 1 and Smithing < 100 and the gain to Smithing 100 is at least minGainPct points. Value uses the effective level once characters[].talents carry it (accountStateFieldsToAdd), base level until then. No community claim on how much Smithing to level; the goal states the payoff only. CL merge: superseded by classes.check.veins-smithing (Archer line).'

