- id: breeding.check.multiplier-unlock
  system: breeding
  type: check
  title: Switch on a new-Mob multiplier
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: breeding/multiplier-unlock
  text: "Buy level 1 of {upgrade}: it switches on a new-Mob multiplier"
  why: Level 1 of Breedability, Rarity of the Egg, Pastpresent Brood and Failsafe Restitution each turns on one more multiplier on every new-Mob chance (and Breedability starts pink Mobs). The first level
    is the big step.
  doneWhen:
    field: account.breeding.upgrades[].level
    change: higher
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: C24 (gate = level > 0, game indices 3/5/7/10), C23 unlock levels. The 'buy Lv 1 first' framing is the w4-research line in the coverage audit; the gate itself is code. Do not use Toolbox unlockedBreedingMulti
