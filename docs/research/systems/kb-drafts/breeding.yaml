  type: check
  title: Forage your won territory
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 120
  detector:
    id: breeding/idle-territory
  text: "{territory} is won but nobody forages there: give it forager Mobs"
  why: A territory only makes its spice while a team forages it, and kitchens and Lab chips need spices. Progress runs while you are away.
  doneWhen:
    field: account.breeding.territories[].status
    change: changed
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: C45, C47, C48. 'won' = spice found and Territory[i][3] blank (adapter).
