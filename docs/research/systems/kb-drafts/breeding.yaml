- id: breeding.check.combat-forager
  system: breeding
  type: check
  title: Swap a combat Mob off foraging
  subject: account
  effect: next-action
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: breeding/combat-forager
  text: "{territory}: your {gene} Mob forages at 0 speed; swap in a forager-gene Mob"
  why: Only Mobs with a foraging gene add forage speed; a combat gene adds nothing there (it only matters in battles and the Arena).
  doneWhen:
    field: account.breeding.territories[].team
    change: changed
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "C45 (abilityType 1 only), C46 (fight gate never blocks; combat Mobs give 0). Exception: Flashy/Fastidious team multipliers care about combat Mobs; the copy says 'forager-gene' only."
  sources:
