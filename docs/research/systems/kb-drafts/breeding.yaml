- id: breeding.check.full-nest
  system: breeding
  type: check
  title: Hatch your full nest
  subject: account
  effect: next-action
  usesExpectedReturn: true
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: breeding/full-nest
  text: "Your nest is full ({eggs:int} of {capacity:int}): breed or trash an egg"
  values:
    first: Your first breed is always a Green Mushroom; it starts the skill and Gobo's first quest
  why: A full nest lays no more eggs. Every egg you breed or trash gives Breeding EXP, and trashed Mobs give Dead DNA for upgrades.
  doneWhen:
    field: account.breeding.eggs
    change: lower
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: Dossier per-session action 1, C6, C8, C9, C17, C18. Replaces the page-frame-only nag with a Now card.
  sources:
  - url: "https://legendsofidleon.com/ytGl5oc/N.js"
    title: "Game client N.js v1.23 TotalTimeForEgg / egg tick @10095300: an egg is added only into a free slot"
