# M26 KB drafts for System cards (area W2 synthesis, verified 2026-10-19, Toolbox 6c37e3d, game 2.3.540).
# Copied from scratchpad/m26/maps: cards.json.
# status: draft is a workflow marker; the KB schema accepts active|contested|retired only.
# entries = new entries; amendments = changes to entries already in packages/knowledge/systems (fields shown are the changed keys);
# facts = new fact rows (land in <system>.facts.yaml).
system: cards
status: draft
entries:
- id: cards.check.capped-card-map
  system: cards
  type: check
  title: This map's card is maxed
  subject: character
  effect: next-action
  category: nice
  effortSeconds: 30
  detector:
    id: cards/capped-map
  text: The {card:name} card is at Lv {level:int}, its max for now; this map gives no more card progress
  why: Card levels stop at Lv {cap:int} until {unlock}. Copies still count, so they are kept for later, but a card you don't
    own yet ({next:name}, {where}) pays now.
  values:
    groupText: '{characters:int} characters farm a map whose card is maxed'
    detailText: '{who}: {card:name} Lv {level:int}'
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'M26 cards map M2/M7. Fires only when the AFK Target''s monster drops exactly one card and it is at the account star
    cap (5, or 6 at Rift 45, 7 with the third Spelunking lore boss). Informational: the character may be there for EXP or
    drops; never says ''move''. {next} is the top grind line the character can reach, else omitted.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/cards.ts#L54-L59
    title: 'Toolbox: star cap 4 + Rift 5-star flag + Spelunking 6-star flag'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client: RiftStuff(''5starCards'') and Spelunk(''6starCards'')'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
    note: Offsets 10781444 and 11090050 in the copy fetched 2026-10-19.
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/cardMath.ts#L8-L14
    title: 'Toolbox: copies per level 1, 4, 9, 25, 484, 15129 x perTier'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: cards.goal.set-tier
  system: cards
  type: goal
  title: Card set tier
  scope: account
  category: compounding
  unit: card levels
  progress:
    id: cards/set-tier
  milestones:
  - at: 1
    reward: the next set tier
  text: '{set:name} set: {points:int} of {nextAt:int} card levels for tier {next:int} ({nextBonus})'
  why: A set's tier is its total card levels divided by its card count, so any new card or level in the set counts 1. The
    bonus works on every character wearing the set.
  values:
    unknownText: 'Card sets: can''t tell right now'
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: M26 cards map M10. One line per set in use or recommended (setInUse), fewest levels away first; the Cards tab already
    computes this (setProgress). Excludes Hard Resources, Bosses, Events and later-world sets until the account reaches their
    world (needs W5-W7 cards).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/cards.ts#L95-L118
    title: 'Toolbox getCardSets: tier = floor(total Lv / set size)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: cardSets sizes and bonus per tier'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client: set tier build and apply'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
    note: Offsets 7493000-7494800.
- id: cards.goal.total-levels
  system: cards
  type: goal
  title: Total card levels
  scope: account
  category: nice
  unit: card levels
  progress:
    id: cards/total-levels
  milestones:
  - at: 100
    reward: 100 total card levels
  - at: 200
    reward: 200 total card levels
  - at: 300
    reward: 300 total card levels
  text: '{levels:int} total card levels · {owned:int} cards found'
  why: Every card level counts toward the Tome once it opens, and every new card or level also counts toward its set tier.
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: M26 cards map M18. Show-more line. Milestones are round numbers (ActiveOn's own), not game thresholds. Collection
    Cashout (Vault 70) counts cards found, a different stat (C52, M); show 'cards found' beside it, don't merge them.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/cards.ts#L174-L177
    title: Toolbox calcCardsLevels
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/tome.ts#L289
    title: 'Toolbox Tome: total card levels quantity'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: cards.check.mastery-frees-slots
  system: cards
  type: check
  title: Skill Mastery frees card slots
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: cards/mastery-slots
  text: 'Swap out {count:int} {skill} cards: Skill Mastery already counts them'
  why: With Rift Skill Mastery, a skill at level 300 or more gets the bonus of every {skill} card you own without equipping
    it, so those slots are free for {cards}.
  values:
    groupText: Skill Mastery frees {count:int} card slots on {characters:int} characters
  appliesTo:
    stages:
    - from: W4-entry
  confidence: H
  status: draft
  notes: M26 cards map M8. Fires when Rift (currentRift) >= 15 and the character's skill rank > 2 (level >= 300) and an equipped
    card's effect is that skill's. Needs account.rift.current and per-character skill levels (both in Toolbox output). Silent
    for both test accounts today (Rift 0).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L835-L850
    title: Toolbox getSkillCardBonus and isMasteryBonusUnlocked
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Rift
    title: 'IdleOn Wiki: Rift (Skill Mastery at level 300)'
    tier: 3
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: cards.check.wrong-side-cards
  system: cards
  type: check
  title: Skilling cards on a fighter
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: cards/slots
    params:
      view: wrong-side
  text: '{count:int} of your equipped cards don''t help {activity}: swap in {cards}'
  why: An equipped card only gives its own stat. {wrong} raise a skill this character isn't doing, so those slots give nothing
    while it {activity}.
  values:
    groupText: '{characters:int} characters wear cards for another activity'
    detailText: '{who}: {count:int} off-activity'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'M26 cards map M6. Per-card version of preset-mismatch: fires when at least one equipped card fits only another activity
    by the keyword table (cards.fact.activity-keywords) AND preset-mismatch is silent (the preset as a whole still fits, or
    no other preset exists). Drop-rate cards fit both and never count. M because the keyword rule is ActiveOn''s (C47); the
    ''a card gives only its own stat'' half is H (C12).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/cardMath.ts#L16-L19
    title: 'Toolbox calcCardBonus: bonus x level for the card''s own effect'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/characters.js#L343-L383
    title: 'Toolbox dashboard cardsAlert: set vs activity'
    tier: 2
    verified: 2026-10-19
    gameVersion: 2.3.540
