entries:
- status: draft
  id: shrines.check.idle
  system: shrines
  type: check
  title: A shrine is levelling for nobody
  subject: account
  effect: next-action
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: shrines/idle
  text: Move the {shrine:name} to {bestMap:name}
  why: A shrine only levels from AFK time claimed where it reaches, and no character is on {map:name}. Moved to
    {bestMap:name}, {bestCount:int} characters level it and get its bonus.
  values:
    text-no-architect: Finish Hoggindaz's quest 5 for the Shrine Architect book
    why-no-architect: Your {count:int} built shrines stand where no character is, so they never level. New shrines
      appear in Blunder Hills town; the Shrine Architect star talent moves them, and its book is the reward of Hoggindaz
      quest 5 (take 2 Printer samples).
  doneWhen:
    field: account.shrines[*].levelRate
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: H
  notes: 'Rule is code: isGlobalApplicable needs same map, World Tour same world, or Legend 38 (shrines.ts#L123-L126);
    levelRate 0 with level > 0 is exactly that. Never claims the move loses progress (C24, L). Do not suggest moving
    more often than needed. M26 W3 synth (from maps/shrines.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/shrines.ts#L69-L126
    title: Toolbox getShrineExpBonus / isGlobalApplicable (shrine EXP only from AFK on its map, world with World
      Tour)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/shrines.ts#L128-L140
    title: Toolbox getShrineBonus (bonus only on its map unless World Tour / Moai Head)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Shrines
    title: 'IdleOn Wiki: Shrines'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
- status: draft
  id: shrines.check.stack
  system: shrines
  type: check
  title: Stack shrines where most characters AFK
  subject: account
  effect: next-action
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: shrines/stack
    params:
      minGain: 2
  text: Move the {shrine:name} to {bestMap:name}
  why: Each character AFK where a shrine stands adds its own level-up time. On {map:name} {count:int} characters
    level it; on {bestMap:name} {bestCount:int} would, and they would all get its bonus.
  values:
    text-crystal-alone: Put the Crystal Shrine with your other shrines on {bestMap:name}
    why-crystal-alone: The Crystal Shrine only speeds up shrines that level on the same map as the character; alone
      on {map:name} its bonus speeds nothing.
  doneWhen:
    field: account.shrines[*].levelRate
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  notes: 'Computed from code (rates add per character, shrines.ts#L72-L99; Crystal term evaluated at the character''s
    map, #L77). No human Source states ''stack them''; the dossier marks AFK-setup stacking as computed (M). Not
    about where to farm: it follows the characters, never moves them. M26 W3 synth (from maps/shrines.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/shrines.ts#L69-L113
    title: 'Toolbox getShrineExpBonus: rate summed per character per shrine; Crystal term at the character''s map'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Shrines
    title: 'IdleOn Wiki: Shrines'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
