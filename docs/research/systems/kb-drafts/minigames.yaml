  type: goal
  title: Total Minigame Highscore
  text: Raise your minigame highscores to {target:int} in total ({value:int} now)
  why: The Tome's 'Total Minigame Highscore' row adds Choppin, Fishing, Catching, Mining and Pen Pals; 450 gives
    its full 100 points. Your lowest is {lowest} at {lowestScore:int}.
  subject: account
  scope: account
  category: compounding
  unit: points
