- id: friend-bonuses.check.free-slots
  system: friend-bonuses
  type: check
  title: Fill your Friend Bonus slots
  subject: account
  effect: next-action
  category: nice
  priority:
    frame: by-urgency
  effortSeconds: 120
  detector:
    id: friend-bonuses/free-slots
  text: '{free:int} of your {slots:int} Friend Bonus slots are empty'
  why: Each filled slot adds a flat account-wide bonus (up to +{bestValue:int}% Total Damage at your multiplier); an empty
    slot gives nothing. A friend sends it from the Codex Friends tab.
  doneWhen:
    field: account.friendBonuses.entriesRead
    change: higher
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'Needs another player: never urgent. Entries beyond the slot count are ignored, so ''free'' is slots - min(slots,
    stored).'
