- id: friend-bonuses.check.weak-sender
  system: friend-bonuses
  type: check
  title: Swap a low-level friend's bonus
  subject: account
  effect: next-action
  category: nice
  priority:
    frame: by-urgency
  effortSeconds: 120
  detector:
    id: friend-bonuses/weak-sender
  text: Your {stat} Friend Bonus comes from a level {level:int} account and gives {pct:int}% of its full value
  why: 'A bonus scales with the sender''s Account Level: level 12,000 gives the base value, level 1,000 only about 37% of
    it. A higher-level friend''s bonus in the same slot is worth more.'
  doneWhen:
    field: account.friendBonuses.bonuses
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: Fires when a read entry's sender level < 2,400 (scaling < 0.5, i.e. under 38% of the 30,000-level max). Maths is
    tier 1 (H); that a higher-level friend is available is not knowable, hence M and category nice. Never name the friend.
  sources:
