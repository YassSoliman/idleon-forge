facts:
- id: friend-bonuses.fact.values
  system: friend-bonuses
  type: fact
  title: Friend Bonus values
  text: 'Value = base x scaling x multiplier. Bases: Total Damage 100, Class EXP 30, Skill Efficiency 50, Drop Rate 25, Skill
    EXP 30, Coins 40, Extra Kills 10. Scaling = 0.25 + L/(L+12000) x 1.5 for sender level L (capped 30,000): 0.25 at 0, 1.0
    at 12,000, 1.32 at 30,000. Multiplier 1, 2 (Mr Pig), 2.5 (Pet Mart+), +0.25 (Spearfish Pet Mart+).'
  why: Shown on the Friend bonuses page.
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'Formula changed 2026-06-21 (wiki, M); pre-patch guides quote min(1, 0.2+L/(L+3000)) with a 12K cap (L): treat older
    numbers as stale.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L199-L223
