- id: atom-collider.goal.collider-level
  system: atom-collider
  type: goal
  status: draft
  title: Build and raise the Atom Collider
  text: '{text}'
  why: '{why}'
  detector:
    id: atom-collider/state
    params:
      part: building
  values:
    build: Build the Atom Collider (10 Nullo Salt)
    level: 'Atom Collider Lv {from:int} → {to:int}: atom costs -{pct}%'
    why-build: It is the only way to buy atom upgrades; Storage overflow already makes particles.
    why-level: Each level cuts every atom cost by 0.1%, up to 20% at Lv 200.
  notes: 'Progress: level / 200. ''build'' when level 0 and Nullo Salt is unlocked (account.salts[5].unlocked);
    silent before Nullo. Cost of building levels beyond Lv 1 not verified (dossier C15 conf L for the Nullo total),
