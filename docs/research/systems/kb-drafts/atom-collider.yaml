- id: atom-collider.check.threshold
  system: atom-collider
  type: check
  status: draft
  title: Collider threshold is eating stockpiles
  subject: account
  effect: next-action
  category: nice
  detector:
    id: atom-collider/state
    params:
      part: threshold
  text: '{count:int} storage stacks are over the {threshold} collider threshold'
  why: While the collider is on, anything over the threshold turns into particles at 10M each; raise the threshold
    if you need {item} (refinery fuel or bubble material).
  notes: Fires when the collider is built, the threshold tier is below 1.05B (accountOptions[133] in 0..3), and
    a storage stack of a Refinery fuel or alchemy bubble cost item is over the threshold. The switch state is not
    in the save, so the text says 'while the collider is on'. Dossier common mistake (2), confidence M. M26 W3 synth
    (from maps/atom-collider.json).
