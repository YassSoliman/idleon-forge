facts:
- id: atom-collider.fact.atoms
  system: atom-collider
  origin: authored
  status: draft
  title: Atom effects and where they pay
  rows:
    '0':
      atom: Hydrogen
      effect: stamp cap-raise materials -level x days%, cap 90% (reset by any cap raise)
      world: W3
      confidence: H
    '1':
      atom: Helium
      effect: +level to the power-of-10 talents' lavaLog term
      world: W3
      confidence: H
    '2':
      atom: Lithium
      effect: chance for +1 extra bubble level on No Bubble Left Behind
      world: W3
      confidence: M
    '3':
      atom: Beryllium
      effect: converts 7 x level silver pens to PO boxes per day
      world: W3
      confidence: M
    '4':
      atom: Boron
      effect: 2 x level uses per day of paying 1e8+ bubble costs in particles
      world: W3
      confidence: H
    '5':
      atom: Carbon
      effect: +2 x level max level to max-50 towers; +2% wizard damage per tower level over 50
      world: W3
      confidence: H
    '6':
      atom: Nitrogen
      effect: +1 trimmed build slot at Lv 1; trimmed multiplier 3 + 15 x level/100
      world: W3
      confidence: H
    '7':
      atom: Oxygen
      effect: +2 x level% library checkout speed; +level min book level; +10 max book level at Lv 1
      world: W3
      confidence: H
    '8':
      atom: Fluoride
      effect: cooking speed x(1 + level/100)^(meals at Lv 30+)
      world: W4
      confidence: H
    '9':
      atom: Neon
      effect: +level% total damage and level% off every atom cost
      world: W3
      confidence: H
    '10':
      atom: Sodium
      effect: snail failure resets to the nearest 5 up to Lv 5 x level
      world: W5
      confidence: M
  notes: Rows 11-16 (W6/W7) left out of the W1-W4 fact. Boron pays only the first ingredient of a 1e8+ bubble cost,
    excluding Bits/W6 items and salts. M26 W3 synth (from maps/atom-collider.json).
