system: atom-collider
entries:
- id: atom-collider.check.upgrade
  system: atom-collider
  type: check
  status: draft
  title: Atom upgrade affordable
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 30
  detector:
    id: atom-collider/state
    params:
      part: upgrade
  text: '{text}'
  why: '{why}'
  values:
    text: Buy {atom} {from:int} → {to:int} at the Atom Collider ({cost:int} particles)
    why: Atom levels are permanent and account-wide; you hold {particles:int} particles.
    detail-more: '{count:int} more atom upgrades are affordable'
    detail-first: You built the Atom Collider but haven't bought an atom yet
  notes: 'Pick: among available atoms (index < totalAtomsAvailable) with level < maxLevel and cost <= particles,
    the first in the Stage''s atom order (atom-collider.priority.order), else the cheapest. Helium is skipped once
    its next cost exceeds the cheapest other affordable row x 10 (its cost grows x10 per level, code H); Fluoride
    is skipped while no meal is Lv 30+ (its value is 0, code H). Lithium, Beryllium and Sodium are listed but their
    value is not modelled. Particles are only ever spent here, so there is no hold. M26 W3 synth (from maps/atom-collider.json).'
  doneWhen:
    field: account.atomCollider.levels
    change: higher
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/atomCollider.ts#L18-L150
    title: 'Toolbox parsers/world-3/atomCollider.ts: particles = Divinity[39], per-atom level/maxLevel/cost/nextLeveCost/costToMax/value,
      totalAtomsAvailable, stampReducer'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/atomCollider.ts#L118-L143
    title: 'Toolbox atomCollider.ts getCost / getCostToMax: base 1/(1+R/100) x (x3 + x1*L) x x2^L, R includes collider
      level/10, Neon, Atom Split, stamp, palette, Bubba'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Atom_Collider
    title: 'IdleOn Wiki: Atom Collider (10M per atom, 1,050M auto-convert even when off, max level 20/+20/+20, unlock
      order)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
  appliesTo:
    stages:
    - from: W3-late
      to: W4-entry
  confidence: H
- id: atom-collider.priority.order
  system: atom-collider
  type: priority
  status: draft
  ship: display-only
  shipReason: 'Red team P1: gist through v1.21, pre-patch; Contested at best (N4).'
  title: Atom order
  text: Level the atoms that pay most for this Stage
  why: Hydrogen is the cheapest big saving; Boron and Neon follow once bubbles cost 100M+ and damage matters.
  values:
    row-1: '0'
    when-1: always
    target-1: 10|20
    row-2: '1'
    when-2: always
    target-2: 5|8
    row-3: 2|3
    when-3: always
    target-3: 5|10
    row-4: '4'
    when-4: always
    target-4: 5|20
    from-4: W4-entry
    row-5: '9'
    when-5: always
    target-5: 10|20
    from-5: W4-entry
    row-6: '8'
    when-6: cooking-lv30-meal
    target-6: 5|10
    from-6: W4-entry
    rows: 6
  notes: 'Dossier Min-max W3-late / W4-early (confidence M): the gist''s ''Hydrogen + Helium -> Boron -> Neon''
    (tier 4, through v1.21, pre-patch) merged with this dossier''s cost-to-20 ordering (computed from code: Hydrogen
    21K, Lithium 61K, Beryllium 148K to Lv 20). Helium target is a cost guard, not a Source (10^L cost). Fluoride
    only with a Lv 30+ meal (its formula is 1 at zero such meals). W4 mid/late order (Carbon, Nitrogen, Oxygen)
    is confidence L and not included. M26 W3 synth (from maps/atom-collider.json).'
  sources:
  - url: https://gist.github.com/shnaps/161a370ed795e6141e0553eb30ddc8fa
    title: 'shnaps IdleOn progression gist: Hydrogen + Helium, then Boron, then Neon; Fluoride only while cooking
      (self-declared through v1.21, pre-patch)'
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-09-18'
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/atomCollider.ts#L118-L143
    title: 'Toolbox atomCollider.ts getCost / getCostToMax: base 1/(1+R/100) x (x3 + x1*L) x x2^L, R includes collider
      level/10, Neon, Atom Split, stamp, palette, Bubba'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
