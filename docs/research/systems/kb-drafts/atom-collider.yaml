- id: atom-collider.check.hydrogen-full
  system: atom-collider
  type: check
  status: draft
  title: Hydrogen discount is full
  subject: account
  effect: next-action
  category: spendable
  detector:
    id: atom-collider/state
    params:
      part: hydrogen-full
  text: 'Hydrogen is at its 90% cap: raise a stamp cap now'
  why: Waiting past 90% adds nothing; the first cap raise takes the full discount and resets the counter.
  notes: 'Fires when account.spend.hydrogen.discountPct >= 90 and at least one stamp is at cap with its raise material
    in storage (reuse spend/stamp-raise-ready positive side). Must be deduped with spend.check.hydrogen-hold: when
    this fires, hold is silent by construction (neededPct <= 90). Owner may prefer moving this into spend.yaml.
    M26 W3 synth (from maps/atom-collider.json).'
  doneWhen:
    field: account.spend.hydrogen.discountPct
    change: lower
  sources:
