system: bubba
entries:
- id: bubba.check.charisma-pair
  system: bubba
  type: check
  title: Train the other of Hustle and Rizz
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 30
  detector:
    id: bubba/charisma-pair
  text: '{text}'
  why: '{why}'
  values:
    text: 'Train {other} in Bubba''s Charisma Chart: {maxed} is maxed'
    why: Every guide takes both Hustle and Rizz high by Megaflesh 4; they only disagree on which comes first. {other}
      is at {level:int}, the guides aim for {target:int} this run.
  notes: M26 draft (dossier C31, C35). Fires only when one of Hustle/Rizz is at its max and the other is below the
    lowest community target for this Megaflesh (bubba.fact.charisma-targets). It names an attribute only in the
    case both sides agree on, so it does not reopen the contested order (bubba.priority.charisma). Outranks bubba.check.charisma-idle
    when both fire (same tap). Silent from Megaflesh 6 while Mindful is below 120 (bubba.priority.charisma-mindful
    wins). M26 W3 synth (from maps/bubba.json).
  doneWhen:
    field: account.bubba.charisma.selected
    change: changed
  sources:
  - url: https://gameslikefinder.com/article/idleon-bubba-guide/
    title: 'gameslikefinder: Idleon Bubba Seal Guide'
    tier: 4
    claimDate: 2026-05-27
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://www.youtube.com/watch?v=Tz1ow2H_6aA
    title: 'Kanumar: Bubba guide, Megaflesh 1-6'
    tier: 4
    claimDate: 2025-12-13
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/clickers/bubba.ts
    title: IdleOn Toolbox parsers/clickers/bubba.ts
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages: all
  confidence: M
  status: draft
- id: bubba.check.gift-pick
  system: bubba
  type: check
  title: Pick this run's gifts
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 30
  detector:
    id: bubba/gift-pick
  text: '{text}'
  why: '{why}'
  values:
    text: Pick {missing:int} more gift in Bubba for this run
    text-suggest: Pick {gifts} as this run's gifts in Bubba
    why: A gift's passive bonus only counts once it is picked, and Megaflesh clears the picks every run.
    why-suggest: '{source} picks these at Megaflesh {mf:int}.'
  notes: 'M26 draft (C15, C22, C32). Fires when Fun Gifts (idx 9) is above 0 and a pick slot is empty: slot 1 needs
    Fun Gifts 1, slot 2 needs Megaflesh 3. The suggestion is bubba.priority.gifts'' row for this Megaflesh, shown
    as the guide''s choice, not ours. Reset behaviour (C15) is secondhand (L); the empty-slot test reads the save
    directly (H). M26 W3 synth (from maps/bubba.json).'
  doneWhen:
    field: account.bubba.gifts
    change: changed
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/clickers/bubba.ts
    title: IdleOn Toolbox parsers/clickers/bubba.ts
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Bubba
    title: 'IdleOn Wiki: Bubba the Chonky Seal''s Arctic Market of Meats'
    tier: 3
    claimDate: 2026-10-07
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-bubba-guide/
    title: 'gameslikefinder: Idleon Bubba Seal Guide'
    tier: 4
    claimDate: 2026-05-27
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages: all
  confidence: M
  status: draft
- id: bubba.priority.gifts
  system: bubba
  type: priority
  title: Gift picks by Megaflesh
  text: Which two gifts the guides pick at each Megaflesh
  why: Beeg Slice never leaves; the second gift moves from Beach Ball to Numbahs to Slabcakes as the run gets longer.
  values:
    mf-0: '1'
    mf-3: 1 2
    mf-4: 1 3
    mf-7: 1 3|1 5
    mf-8: 1 5
  notes: 'M26 draft (C32 gameslikefinder, C36 Pulse plays 1 and 5). MF7 is the switch row: Numbahs early in the
    run, Slabcakes once the Smoker is open. Page line and the gift-pick suggestion only; never a Goal on its own.
    M26 W3 synth (from maps/bubba.json).'
  sources:
  - url: https://gameslikefinder.com/article/idleon-bubba-guide/
    title: 'gameslikefinder: Idleon Bubba Seal Guide'
    tier: 4
    claimDate: 2026-05-27
