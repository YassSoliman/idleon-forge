  values:
    text: Emulsify Mindful in Bubba's Charisma Chart
    text-plain: Emulsify an attribute in Bubba's Charisma Chart
  notes: 'M26 draft (C12 H: row 6 emulsify; C20 H: x3; C32 M: gameslikefinder ''Emulsify Mindful'' at MF6; C35 Mindful
    first agreed). Fires when Megaflesh >= 6, the Chart is open (idx 6 > 0) and raw Bubba[0][15] is 0. Names Mindful
    only through bubba.priority.charisma-mindful. M26 W3 synth (from maps/bubba.json).'
