- id: bubba.check.dice-reroll
  system: bubba
  type: check
  title: Reroll the Frozen Dice
  subject: account
  effect: next-action
  category: nice
  effortSeconds: 30
  detector:
    id: bubba/dice-reroll
    params:
      share: 0.05
  text: Buy Dice Roll in Bubba to reroll your dice ({total:int} now, best {best:int})
  why: From Megaflesh 5 a reroll that would lower the total is thrown away, so a cheap reroll can only help. Its
    price resets every hour.
  notes: M26 draft (C8 H for the protection and hourly price; C34 Kanumar 'reroll hourly' L). Fires only from Megaflesh
    5, Dice Roll (idx 12) above 0, its cost at most `share` of the next Megaflesh and affordable, and the dice total
    below its best possible (every die at its top face, faces above 6 counted at 1/2.5). Silent while bubba.check.megaflesh
    fires (the reset clears dice). M26 W3 synth (from maps/bubba.json).
  doneWhen:
    field: account.bubba.dice
    change: changed
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/clickers/bubba.ts
