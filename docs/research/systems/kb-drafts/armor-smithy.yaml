  type: priority
  title: Set order
  text: Register the sets the next crafts eat first
  why: 'Each upgrade consumes the piece below it: Gold eats Copper, Platinum eats Iron and Gold Boots, Void eats
    Dementia, Chizoar and Lustre eat Void, Diabolical eats Lustre, Magma eats Troll.'
  values:
    row-1: COPPER_SET|IRON_SET|GOLD_SET
    row-2: AMAROK_SET|PLATINUM_SET|EFAUNT_SET
    row-3: DEMENTIA_SET|VOID_SET
    row-4: CHIZOAR_SET|LUSTRE_SET
    row-5: TROLL_SET|DIABOLICAL_SET
    row-6: MAGMA_SET
    rows: 6
  notes: 'Cost-of-loss order from the crafts.json chain (Tier 1, dossier C42/C43, confidence M for the ordering).
