    title: 'IdleOn Wiki: Set Bonuses'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
  - url: https://idleon.wiki/wiki/Frostbite_Tundra
    title: 'IdleOn Wiki: Frostbite Tundra (equip the set, tap a piece)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2025-07-21'
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/armorSmithy.ts
