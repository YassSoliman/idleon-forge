    tier: 2
    claimDate: 2026-10-05
    verified: 2026-10-19
    gameVersion: 2.3.540
    note: Costs and effects; no buying-priority advice on the page.
- id: bribes.check.bail-gate
  system: bribes
  type: check
  title: Open Set 5 at Trash Island
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: bribes/bail-gate
  text: Buy The Art of the Bail from the Garbage Tuna on Trash Island to open Set 5
  why: Set 5 is sold only after the Bail; its bribes include Star Scraper (+33 star talent points) and Fishermaster.
  doneWhen:
    field: account.spend.bribes[26].status
    becomes: 1
  appliesTo:
