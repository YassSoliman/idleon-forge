- id: bribes.check.next-buy
  system: bribes
  type: check
  title: Buy the next bribe
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: bribes/next-buy
  text: 'Buy the bribe {name} from Mr Pigibank: {price:coins}'
  why: A bribe never expires and its bonus is permanent; by the time one is affordable its price is small next to
    your income.
  doneWhen:
    field: account.spend.bribes[{index}].status
    becomes: 1
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: Bribe book page card only; the Spend Plan stays the single place that schedules coin buys (no duplicate
    Next Action on the Now screen). Buy-in-price-order is derived from data prices, not a published guide (dossier
    C28, C29).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
