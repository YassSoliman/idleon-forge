  title: Bribe order
  text: Buy each open set in price order; save for Changing the Code once Alchemy is open
  why: Every bribe is permanent and cheap by the time it is affordable; Changing the Code's second big-bubble slot
    is worth saving for.
  list: order
  values:
    row-1: 0|1|2|3|4|5
    row-2: 6|8|9|10|11|12|7
    row-3: 15|13|17|14|16|18|19
    row-4: 20|21|22|23|25|24
    rows: 4
  appliesTo:
    stages: all
  confidence: L
  status: draft
  ship: display-only
  shipReason: 'Red team P1: derived, not a published guide.'
  notes: 'Rows are bribe indices. Price order from data; set 2 puts Double Exp Scheme (222,222) last as ''when spare'';
    set 3 puts Changing the Code (1.5M) first per dossier W2 band. Derived, not a published guide (dossier C28/C29):
    no community priority guide found.'
