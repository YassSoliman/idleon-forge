- id: post-office.check.save-streak
  system: post-office
  type: check
  title: Save your Post Office streak
  subject: account
  effect: next-action
  usesExpectedReturn: true
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: post-office/streak
    params:
      minStreak: 5
  text: 'Fill {company} or use a Silver Pen: streak {streak:int} ends at the refresh'
  values:
    text-no-pen: 'Fill {company} before the refresh: streak {streak:int} ends otherwise'
    detail: '{company}: streak {streak:int}'
  why: A streak pays bonus boxes at 5, 10, 15, 20 (+3), 50 (+5) and 100 (+9), and order sizes grow with it. Sources
    disagree on what a Silver Pen does to the streak (the wiki says it keeps it).
  notes: 'Pen semantics disputed: wiki (tier 3, M) keeps the streak and adds a shield day; DigitalTQ (tier 4, L)
    says a pen can reset it. Fires only when a company with streak >= minStreak is open and the refresh lands before
    the expected return. Shield days (wiki-only rule, C26) can postpone the reset; until that rule is verified in
    code, treat shield > 0 as ''banked'' urgency rather than silent.'
  doneWhen:
    field: account.postOffice.companies[*].doneToday
    becomes: true
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L578
    title: Toolbox dashboard streak and dailyShipments alerts
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/postoffice.ts#L49
    title: 'Toolbox postOfficeShipments: totalShipments, streak, shield'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Post_Office
    title: 'IdleOn Wiki: Post Office (streak bonuses, shields, Silver Pen)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
  - url: https://www.digitaltq.com/wiki/idleon/post-office-guide
    title: DigitalTQ Post Office guide (Silver Pen can reset your streak)
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: post-office.goal.next-streak-bonus
  system: post-office
  type: goal
  title: Reach the next streak bonus
  text: '{company}: streak {streak:int} -> {target:int} for +{bonus:int} boxes'
  why: Streak bonuses are free boxes every character can spend. The table is confirmed up to streak 100; past 100
    the sources disagree, so no target is shown there.
  values:
    milestones-1: 5,10,15,25,30,35,45,55,65,70,75,85,90,95
    bonus-1: '1'
    milestones-3: 20,40,60,80
    bonus-3: '3'
    milestones-5: '50'
    bonus-5: '5'
    milestones-9: '100'
    bonus-9: '9'
    maxDetails: 2
  notes: 'Table from the wiki, re-confirmed at 5/20/50/100 by DigitalTQ (C28, C29). Past 100: earlier dossier +5
    at 150 / +9 at 200; latest wiki extract ''+5 cap at 200, +9 at 300+'' (confidence L, not drafted).'
  appliesTo:
    stages:
    - from: W2-early
  confidence: M
  status: draft
  scope: account
  category: compounding
  unit: days
  progress:
    id: post-office/streak-goal
  milestones:
  - at: 1
    reward: Bonus boxes for every character
  sources:
  - url: https://idleon.wiki/wiki/Post_Office
    title: 'IdleOn Wiki: Post Office (streak bonus table)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
  - url: https://www.digitaltq.com/wiki/idleon/post-office-guide
    title: DigitalTQ Post Office guide (5:+1, 20:+3, 50:+5, 100:+9)
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: post-office.priority.box-order
  system: post-office
  type: priority
  title: Post Office box order
  text: Spend boxes in this order for the character's class
  why: A box's first 200 levels pay most (each point at level 100 is worth about 4x one at 400), so the usual order
    is Civil War to 200, the class's main skill box to 200, then Civil War to 400.
  values:
    row-1: '0'
    target-1: '200'
    when-1: always
    row-2: class-main
    target-2: '200'
    when-2: always
    row-3: '0'
    target-3: '400'
    when-3: always
    row-4: class-main
    target-4: '400'
    when-4: always
    class-main-Barbarian: '8'
    class-main-Squire: 4|17
    class-main-Shaman: 6|9
    class-main-Wizard: 6|7
    class-main-Bowman: 10|5
    class-main-Hunter: 16|5
    class-main-Maestro: '11'
    class-main-Journeyman: '11'
    class-main-default: '0'
    rows: 4
  notes: Box indices are shared-data.json postOffice order (0 Civil War, 4 Dwarven, 5 Blacksmith, 6 Timber, 7 Carepack,
    8 Fishheads, 9 Potion Package, 10 Bug Hunting, 11 Non Predatory, 16 Trapping, 17 Construction). 'a|b' = either,
    the first by default; the class's main skill decides. Subclasses inherit their base class row (Divine Knight/Blood
    Berserker -> Barbarian/Squire line etc.). Wiki lists Maestro under the Journeyman line without naming the class
    (C33 disagreement kept). Diminishing-returns ratio derived from the decay formula (C6, confidence H on maths).
  appliesTo:
    stages:
    - from: W2-early
  confidence: M
  status: draft
  sources:
  - url: https://idleon.wiki/wiki/Post_Office
    title: 'IdleOn Wiki: Post Office (''usual orders'' per class; ~75% of the bonus at 200)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-10-07'
  - url: https://www.reddit.com/r/idleon/comments/1tyi01h/comment/oq3xa0r/
    title: 'r/idleon: 200 in combat, then the main skills, then combat again'
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-06-06'
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/postoffice.ts#L33
    title: Toolbox getPostOfficeBonus (thresholds and growth)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/wiki/growth.mjs#L12
    title: Toolbox growth curves (decay x1*L/(L+x2))
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: post-office.check.open-next-bonus
  system: post-office
  type: check
  title: Open a box's next bonus
  subject: character
  effect: next-action
  needsCharacter: true
  category: compounding
  effortSeconds: 30
  detector:
    id: post-office/thresholds
  text: 'Put {need:int} boxes into {box}: its {ordinal} bonus starts at level {at:int}'
  why: A box's 2nd bonus starts at level 26 and its 3rd at 101 (51 and 201 on the 800-cap boxes). {box} sits just
    below, and you have the boxes now.
  notes: Fires when unspent >= need and a box in the character's plan (priority.box-order) is within 5 levels below
    26 or 101. Thresholds are game data (upgradeLevels 24.9 / 99.9 with round), confidence H; the 'push it now'
    advice M.
  doneWhen:
    field: characters[*].postOfficeBoxes
    change: higher
  appliesTo:
    stages:
    - from: W2-early
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/postoffice.ts#L33
    title: 'Toolbox getPostOfficeBonus: bonus 2 uses round(L-24.9), bonus 3 round(L-99.9)'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: Game data postOffice upgradeLevels and maxLevel
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: post-office.check.slug-slurp
  system: post-office
  type: check
  title: Level the Slug Slurp vial
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: post-office/slug-slurp
    params:
      targetLevel: 4
  text: 'Level the Slug Slurp vial ({level:int} -> {target:int}): +2 boxes per level on every character'
  why: Each vial level adds 2 box points to every character's total, forever. It takes Hermit Cans.
  notes: Fires when the Post Office is unlocked and vialLevels[19] < targetLevel. Effect is tier 1 (vials.json[19]
    add x1=2, read by getVialsBonusByStat 'BoxPoints'); the target level is a default, confidence M. The vial's
    own description says 'easily the best bonus in the game' - game flavour text, not used as a Source. Coordinate
    with alchemy-vials.priority.plan (add index 19 to a row) rather than duplicate if the vial plan owns vial levels.
  doneWhen:
    field: account.alchemyPlan.vialLevels[19]
    change: higher
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/vials.json
    title: 'Game data vial 19 SLUG_SLURP: BoxPoints add x1=2'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/postoffice.ts#L21
    title: 'Toolbox: vial BoxPoints added to every character''s box total'
