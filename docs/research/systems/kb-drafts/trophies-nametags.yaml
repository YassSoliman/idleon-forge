- id: trophies-nametags.goal.found
  system: trophies-nametags
  type: goal
  title: Trophies and nametags found
  subject: account
  scope: account
  category: nice
  unit: items
  text: Trophies {trophies:int} of {trophyMax:int} · nametags {nametags:int} of {nametagMax:int} · rack hats {hats:int} of
    {hatMax:int}
  why: 'Each one found is permanent (slab) and later scores Tome points: 22 trophies, 20 nametags and 75 hats max their Tome
    rows.'
  detector:
    id: trophies-nametags/found
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: Mechanic M1, M12. trophies/nametags from account.looty.lootyRaw substring counts (calcTrophiesFound/NametagsFound);
    hats = hatRack.totalHats. Max shown = Tome x1 (22/20/75). Tome rows count only from Account LV 950/990/1030 (tomeLvReq),
    so the Tome map owns the PTS; this goal only shows counts.
  sources:
