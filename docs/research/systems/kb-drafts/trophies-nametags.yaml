- id: trophies-nametags.fact.keep-duplicates
  system: trophies-nametags
  type: fact
  title: Keep spare nametags
  subject: account
  text: 'Keep duplicate nametags: copies stack in the W7 Gallery up to 2.5x'
  why: Each extra copy of the same nametag raises its Gallery multiplier (1, 1.6, 2, 2.3, 2.5x at 1-5 copies), so a spare
    is never junk.
  detector:
    id: trophies-nametags/held-duplicates
  appliesTo:
    stages:
    - from: W1-early
      to: W4-late
  confidence: H
  status: draft
  notes: 'Mechanic M11. Show only when the account holds 2+ copies of one nametag (inventory + storage + worn) or 2+ of a
    trophy that has a duplicate achievement (Blunder Hero, YumYum Sheriff). Fact, not a Check: nothing to do now except not
    sell. Wiki and Toolbox agree (dossier C10, H).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-7/gallery.ts#L466
