entries:
- id: trophies-nametags.check.fill-slots
  system: trophies-nametags
  type: check
  title: Fill trophy, nametag and hat slots
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  priority:
    frame: by-value
  text: '{text}'
  why: '{why}'
  values:
    many: Equip a held trophy, nametag or hat on {n:int} characters
    one: Equip a held {kind} on the {who}
    why: These cosmetic slots carry real stats (damage, drop rate, AFK gains) and give them while worn.
    detail: '{who}: {item} ({line}) from {from}'
  detector:
    id: trophies-nametags/empty-slots
  appliesTo:
    stages:
    - from: W1-early
      to: W4-late
  confidence: H
  status: draft
  notes: 'Mechanics M2, M3. Per character: equipment[10] trophy, [14] nametag, [8] premium hat empty AND the account holds
    an item of that type (any character''s inventory or storage, rawName from Type TROPHY / NAMETAG / PREMIUM_HELMET) that
    the character can wear (lvReqToEquip <= class level). Trophy/nametag lines count only while the character has NOT cleared
    map 250 (Gallery off); the hat line only while map 50 is NOT cleared (Hat Rack off), so the detector drops the hat slot
    once hatRackActive. Same rule as gear.check.equip-held (''no slot that can hold something should be empty''); merge into
    it at build time if the gear module prefers one Check.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/items.ts#L82
    title: 'Toolbox getStatsFromGear: gallery/rack items skipped once the gate map is cleared'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/hatRack.ts#L118
