- id: trophies-nametags.goal.hat-rack-gate
  system: trophies-nametags
  type: goal
  title: Switch on the Hat Rack
  subject: account
  scope: account
  category: compounding
  unit: characters
  text: '{text}'
  why: '{why}'
  values:
    text: Clear YumYum Grotto on {n:int} more characters to switch on the Hat Rack
    why: Your rack holds {hats:int} hats (+{multi:pct} each stat line). A character only gets them after clearing the map;
      before that only the worn hat counts.
  detector:
    id: trophies-nametags/hat-rack-gate
  appliesTo:
    stages:
    - from: W1-mid
      to: W4-late
  confidence: H
  status: draft
  notes: 'Mechanic M7. Fires when account.hatRack.totalHats > 0 and some character has hatRackActive false (map 50 YumYum
    Grotto not cleared, kills[50] < portal req). Once a character clears it, every hat on the rack applies to that character
    x HatrackBonusMulti instead of only the worn hat. Text names how many characters still miss it. The map index-to-world
    mapping (YumYum Grotto, W2 desert) is from mapNames; the Toolbox file lives under world-3 (dossier says W3 area): treat
    the map name as truth.'
  sources:
