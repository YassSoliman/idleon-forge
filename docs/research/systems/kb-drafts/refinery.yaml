- status: draft
  id: refinery.check.throttle-ready
  system: refinery
  type: check
  title: Use Refinery Throttle
  subject: character
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 20
  detector:
    id: refinery/throttle
  text: 'Cast Refinery Throttle on {character}: +{cycles:int} Refinery cycles'
  why: Refinery Throttle is off cooldown. Each cast runs {cycles:int} extra cycles of every active salt at once
    (they still cost fuel); the cooldown only restarts when you cast it.
  doneWhen:
    field: characters[*].refineryThrottle.cooldownEndsAt
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
    classes:
    - Squire
    - Divine_Knight
  confidence: M
  notes: 'Silent unless the character''s REFINERY_THROTTLE level > 0, the cooldown (cooldowns[130] minus time since
    afkTime) is <= 0, and at least one active salt has fuel for one cycle. Cycles = 3 + floor(level/8) (talents.json
    x1=3, x2=8). Open question: Toolbox reads maxLevel, not level, for the cycle count. M26 W3 synth (from maps/refinery.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts#L182-L213
