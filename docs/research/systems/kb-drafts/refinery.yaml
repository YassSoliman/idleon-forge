- status: draft
  id: refinery.check.salt-deficit
  system: refinery
  type: check
  title: A Refinery salt burns more than its predecessor makes
  subject: account
  effect: next-action
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 30
  detector:
    id: refinery/salt-balance
    params:
      form: deficit
  text: Rank up {previous:name} before ranking {salt:name} again
  why: '{salt:name} burns {consumed:int} {previous:name} an hour; the Refinery makes {made:int}. The stock runs
    down until {salt:name} stops, so its next ranks cost you salt instead of making it.'
  doneWhen:
    field: account.refinery.salts[*].isDeficit
    becomes: false
  appliesTo:
    stages:
    - from: W3-mid
      to: W4-entry
  confidence: M
  notes: 'Toolbox dashboard saltDeficit rule: unlocked, active, Auto Refine off, rank >= maxSafeRank, !outputMaxed,
    isDeficit. Reads saltMaxSafeRank (predecessor), never the printer-capped maxSafeRank (M15 red-team #1). Never
    says ''turn Auto Refine on'' (M15 D-2). Dossier W3-late: ''do not rank a salt beyond saltMaxSafeRank'' (M).
    M26 W3 synth (from maps/refinery.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/refinery.ts#L339-L417
