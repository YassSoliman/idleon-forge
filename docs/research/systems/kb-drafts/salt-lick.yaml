- id: salt-lick.check.spontaneity
  system: salt-lick
  type: check
  title: Level Salt Lick liquid rate
  text: '{text}'
  why: '{why}'
  values:
    line: 'Level the Salt Lick liquid upgrade {from:int} -> {to:int} ({cost:int} Spontaneity Salts): +1% rate on all four
      liquids'
    line-cap: 'Level the Salt Lick liquid upgrade {from:int} -> {to:int} ({cost:int} Spontaneity Salts): +1% rate on all liquids,
      +1% cap on {bleached}'
    why: Each level adds +1% fill rate to every liquid; capacity only grows on liquids with a Bleach or Dragonic cauldron.
  notes: 'contradictions-1 verdict 3 (H): the rate half is in the game''s LiquidHRrate percent group in all three branches
    (N.js @5121626-5122463) and Toolbox omits it; the capacity half is only inside the Bleach/Dragonic term (0.5 + SL/100
    with Bleach, SL/100 + 2 with both, 1 Dragonic-only, so no capacity from Salt Lick for Dragonic-only liquids) (N.js LiquidCap
    @5116234; Toolbox alchemy.ts#L159-L187). Bonus = level x SaltLicks[5][3] = level x 1 (N.js @7821917). The game''s own
    text (Toolbox saltLick[5].desc) reads ''+{%} Liquid rate and Capacity for all liquids''. No community priority order was
    found, so this is a Check, never a priority rank.'
  sources:
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client: LiquidHRrate adds SaltLick(5) to every liquid''s rate (@5121626); LiquidCap uses it only in the Bleach/Dragonic
