      to: W4-late
  confidence: H
  status: draft
  notes: "Dossier M10 (tier 1, H): stacks = floor(max(0,(PTS-5000)/2000)); first stack at 7,000. Fires only when one of the six bubbles is unlocked (alchemy bubbles power#27/#29, quicc#28/#29, high-iq#28/#29)."
  sources:
