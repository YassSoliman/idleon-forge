  text: "Reach {next:int} Tome PTS ({left:int} to go) for Tome bubble stack {stacks:int}"
  why: Each 2,000 Tome PTS above 5,000 adds one more stack to the Tome STR, AGI and WIS bubbles and the three Chapter bubbles you own.
  detector:
    id: tome/bubble-stack
  doneWhen:
    field: account.tome.bubbleStacks
    change: higher
  appliesTo:
    stages:
