- id: tome.check.claim-nametags
  system: tome
  type: check
  title: Claim your Tome nametags
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 60
  text: "Claim {available:int} Tome nametag{available:s} at the Tome (rank: {rank})"
  why: "Your Tome score is in the {rank} this month; each tier reached gives one nametag, and the claim count resets monthly."
  detector:
    id: tome/nametags
  doneWhen:
    field: account.tome.nametags.available
    change: lower
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-late
  confidence: H
  status: draft
  notes: "Dossier M12 (tier 1, H): available = max(0, top+1 - claimedThisMonth), month = floor(GlobalTime/2,628,000) vs accountOptions[448]; gated by serverVars.TomeOn === 1. Ranks 60-95% (tops 7-11) give\
    \ no nametag."
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/tome.ts#L144"
    title: "Toolbox nametagClaim: TomeOn, claimed, month stamp, available"
