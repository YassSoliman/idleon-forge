- id: obols.goal.golden-obolden
  system: obols
  type: goal
  title: Golden Obolden! before you destroy Gold obols
  scope: account
  category: nice
  unit: Gold obols equipped
  progress:
    id: obols/achievements
    params:
      which: golden
  milestones:
