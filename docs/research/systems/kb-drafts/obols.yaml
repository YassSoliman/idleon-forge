    reward: +20% Obol Fragments when destroying
  text: Equip {left:int} more Gold obols on {who} (family slots count)
  why: With 15 Gold equipped at once, destroying an obol pays 20% more fragments (Gold 9 not 8, Platinum 24 not 20), so keep
    spare Gold+ obols until then.
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  notes: H for the achievement and payout (achievements.json#99, N.js @8331721); M for the 'hold off destroying' advice built
    on it. Silent when account.achievements[99].completed or the account owns no Gold+ obol.
