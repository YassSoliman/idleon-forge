- id: obols.fact.storage
  system: obols
  origin: authored
  title: Obol Storage size formula
  rows: N0 = 5 + ceil(S/4) + G, N1 = 4 + ceil((S-1)/4) + floor(G/2), N2 = 3 + ceil((S-2)/4) + floor(G/3), N3 = 2 + ceil((S-3)/4)
    + floor(G/3); slots = 4*N
