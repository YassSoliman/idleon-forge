    reward: +2% Arcade balls/hr
  text: Equip {left:int} more Silver obols on {who} (family slots count)
  why: The achievement counts Silver obols equipped at once on one character, family tab included, and pays +2% Arcade balls
    an hour.
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
  confidence: H
  status: draft
  notes: Progress = max over characters of (Silver obols in personal slots + Silver in family slots). Silent when account.achievements[83].completed.
    Pick the character with the most.
