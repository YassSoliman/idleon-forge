system: obols
status: draft
entries:
- id: obols.check.swap-better
  system: obols
  type: check
  title: Swap in a better obol
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: obols/swap
  text: Swap the {stored} from storage in for the {equipped} on {where}
  why: It has at least as much of every stat the {equipped} gives and more of {better}, so the swap only adds.
  values:
    groupText: Swap {count:int} stored obols in for weaker ones
    detailText: '{where}: {equipped} → {stored}'
    maxDetails: 3
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
  confidence: H
  status: draft
  notes: 'Fires only for strict dominance on the same shape: every summed line of the equipped obol (final stats, rerolls
    included) <= the stored obol''s catalogue line, one strictly greater. Stored obols are compared at base stats (their reroll
    maps are not parsed), so a rerolled stored obol is under-rated, never over-rated. Family slots first. No stat-type judgment
    (that would be L).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/obols.ts#L60-L78
    title: 'Toolbox: obol stats summed, positive only'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: 'Toolbox game data: obol item stats and typeGen shapes'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Obols
    title: 'IdleOn Wiki: Obols'
    tier: 3
    claimDate: 2026-10-07
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: obols.check.main-stat
  system: obols
  type: check
  title: Main-stat obols on each character
  subject: character
  effect: next-action
  category: compounding
  needsCharacter: true
  effortSeconds: 60
  detector:
    id: obols/main-stat
  text: Put the stored {stored} on {who} in place of the {equipped}
  why: '{class} uses {stat}; the {equipped} gives {offStat}, which does less for this character.'
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Only pure stat obols (lines only in STR/AGI/WIS/LUK). Fires when a personal slot holds an off-stat one and a stored
    obol of the same shape has the character''s main stat (Toolbox mainStatMap) at >= that obol''s value. Dossier per-class
    rule: Warrior STR, Archer AGI, Mage WIS, Journeyman/Beginner LUK. M: LUK also feeds drop rate, so off-stat LUK on a farmer
    is never flagged.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/talents.ts#L87
    title: 'Toolbox: mainStatMap (class -> main stat)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: 'Toolbox game data: stat obols (Bronze 1 ... Dementia 12)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Obols
    title: 'IdleOn Wiki: Obols'
    tier: 3
    claimDate: 2026-10-07
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: obols.goal.reroll-dr
  system: obols
  type: goal
  title: Reroll a drop-rate obol
  scope: account
  category: nice
  unit: rerolled drop-rate obols
  progress:
    id: obols/reroll
  text: Reroll the {obol} in {where} for a chance at +1 drop rate ({frags:int} fragments, {coins} coins)
  why: A reroll costs little at Bronze and Silver; about 1 reroll in 6 or 7 lands +1 on the drop-rate line, and combining
    keeps the left obol's rerolls.
  values:
    maxDetails: 2
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Two views recorded: wiki ''reroll only high rarity'' vs r/idleon ''reroll fresh drops first''; the client cost (C31
    H) and pass chain (C33 M) make low-rarity rerolls cheap, so the cheapest equipped non-rerolled %_DROP_RATE obol is picked.
    Silent when fragments < cost. ''Rerolled'' = Toolbox flag (any bonus > 0, C62). Idleon Academy ''skip Obols early'' (tier
    4, 2025-09-23) is why this starts at W2-mid. The ''left obol carries'' clause rests on C36 (L): keep it in why only as
    ''combining keeps the left obol''s rerolls'' and drop it if contested.'
  sources:
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client N.js v1.23 @4084680: ObolRerollCostMoney / ObolRerollCostFrag'
    tier: 1
    claimDate: 2026-10-17
    verified: 2026-10-19
    note: N.js-only claims sit at L in the dossier (not re-checked by both verifiers)
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client N.js v1.23 @6752045-@6755528: reroll pass chain'
    tier: 1
    claimDate: 2026-10-17
    verified: 2026-10-19
    note: N.js-only claims sit at L in the dossier (not re-checked by both verifiers)
  - url: https://idleon.wiki/wiki/Obols
    title: 'IdleOn Wiki: Obols'
    tier: 3
    claimDate: 2026-10-07
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://reddit.com/r/idleon/comments/1o2djl4/when_should_i_start_obol_farming/
    title: 'r/idleon: reroll a fresh drop first, upgraded/rerolled on the left'
    tier: 4
    claimDate: 2025-10-09
    verified: 2026-10-19
- id: obols.goal.combine
  system: obols
  type: goal
  title: Combine a pair of obols
  scope: account
  category: nice
  unit: combinable pairs
  progress:
    id: obols/combine
  text: Combine your two {obol} into a {next} ({odds:int}% a try, {frags:int} fragments, {coins} coins)
  why: Two identical obols can become one of the next rarity{shapeNote}.
  values:
    shapeNote-change: ; it becomes a {shape}, and you have a {shape} slot for it
    maxDetails: 2
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Pairs = identical rawName across storage and equipped slots. Odds 1/(4+ID) (C34 M, wiki agrees C65). Cost = 2x reroll
    (C35 M). Silent when the successor does not exist (Dementia, boss, Hyper: C37 Disputed, wiki lists Dementia 12.5%) or
    when the result''s shape has neither an open slot nor a weaker obol of that shape (C38 H). Silent while the pair''s shape
    still has open slots for both (equipping both beats combining). Never claims ''safe'': Bronze/Silver failures can destroy
    the right obol (C36 L, not stated).'
  sources:
  - url: https://www.legendsofidleon.com/ytGl5oc/N.js
    title: 'Game client N.js v1.23 @6761082-@6762800: combine roll randomInt(1,4+ID), ObolRarities'
    tier: 1
    claimDate: 2026-10-17
    verified: 2026-10-19
    note: N.js-only claims sit at L in the dossier (not re-checked by both verifiers)
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: 'Toolbox game data: successor names and typeGen per rarity'
    tier: 1
    verified: 2026-10-19
