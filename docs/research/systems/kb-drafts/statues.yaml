- id: statues.check.onyx-ready
  system: statues
  type: check
  title: Make a statue Onyx
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 60
  detector:
    id: statues/onyx-ready
  text: Drop a stack of 20,000 {statue} statues on the Statue Man to make it Onyx
  why: Onyx doubles the statue's bonus for good; it must be Gold first and the Onyx Tools must be on the Statue
    Man.
  notes: 'C19 (M: wiki + Steam) for the 20,000-stack and Gold-first rule; C22 (H) for x2. Fires when any character
    finished Monolith[2] and a Gold (grade 1) statue has >= 20,000 held. Order among several ready stacks is not
    advised (AutoReview C49 is L): it names the one with the most held.'
  doneWhen:
    field: account.statues[].grade
    change: higher
  sources:
