- id: statues.fact.exp-curve
  system: statues
  type: fact
  origin: authored
  title: Statue EXP to next level
  rows:
    formula: round(L^1.17 * 1.35^(L/10) + 1)
    examples:
      '1': 2
      '10': 21
      '20': 62
      '50': 437
      '100': 4400
      '200': 199014
  notes: C5 (M, Toolbox Statues.jsx nextLv tier 2); C6 (game rounds only to 300, L).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/components/account/Worlds/World1/Statues.jsx
