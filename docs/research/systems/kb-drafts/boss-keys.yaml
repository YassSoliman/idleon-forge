- id: boss-keys.check.mini-boss-capped
  system: boss-keys
  type: check
  title: Summon a capped mini boss
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 300
  detector:
    id: boss-keys/mini-bosses
    params:
      part: capped
  text: 'Summon {boss}: {count:int} are waiting and the count has stopped'
  why: '{boss} stops adding spawns at {cap:int}, so every day you wait now is lost. Each kill can drop {key}, a
    card and Time Candy.'
  values:
    how-slush: Drop a Bucket of Slush on the snow pile at Refrigeration Station
    how-mush: Drop a Toxic Sludge or Radioactive Waste on a mushroom at Spaceway Raceway (one Mush per mushroom)
  doneWhen:
    field: account.miniBosses[*].count
    change: lower
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'Fires when count >= cap (Slush 10, Mush 8; Magmus/Spiritlord 6 are W5+/W6). Formula and caps C26 H; Toolbox
    alerts on a user threshold (C41 H). Gate dispute: Toolbox lists Slush when finishedWorlds.World3 and Mush when
    World2 (looks swapped against their home worlds W3/W4). Rule here: show only when BOTH the Toolbox flag is true
    AND the boss''s own world is reached (Slush: World2 finished; Mush: World3 finished). Summon-item locations
    are wiki only (C27 L): they go in values as how-to text, not as a claim the rule depends on.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L1518-L1581
    title: 'Toolbox getMiniBossesData: count = min(cap, floor((max(days,3)-3)^exp)); Slush cap 10, Mush cap 8'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L199-L220
    title: Toolbox dashboard 'keys' and 'miniBosses' alerts
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Dilapidated_Slush
    title: 'IdleOn Wiki: Dilapidated Slush (spawn schedule, Bucket of Slush)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Mutated_Mush
    title: 'IdleOn Wiki: Mutated Mush (spawn schedule, Toxic Sludge / Radioactive Waste)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: boss-keys.priority.key-use
  system: boss-keys
  type: priority
  title: What to spend boss keys on
  text: First clears, then what a Goal needs, then Chaotic
  why: A first kill opens a world; Normal runs are the cheapest materials and cards; Chaotic costs 5 keys and the
    top tier needs damage few accounts have early.
  values:
    row-1: first-clear
    row-2: goal-materials
    row-3: chaotic
    row-4: top-tier
    rows: 4
  list: order
  tiers:
  - - boss-keys.check.first-clear
  - - boss-keys.goal.amarok-slabs
  appliesTo:
    stages: all
  confidence: L
  status: draft
  ship: display-only
  shipReason: 'Red team P1: inference, no published Source.'
  notes: 'Dossier ''Key-use priority (inference)'' from tier-1 drop/stat data, confidence M; the dossier found no
    community order (stricter orders absent). Row 4 is never recommended by ActiveOn (O7: no damage thresholds found);
    it is shown as information only.'
