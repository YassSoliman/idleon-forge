system: boss-keys
status: draft
entries:
- id: boss-keys.check.first-clear
  system: boss-keys
  type: check
  title: Open the next world's portal
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 300
  detector:
    id: boss-keys/first-clear
  text: Spend 1 {key} on Normal {boss} for the {crystal}
  why: The first {boss} kill drops the {crystal}, which {npc} takes to open World {next:int}. Normal costs 1 key
    and you hold {held:int}.
  values:
    detail-hp: 'Normal {boss}: {hp} HP in the game data'
    w4-npc: the next gatekeeper
  doneWhen:
    field: account.worldCrystals
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'Fires per world n in 1..4 when: the world is reached (account.currentWorld >= n or finishedWorlds.World(n-1)),
    finishedWorlds.World(n) is false, the crystal n is not held (worldCrystals), and key n held >= 1 (account.keys[n].held).
    Crystal recipients C14 (M; Magma Geode recipient L, so W4 text names no NPC). Entry cost 1 for Normal is wiki-only
    (C10, M). World completion is inferred from gatekeeper dialogue, not a kill record (C15 H). Does not judge whether
    the character can win (O7: no damage thresholds in any source).'
  sources:
  - url: packages/toolbox-parsers/vendor/data/website-data/items.json (Key1-Key5, Crystal1-Crystal4)
    title: 'Game data: boss keys and portal crystals'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: packages/toolbox-parsers/vendor/data/website-data/quests.json (Builder_Bird.1, Constructor_Crow.1, Carpenter_Cardinal.1)
    title: 'Game data: gatekeeper quests take the portal crystal'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/quests.ts#L29-L44
    title: 'Toolbox finishedWorlds: a world counts as finished once any character talked to its gatekeeper'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Amarok
    title: 'IdleOn Wiki: Amarok (entry 1 / 5 / 30 keys)'
    tier: 2
    claimDate: '2026-10-02'
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Efaunt
    title: 'IdleOn Wiki: Efaunt (entry 1 / 5 / 40 keys)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Chizoar
    title: 'IdleOn Wiki: Chizoar (entry 1 / 5 / 50 keys)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Massive_Troll
    title: 'IdleOn Wiki: Massive Troll (entry 1 / 5 / 60 keys; mission mechanic)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: boss-keys.check.first-key
  system: boss-keys
  type: check
  title: Get your first key for this world's boss
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 600
  detector:
    id: boss-keys/first-clear
    params:
      part: no-key
  text: '{text}'
  why: '{why}'
  values:
    text-1: 'Do Dog Bone''s quest ''Why he Die???'' (3 Wood Board Bone): 6 Forest Villa Keys'
    text-2: 'Do Djonnut''s first quest (10 Shrapshell, a Kebab Stick, a Meat Pie): 5 Efaunt''s Tomb Keys'
    text-3: 'Do Bellows'' first quest (kill 50 Neyeptunes actively): 1 Chizoar''s Cavern Key'
    text-4: Get a Troll's Enclave Key from Mutated Mush or a Colosseum chest
    why: You need 1 key to fight {boss}, and its first kill opens World {next:int}. You hold none and none are banked.
    why-4: 'World 4 has no daily key NPC: Troll''s Enclave Keys come from Mutated Mush, Colosseum chests, rare Stilted
      Seeker drops and the Post Office.'
  doneWhen:
    field: account.keys[*].held
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: Same gates as first-clear but key n held = 0 and banked = 0. Quest requirements are game data (C6, C7,
    C8 H). W4 sources C21 H (data), C23 H (wiki, Post Office); the Mush drop rate is disputed 100x (C30 L) so the
    text promises no rate.
  sources:
  - url: packages/toolbox-parsers/vendor/data/website-data/quests.json (Dog_Bone.1-2, Djonnut.1-3, Bellows.1-4)
    title: 'Game data: key-paying quests, requirements and rewards'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/misc.ts#L602-L626
    title: 'Toolbox enhanceKeysObject: daily-key NPC table (Dog_Bone > 5, Djonnut > 6, Bellows > 8.5), 3-day bank,
      no Key4/Key5 daily'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: packages/toolbox-parsers/vendor/data/website-data/monsterDrops.json (mini4a, w4c4, ChestA4-C4)
    title: 'Game data: Key4 sources'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Mutated_Mush
    title: 'IdleOn Wiki: Mutated Mush (spawn schedule, Toxic Sludge / Radioactive Waste)'
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: boss-keys.check.unlock-daily
  system: boss-keys
  type: check
  title: Unlock a daily key on another character
  subject: character
  effect: next-action
  needsCharacter: true
  category: compounding
  effortSeconds: 900
  detector:
    id: boss-keys/daily-coverage
    params:
      part: next
  text: 'Finish {npc}''s quest {quest:int} on this character: +1 {key} a day'
  why: Each character that gets this far with {npc} adds one key to the daily bank, forever. {earning:int} of {total:int}
    characters earn it now.
  values:
    detail-req: 'Needs: {req}'
  doneWhen:
    field: account.keys[*].perDay
    change: higher
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'One finding per NPC (Dog Bone, Djonnut, Bellows) whose world the account has reached: the highest-level
    character whose npcDialog is at or below the earner threshold, preferring one whose unlock quest is already
    accepted (characters[].quests status 0). Unlock quest: Dog Bone 1, Djonnut 2, Bellows 3 (wiki C9 M). Threshold
    dispute: Toolbox earns Djonnut keys at npcDialog > 6 (C3), the adapter at > 5 (M6 R1); keep the adapter''s KEYS
    table as the single source and note the open question. Requirements text from quests.json (C6-C8 H).'
