- id: boss-keys.check.quest-ready
  system: boss-keys
  type: check
  title: Hand in a key quest
  subject: character
  effect: next-action
  needsCharacter: true
  category: spendable
  effortSeconds: 120
  detector:
    id: boss-keys/quest-ready
  text: 'Hand in {npc}''s ''{quest}'' on this character: {reward}'
  why: You already hold what it asks for ({req}).
  doneWhen:
    field: characters[*].quests
    change: higher
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'Item-only key quests: Dog Bone 1 (3 Wood Board Bone -> 6 keys), Dog Bone 2 (25 Amarok Slab, not consumed
    -> 5 keys + token), Djonnut 1 (10 Shrapshell + Kebab Stick + Meat Pie -> 5 keys), Djonnut 3 (2500 each Melty
    Cube, Sticky Stick, Mamooth Tusk -> 5 keys + token). Fires on a character with the quest accepted (status 0)
    or the previous one done and this one not started, when storage + that character''s bag hold the items. Kill
    quests (Djonnut 2, Bellows 1-3) are not item-checkable and stay with unlock-daily/first-key.'
  sources:
  - url: packages/toolbox-parsers/vendor/data/website-data/quests.json (Dog_Bone.1-2, Djonnut.1-3, Bellows.1-4)
    title: 'Game data: key-paying quests, requirements and rewards'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: boss-keys.goal.amarok-slabs
  system: boss-keys
  type: goal
  title: Amarok Slabs for Dog Bone
  text: Collect 25 Amarok Slabs ({have:int}/25)
  why: 'Dog Bone''s second quest pays 5 Forest Villa Keys and his token, and doesn''t take the Slabs. Normal Amarok
    (1 key) drops a Slab 30% of the time: the best Slabs per key.'
  values:
    detail-runs: About {runs:int} more Normal Amarok runs at 0.3 Slabs a key
  scope: account
  category: compounding
  unit: slabs
  progress:
    id: boss-keys/amarok-slabs
  milestones:
  - at: 25
    reward: 'Dog Bone quest 2: 5 Forest Villa Keys + Dog Bone Token'
  appliesTo:
    stages: all
  confidence: M
  status: draft
  notes: 'Active only while some character has Dog Bone 2 accepted or Dog Bone 1 done and 2 not done. ''Normal is
    the most key-efficient for Slabs'' is inference from tier-1 drop data (C33: 0.3/key Normal vs 0.24/key Chaotic,
    M); entry costs are wiki-only (C10 M). Slab rawName Quest17.'
  sources:
