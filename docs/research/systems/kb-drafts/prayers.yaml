- id: prayers.check.unending-overnight
  system: prayers
  type: check
  title: Unending Energy caps AFK at 10 hours
  subject: character
  effect: blocker
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 30
  detector:
    id: prayers/unending-overnight
  text: '{who} has Unending Energy on and has been away {hours:int} h: AFK gains may have stopped at 10 h (sources disagree)'
  why: Unending Energy's curse fixes max AFK time at 10 hours, so every hour past that earns nothing. Swap it off before a
    long stretch.
  doneWhen:
    field: characters[{index}].afk.afkSince
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  notes: Cap is H (game data, generated fact prayers.fact.unending-energy-cap, 36000 s). The advice mirrors Toolbox's own
    worshipAlerts (tier 2 dashboard logic). Fires only when equipped and now - afkSince > 36000 s. M26 W3 synth (from maps/prayers.json).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: Unending Energy curse, max AFK time 10 hours'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/characters.js#L68
    title: 'Toolbox dashboard alert: Unending Energy and AFK over 10 h'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
