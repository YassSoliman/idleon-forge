- id: prayers.check.empty-slot
  system: prayers
  type: check
  title: Fill a prayer slot
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: prayers/empty-slot
  text: '{text}'
  why: '{why}'
  values:
    text-skill: 'Equip Skilled Dimwit on {who}: +{bonus:int}% skill efficiency while {verb}'
    why-skill: '{who} skills AFK, so the curse (-{curse:int}% skill EXP) costs less than the efficiency it gives; {free:int}
      of {slots:int} slots are empty.'
    text-tachion: Equip Tachion of the Titans on {who} for the giant quests
    why-tachion: Giant monsters only appear for a character with Tachion equipped (game text); Snouts 3 and Bellows 3 need
      one.
  doneWhen:
    field: characters[{index}].afk.prayers
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Fires only for the two cases the dossier backs at M or better: an AFK skiller (MINING/CHOPPING/FISHING/CATCHING/TRAPPING)
    with Skilled Dimwit owned, unequipped, and not paired with Balance of Proficiency; and Tachion owned while a giant quest
    is open (Toolbox does not model the Tachion gate: disputed, M). Fighter prayers (Big Brain, Midas, Jawbreaker) are NOT
    suggested: their +200-250% monster HP curse needs a one-shot test ActiveOn does not have yet. M26 W3 synth (from maps/prayers.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/efficiency.ts#L169
    title: 'Toolbox: Skilled Dimwit bonus feeds skill efficiency'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L1670
    title: 'Toolbox: Skilled Dimwit curse lowers skill EXP'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json
    title: 'Toolbox game data: Snouts 3 and Bellows 3 need a giant (prayer)'
