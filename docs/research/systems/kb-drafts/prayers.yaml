    change: lower
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  notes: Fires when a FIGHTING character has >= 1 HP-curse prayer and survivability < 100 (afk.fighting). A real one-shot
