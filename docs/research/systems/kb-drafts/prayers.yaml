  text: 'Unlock {name} at the Prayer Rock: {cost:int} {soul} souls (you hold {held:int})'
  why: Its tower-defence wave is reached and the first level costs only its base price; every character can then equip it.
  doneWhen:
    field: account.prayers[{prayerIndex}].level
    becomes: 1
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: H
  status: draft
  notes: Cost of level 1 = costMulti (calcPrayerCost at L=0). Fires for the cheapest affordable owned-wave prayer. Placeholders
    (indices 19-24) never reach account.prayers. M26 W3 synth (from maps/prayers.json).
