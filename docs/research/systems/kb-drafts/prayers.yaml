- id: prayers.check.level-cheap
  system: prayers
  type: check
  title: Cheap prayer level
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 60
  detector:
    id: prayers/level-cheap
  text: 'Level {name} {from:int} → {to:int}: {cost:int} {soul} souls'
  why: Up to level 5 a level costs a flat step; from level 6 each costs 12% more again. Levels raise the bonus and the curse
    by the same 10% of base.
  doneWhen:
    field: account.prayers[{prayerIndex}].level
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Only for a prayer equipped by at least one character, level < 5, cost <= souls held, and after every affordable
    unlock of that soul (unlock-next first). Priority order is DERIVED from the cost curve (dossier M3), no community source
    fetched: M. M26 W3 synth (from maps/prayers.json).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/prayers.ts#L50
    title: 'Toolbox getPrayerBonusAndCurse: x*(1+(L-1)/10)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/prayers.ts#L70
    title: 'Toolbox calcPrayerCost: x1.12 per level past 5'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
