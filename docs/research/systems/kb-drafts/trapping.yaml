- id: trapping.info.durations
  system: trapping
  type: info
  title: Which trap time to pick
  text: '{set}: {best} fits your return'
  values:
    exp: 'Most EXP per hour: {row}'
    critters: 'Most critters per hour: {row}'
    shiny: 'Best shiny odds per hour: {row}'
    shinyRow: '{set} {time} gives x{mult} shiny but only x1 EXP'
  why: Each trap set has fixed times. Short traps pay more per hour, so if you will collect soon, use the short
    one; overnight, the longest that ends before you are back.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'IdleOn Toolbox game data: traps (trapTime, quantity, EXP/shiny column, flag per trap set)'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Trapping
    title: 'IdleOn Wiki: Trapping'
    tier: 2
