    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/cauldrons.json
    title: 'IdleOn Toolbox game data: Call Me Ash ("+1 Placeable Trap ALWAYS, even when this isn''t equipped")'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Trapping
    title: 'IdleOn Wiki: Trapping'
    tier: 2
    claimDate: '2026-10-07'
    verified: '2026-10-19'
    gameVersion: 2.3.540
  appliesTo:
    stages: all
  confidence: M
  status: draft
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: trapping/free-slots
  notes: 'M3 FR-21 branch (i). Count rule (set ID + Call Me Ash) is N.js (dossier C4, C5, M): research/w3-systems:
    worship-trapping-death-note.md (N.js v1.23 reading of NumOfTrapsPlaceable, verified 2026-10-17, not re-checked
    on 2.3.540). Upgrade to H once the count is checked in game. M26 W3 synth (from maps/trapping.json).'
- id: trapping.check.call-me-ash
  system: trapping
  type: check
  title: Level Call Me Ash once
  text: 'Level Call Me Ash to 1: +1 trap on {chars:int} characters'
  why: Its first level adds one placeable trap to every character, even when the bubble isn't equipped. It costs
    Tundra Logs and Nitrogen.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/cauldrons.json
    title: 'IdleOn Toolbox game data: Call Me Ash ("+1 Placeable Trap ALWAYS, even when this isn''t equipped")'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Trapping
    title: 'IdleOn Wiki: Trapping'
    tier: 2
    claimDate: '2026-10-07'
    verified: '2026-10-19'
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W3-early
      to: W4-entry
  confidence: M
  status: draft
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: trapping/call-me-ash
  doneWhen:
    field: account.alchemy.bubbleLevels.quicc.11
    change: higher
  notes: Bubble text is tier 1 (H); that one level is enough is the N.js count rule (M). Cross-link alchemy-bubbles.json
    "Big bubbles for parallel roles". M26 W3 synth (from maps/trapping.json).
