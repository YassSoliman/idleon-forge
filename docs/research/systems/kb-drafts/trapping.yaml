- id: trapping.check.shiny-snitch
  system: trapping
  type: check
  title: Shiny Snitch is on
  text: Shiny Snitch divides shiny odds on your {who}'s traps
  why: Shiny Snitch makes shinies come in bundles but divides the chance to get one. Keep it only for traps where
    the bundle is worth more than the lost chance.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/traps.ts#L178-L264
    title: IdleOn Toolbox, getShinyChance / getShinyChanceInfo (Shiny Snitch divider and bundle)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'IdleOn Toolbox game data: prayers[3] Shiny Snitch'
