entries:
- id: trapping.check.free-slots
  system: trapping
  type: check
  title: Empty trap slots
  text: 'Place {free:int} more traps: {placed:int} of {capacity:int} out'
  groupText: Place traps in your empty trap slots
  values:
    timelineKind: timer
    timelineWhat: traps
  why: Each character places as many traps as its trap set allows, plus one with Call Me Ash. An empty slot catches
    nothing while you are away.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
