# M26 elite-class Builds (tab 4): Divine Knight, Blood Berserker, Siege Breaker, Beast Master, Elemental Sorcerer, Bubonic Conjuror, Voidwalker.
# Research note: docs/research/systems/classes/elite-builds.md (claims register, per-class sources and confidence).
# Target file: packages/knowledge/systems/talents.yaml (append). status: draft. Generated from the Toolbox community builds API
# snapshot of 2026-10-19 (127 builds) and talents.json at Toolbox 6c37e3d (game 2.3.540); every rawName is checked against the
# tab it sits on (classPromotions.json talentTabs).
#
# Before promotion this needs (see the note, "Converter and engine requirements"):
#   - schema: BuildEntry tabs[].tab accepts 4 and 5; status draft (M26 FR-1); stages W4-mid / W4-late (FR-3).
#   - engine: lineOf() returns the elite or master class when a Build exists for it (today it walks up to the subclass and
#     returns null for the Journeyman line); rawName -> skillIndex resolved within the character's own tabs
#     (SYMBOLS_OF_BEYOND_~R/~G/~P and THE_FAMILY_GUY repeat across elite tabs).
#   - Draft-only keys the converter maps or drops: stageHint (the world a Build or step applies from: W5, W6, W7; no W5+
#     stage may be named yet, FR-3), sourceCount (independent dated authors), confidenceLabel (owner source bar,
#     2026-10-19: "one source" ships with a label), supersedes, inherits (master-class Builds hold tab 5 only and take
#     tabs 1-4 from the named Build), patch (third-class Builds extended past W4-entry).
# Owner source bar (2026-10-19): most upvoted or most recent post-patch community build wins; one strong source is enough
# with a label; disagreements keep the most upvoted recent one and note the other. No community source states a game
# version, so gameVersion is the version each claim was checked against (2.3.540).
