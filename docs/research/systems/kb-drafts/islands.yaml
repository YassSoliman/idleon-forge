- id: islands.check.crystal
  system: islands
  type: check
  title: Visit Crystal Island
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 120
  detector:
    id: islands/crystal
  text: '{text}'
  why: '{why}'
  values:
    text: 'Visit Crystal Island: {mobs:int} giant crystal mobs waiting ({days:int}/14 days)'
    text-capped: 'Visit Crystal Island now: it is capped at 14 days, only {mobs:int} mobs spawn'
    why: Days stop counting at 14 and a capped island spawns fewer mobs (15) than 13 days does (27). The mobs drop Time Candy
      and lots of class EXP.
  usesExpectedReturn: true
  priority:
    frame: by-urgency
  notes: Rule = Toolbox crystalIsland alert (default 13 days) plus our Crystal-unlocked guard. Projection with resetsSinceSave;
    extra = usesExpectedReturn + priority by-urgency.
  doneWhen:
    field: account.islands.crystal.unclaimedDays
    change: lower
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/islands.ts#L57-L66
