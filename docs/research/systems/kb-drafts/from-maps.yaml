    system: achievements
    type: goal
    title: Next Achievement task tier
    text: Complete {left:int} more {world} achievements for the next Achievement task tier
    why: 'The world''s Achievement task pays at {next:int} completed; you have {count:int}. Its last tier (70) can''t be reached:
      no world has 70 achievements.'
