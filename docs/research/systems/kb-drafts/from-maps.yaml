maps:
  achievements:
  - id: achievements.check.exact-stack
    system: achievements
    type: check
    title: Split a stack for an achievement
    subject: account
    effect: next-action
    category: spendable
    priority:
      frame: by-urgency
    effortSeconds: 60
    detector:
      id: achievements/exact-stack
    text: Split your {item} to a stack of exactly {n:int} in the Storage Chest
    why: '{name} completes when a chest stack holds exactly {n:int} {item}, and you hold {held:int}. It gives {reward}.'
    doneWhen:
      field: account.achievements.totalCompleted
      change: higher
    appliesTo:
      stages:
      - from: W1-early
        to: W4-entry
    confidence: M
    status: draft
    notes: Dossier M20, C33 (data H) and C14 (wiki split-stack tip, tier 3, M). Requirement parsed from desc; 25 W1-W4 entries;
      idx 179 (HONK chest) excluded. Stack detection reads per-slot amounts (account.storageStacks), M until a contract test
      confirms Toolbox keeps slots separate.
    sources:
    - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/achievements.json
      title: Toolbox achievements data (quantity, rewards, gems, candy, steamExclusive, steamIndex, secretAchievement)
      tier: 1
      verified: '2026-10-19'
      gameVersion: 2.3.540
    - url: https://idleon.wiki/wiki/Achievements
      title: 'IdleOn Wiki: Achievements (exact-stack entries: split the stack)'
      tier: 3
      claimDate: '2026-10-03'
      verified: '2026-10-19'
      gameVersion: 2.3.540
