# M26 KB drafts for System weekly-battles (area W2 synthesis, verified 2026-10-19, Toolbox 6c37e3d, game 2.3.540).
# Copied from scratchpad/m26/maps: weekly-battles.json.
# status: draft is a workflow marker; the KB schema accepts active|contested|retired only.
# entries = new entries; amendments = changes to entries already in packages/knowledge/systems (fields shown are the changed keys);
# facts = new fact rows (land in <system>.facts.yaml).
system: weekly-battles
status: draft
entries:
- id: weekly-battles.goal.difficulty
  system: weekly-battles
  type: goal
  title: Beat all 5 Weekly Battle difficulties
  text: Reach difficulty {next:int} of 5 in this week's Weekly Battle
  why: Each new best difficulty in a server week pays trophies (6, 7, 7, 7, 8), and Boss Battle Spillover's drop rate is multiplied
    by the difficulties beaten this week.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L627
    title: IdleOn Toolbox weekly boss alerts (OLA[189] trophy not maxed, OLA[190] daily raid available)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Weekly_Battles
    title: 'IdleOn Wiki: Weekly Battles'
    tier: 2
    claimDate: 2026-10-07
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L2388
    title: IdleOn Toolbox BOSS_BATTLE_SPILLOVER x OLA[189]
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Game data equinoxChallenges[6]: defeat all 5 difficulties -> +3 Max LV Liquidvestment'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  scope: account
  category: compounding
  unit: difficulties
  progress:
    id: weekly-battles/difficulty
  milestones:
  - at: 1
    reward: 6 trophies
  - at: 2
    reward: 7 trophies
  - at: 3
    reward: 7 trophies
  - at: 4
    reward: 7 trophies
  - at: 5
    reward: 8 trophies; first time also completes Equinox cloud 6 (+3 Max LV Liquidvestment)
  notes: 'Trophy amounts are wiki only (M; matches the prior N.js decode). Resets each server week (Thursday 00:00 UTC); progress
    = OLA[189] when the save''s server week is this week, else 0. W2-early is excluded: with 1-3 characters difficulty 5 is
    out of reach (C20, M).'
- id: weekly-battles.check.daily-attempt
  system: weekly-battles
  type: check
  title: Use today's Weekly Battle attempt
  text: 'Fight the Weekly Battle again today (best this week: {best:int} of 5)'
  why: The raid re-opens at every daily reset; a run that beats a higher difficulty pays its trophies, and each Equinox trophy
    cloud adds +1 trophy per boss kill.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/dashboard/account.js#L627
    title: IdleOn Toolbox weekly boss alerts (OLA[189] trophy not maxed, OLA[190] daily raid available)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-weekly-battle-guide/
    title: Idleon Weekly Battle guide (community; its prices are pre-patch)
    tier: 3
    claimDate: 2026-01-20
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/equinox.ts
    title: IdleOn Toolbox equinox challenges (WeeklyBoss.d_<n>, -1 = done)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  subject: account
  effect: next-action
  category: nice
  activePlay:
    minutes: 1
  effortSeconds: 60
  detector:
    id: weekly-battles/daily-attempt
  notes: 'Disputed payout: the wiki pays trophies only for a NEW best difficulty (M), the community guide calls daily repeats
    the main trophy source after the first clear (M). The detector therefore fires only while best < 5, or when an Equinox
    trophy cloud (1 or 11) is done (then repeat kills pay). Row, never a Goal (rides the daily clock).'
- id: weekly-battles.check.gold-pocketwatch
  system: weekly-battles
  type: check
  title: Gold Pocketwatch is in the Trophy Shop
  text: The Trophy Shop sells a Gold Pocketwatch this week (60 trophies)
  why: It shifts time forward 24 hours, so every daily reset fires again, including another Weekly Battle attempt; it only
    shows up some weeks.
  values:
    next: 'next Gold Pocketwatch in the shop: week of {date}'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/weeklyBosses.ts
    title: IdleOn Toolbox getWeeklyBoss (boss, tasks, actions, shop by server week)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Game data weeklyBossesShop: Gold Pocketwatch 60, Silver Pocketwatch 2'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-weekly-battle-guide/
    title: Idleon Weekly Battle guide (community; its prices are pre-patch)
    tier: 3
    claimDate: 2026-01-20
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  subject: account
  effect: next-action
  category: spendable
  effortSeconds: 20
  detector:
    id: weekly-battles/shop
    params:
      item: Gold_Pocketwatch
  notes: Price is game data (H; a community guide's 30 is pre-patch). Priority vs. other shop items is community (M). ActiveOn
    cannot read the trophy balance, so the line says 'sells', never 'you can afford'.
- id: weekly-battles.check.spillover-book
  system: weekly-battles
  type: check
  title: Buy the Boss Battle Spillover book
  text: Buy the Trophy Starbook in the Trophy Shop this week (25 trophies)
  why: It teaches Boss Battle Spillover, a star talent that adds drop rate for every Weekly Battle difficulty you beat each
    week; nobody on this account has it yet.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L2388
    title: IdleOn Toolbox BOSS_BATTLE_SPILLOVER x OLA[189]
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/weeklyBosses.ts
    title: IdleOn Toolbox getWeeklyBoss (boss, tasks, actions, shop by server week)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-weekly-battle-guide/
    title: Idleon Weekly Battle guide (community; its prices are pre-patch)
    tier: 3
    claimDate: 2026-01-20
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W2-mid
      to: W4-entry
  confidence: M
  status: draft
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 20
  detector:
    id: weekly-battles/shop
    params:
      item: Trophy_Starbook
      unlessTalent: BOSS_BATTLE_SPILLOVER
  notes: 'Community puts the Spillover book first (M). Game data: Trophy_Starbook and Death_Starbook both 25, random max LV
    up to 100, share TalentBook1 (H); which book teaches Spillover is from the guide only (M). Fires only when no character''s
    flatStarTalents BOSS_BATTLE_SPILLOVER maxLevel > 0.'
- id: weekly-battles.priority.trophy-shop
  system: weekly-battles
  type: priority
  title: Trophy Shop order
  text: What to buy first when it is in this week's Trophy Shop
  why: The shop shows 2 items and 2 UI skins a week, chosen by the server week; buy the lasting items first.
  values:
    row-1: Trophy_Starbook
    row-2: Gold_Pocketwatch
    row-3: Silver_Pocketwatch
    row-4: Statues
    row-5: Killroy_Skulls
    row-6: Gold_Food
    rows: 6
    skins: 'UI skins are cosmetic: skip until the rest are bought'
  sources:
  - url: https://gameslikefinder.com/article/idleon-weekly-battle-guide/
    title: Idleon Weekly Battle guide (community; its prices are pre-patch)
    tier: 3
    claimDate: 2026-01-20
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-2/weeklyBosses.ts
    title: IdleOn Toolbox getWeeklyBoss (boss, tasks, actions, shop by server week)
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
  confidence: M
  status: draft
  notes: 'Order from the community guide (tier 3, M), prices re-based to game data (Gold Pocketwatch 60, Skulls x25 14, Starbook
    25, Statues x1000 12, Gold Food x100 12, Silver 2). Killroy Skulls: spend them the same week (skulls wipe weekly, L).
    W2-early may put Statues first (guide says statues early, M).'
amendments:
- amends: weekly-battles.check.raid
  target: weekly-battles.yaml
  targetStatus: active
  status: draft
  from: weekly-battles
  fields:
    values:
      line: Run the Weekly Battle with every character (Yum Yum Desert)
      why: Each character takes one turn; a new best difficulty this week pays trophies.
      row: Run the Weekly Battle
      best: 'best this week: difficulty {best:int} of 5'
      retry: try again after your daily reset
      today-open: today's attempt is still open
      today-used: today's attempt is used; next one after the daily reset
      boss: 'this week: {boss} ({hp} HP on difficulty 1)'
    notes: 'M26 map: OLA[190] is the daily raid flag (Toolbox dashboard alert, H). The weekly done rule is unchanged; the
      daily line is display only.'
