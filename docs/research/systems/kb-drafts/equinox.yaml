- id: equinox.check.spend-bar
  system: equinox
  type: check
  title: Spend your Equinox bar
  subject: account
  effect: next-action
  usesExpectedReturn: true
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: equinox/bar-full
  text: 'Your Equinox bar is full: buy a Dream Upgrade level in the Equinox Valley'
  values:
    detail-open: 'Open upgrades below max: {list}'
    detail-dreams: 'Equinox Dreams {dreams:int}/5: each level shows one more Dream cloud'
    pill: Equinox full · spend
    pill-soon: Equinox full {fullIn:in}
    timelineKind: storage
    timelineWhat: equinox
  why: Each full bar ({required:int} charge) buys one upgrade level. At {rate:int}/h the next bar after this one
    takes {nextBar:duration}; the requirement grows with every level bought.
  notes: 'Rule: charge >= (120 + 40n) x 1.02^n, n = total upgrade levels, and at least one unlocked upgrade below
    its max (equinox.ts#L157, H). The in-game clamp at the requirement (so waiting wastes fill) comes from prior
    N.js research only, so the why does not claim it (L); the entry fires on ''full'' alone, which is H. No upgrade
    order is given: every community ordering is tier 4, L (dossier Min-max). Silent when every unlocked upgrade
    is maxed (the Idle state: only a new unlock cloud helps; equinox.goal.clouds says so). Expected Return: pass
    with nextAt = fullAt for the Timeline when not yet full. M26 W3 synth (from maps/equinox.json).'
  doneWhen:
    field: account.equinox.charge
    change: lower
  appliesTo:
    stages: all
  confidence: H
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/equinox.ts
    title: 'IdleOn Toolbox parseEquinox: charge, chargeRequired (120 + 40n) x 1.02^n, chargeRate, upgrades, challenges
      (vendored equinox.ts#L56, #L157-169, #L183-255)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Equinox
    title: 'IdleOn Wiki: Equinox (Mirror unlock, Dream Upgrades, Dream clouds)'
    tier: 2
    verified: 2026-10-19
    gameVersion: 2.3.540
- id: equinox.goal.clouds
  system: equinox
  type: goal
  title: Work on your Dream clouds
  subject: account
  effect: progress
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 300
  detector:
    id: equinox/active-clouds
  text: '{n:int} Dream clouds are open: {list}'
  values:
    item: '{label} ({current:compact}/{goal:compact}) → {reward}'
    detail-unlock: '{unlocks:int} of them open the next Dream Upgrade'
    detail-idle: Every unlocked Dream Upgrade is maxed, so only a cloud adds anything now
    detail-blocked: 'Only the first {visible:int} unfinished clouds show, in order: finishing one reveals the next'
  why: Clouds consume nothing. Each one finished unlocks an upgrade, raises fill rate, raises a max level, or gives
    a one-off bonus, and the next cloud in order appears.
  notes: 'Visibility: the first min(5, Equinox Dreams level) unfinished clouds by index are active; index >= 36
    also needs Research grid node 86 (W7) (equinox.ts, H). Progress is Toolbox''s WeeklyBoss d_<i> counter; done
    = -1. A cloud whose goal is met in another system but not yet claimed is NOT detectable from Equinox data (dossier
    rule 4, L), so the entry never says ''claim it''. Unlock clouds = 0, 2, 5, 7, 10, 13, 17, 20, 23, 28, 31, 36
    (UPGRADE_UNLOCK_CLOUDS, H). No ranking among open clouds (no tier 1-3 Source). M26 W3 synth (from maps/equinox.json).'
  doneWhen:
    field: account.equinox.completedClouds
    change: higher
  appliesTo:
    stages: all
  confidence: H
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-3/equinox.ts
