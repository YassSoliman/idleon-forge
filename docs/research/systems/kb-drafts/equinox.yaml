entries:
- id: equinox.goal.find-mirror
  system: equinox
  type: goal
  title: Get the Equinox Mirror
  subject: account
  effect: progress
  category: compounding
  priority:
    frame: by-urgency
  effortSeconds: 1800
  detector:
    id: equinox/mirror-missing
  text: Farm Bloodbone in Hell Hath Frozen Over for the Equinox Mirror
  values:
    detail-door: 'First open the map: {kills:int}/{need:int} kills on Wam Wonderland''s door'
    detail-farm: Bloodbone drops it 1 in 10; hold it to enter the Equinox Valley
  why: The Mirror opens the Equinox Valley. Equinox is an account-wide bar that fills with time and buys permanent
    Dream Upgrades (damage, Drop Rate, all talent levels).
  notes: 'Drop chance 0.1 is the game''s drop table (tier 1, H); the Equinox_Visitor achievement text still says
    ''1 in 1000'' (stale in-game text): both shown in the dossier, the drop table wins (ADR 0004). Map: Bloodbone
    is the target of map 117 Hell Hath Frozen Over (maps.facts.json), card region Frostbite Tundra; this reconciles
    the dossier''s map-name dispute (systems.facts.yaml says ''in Frostbite Tundra'', the region). Door: map 116''s
    door to 117 needs 250,000 kills (maps.facts.json), so reuse portals/kills-on-map for the progress line. Priority
    over other W3 goals is not sourced (L): the entry states the unlock, it does not rank it. M26 W3 synth (from
    maps/equinox.json).'
  doneWhen:
    field: account.equinox.mirrorObtained
    change: higher
  appliesTo:
    stages:
    - from: W3-early
      to: W4-late
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/monsterDrops.json
