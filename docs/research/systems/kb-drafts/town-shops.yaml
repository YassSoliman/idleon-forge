system: town-shops
status: draft
entries:
- id: town-shops.goal.stock-bonus
  system: town-shops
  type: goal
  title: Town shop stock bonus
  scope: account
  category: compounding
  unit: '%'
  progress:
    id: town-shops/stock-bonus
  milestones:
  - at: 20
    reward: 'Overstock Regulations bought: every daily stock x1.2'
  - at: 31.7
    reward: Vendor Stamp level 100 on top (+17.5%)
  - at: 46.3
    reward: Vendor Stamp level 300 on top (+26.3%)
  text: Town shop stock +{bonus:pct} · Overstock {overstock} · Vendor Stamp L{vendorLevel:int} (+{vendorPct:pct})
  why: Every town shop's daily stock is base x (1 + Overstock 20% + Vendor Stamp %). Both are one-time or permanent, and they
    lift every later day's stamps, stones, fragments and food.
  values:
    unknownText: 'Town shop stock bonus: can''t tell right now'
    later: Sneaky Stealing (+25%) is a secret achievement in the W5 town; it comes later.
  appliesTo:
    stages: all
  confidence: H
  status: draft
  notes: 'M26 save check: both private test saves match round(base x (1 + 0.20 + 35L/(100+L)/100)) on every W1-W4 item (e.g.
    750 -> 900 with Overstock only; 750 -> 924 with Overstock + Vendor L10; 25000 -> 30795), so the two bonuses ADD; a product
    (x1.2 x 1.0318) would give 929 and is ruled out. Sneaky Stealing is assumed additive too (no save has it) and is outside
    W1-W4 (W5 town), so it is shown, never counted toward a W1-W4 milestone.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/stamps.json#L2617-L2632
    title: 'Toolbox game data: Vendor Stamp ShopQty decay 35/100'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json#L1986-L1992
    title: 'Toolbox game data: Overstock Regulations bribe, ShopQtyPct 20'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Vendors
    title: 'IdleOn Wiki: Vendors (daily stock raised by Overstock, Vendor Stamp, Sneaky Stealing)'
    tier: 2
    claimDate: 2026-10-12
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Smolderin%27_Plateau_Achievements
    title: 'IdleOn Wiki: Sneaky Stealing, walk to the left of the W5 Shop mole'
    tier: 2
    claimDate: 2025-04-04
    verified: 2026-10-19
    gameVersion: 2.3.540
    note: Edited before 2.3.540 (Stale-risk); the reward text matches achievements.json TaskAchE27.
  fromTopic: town-shops
- id: town-shops.check.reset-fragments
  system: town-shops
  type: check
  title: Buy Talent Point Reset Fragments
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: town-shops/reset-fragments
  text: 'Buy {count:int} Talent Point Reset Fragments in {towns}: {price:coins}'
  why: A preset reset is waiting and you hold no potion and {fragments:int} fragments; 10 fragments make a potion. The towns
    sell {perDay:int} a day at 800 copper each, and unbought stock doesn't carry over.
  doneWhen:
    field: account.resetItems.fragments
    change: higher
  appliesTo:
    stages: all
    levels:
      min: 15
  confidence: M
  status: draft
  notes: 'Fires only when builds/reset-candidate has a candidate, resetItems.potions = 0 and fragments < 10, and a reached
    town has fragments in stock today. Never a standing daily chore (no Source says to stockpile). Confidence M: price and
    stock are tier 1/2; that buying them pays rests on talent-resets.check.reset (L) firing first.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: 'Toolbox game data: ResetFrag (sellPrice 200; 10 fragments make 1 potion)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: town shops (ResetFrag in keys 0-4)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Vendors
    title: 'IdleOn Wiki: Vendors (fragment stock 1/1/2/1/3, price 8 silver)'
    tier: 2
    claimDate: 2026-10-12
    verified: 2026-10-19
    gameVersion: 2.3.540
