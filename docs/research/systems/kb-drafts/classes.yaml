# from maps/class-bowman.json
- id: classes.check.cast-buffs
  system: classes
  type: check
  title: Cast your buffs before you leave
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 15
  detector:
    id: classes/cast-buffs
  text: Cast {missing} before you leave
  why: Strafe and Extendo Rangeo only add move speed and accuracy while they are active, and the AFK numbers use what was active when you left.
  values:
    why-strafe: Strafe adds {speedLoss:pct} move speed only while it is active.
    goal: Talents
  doneWhen:
    field: characters[].activeBuffs
    change: contains
  appliesTo:
    stages:
    - from: W1-early
      to: W4-entry
    classes:
    - Archer
    - Bowman
    - Siege_Breaker
  confidence: M
  status: draft
  notes: 'Toolbox counts the buffs only from activeBuffs (H). That the game keeps the logout buff for the whole AFK session is the community reading ("activate Strafe and Extendo before AFK", C38/C40, M) and not traced in game code: confidence M. Pirate Flag joins the list for a Siege Breaker only once Q3 is resolved. Not a blocker: the loss is a few % of speed or accuracy. CL note: class-hunter map records that Strafe has no AFK effect (C15 H); the check is about Strafe move speed for Speedna/active play and Extendo accuracy, not AFK damage. Confirm logout buff persistence (open question) before shipping.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L3197
    title: 'Toolbox getPlayerSpeedBonus: Strafe counts only if active'
