entries:
- id: classes.check.lowest-level-tie
  system: classes
  type: check
  status: draft
  title: Lowest level is tied
  subject: account
  effect: next-action
  category: compounding
  effortSeconds: 300
  detector:
    id: classes/lowest-level
    params:
      part: tie
  text: '{a} and {b} are both Lv {level:int}: neither gets the lowest-level Class EXP bonus'
  why: The Merit Shop lowest-level bonus (+{pct:int}% at merit level {merit:int}) goes only to a character strictly below
    every other; a tie gives it to nobody.
  values:
    detail-fix: One level on either character gives the other the bonus
  doneWhen:
    field: characters[*].level
    change: higher
  appliesTo:
    stages: all
  confidence: H
  notes: Fires only when merit level > 0 (account.merits w1 row 2) and two or more characters share the minimum level. pct
    = Toolbox's 3 x merit (ADR 0005); the why also flags game data 4 x merit via the disputed note in the picture. Common
    mistake from the dossier (C10).
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L1927-L1942
    title: 'Toolbox getClassExpMulti: lowest-level merit bonus needs the merit bought and a level strictly below every other
      character (tie gets nothing); 3 x merit level'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: merits[0][2] (lowest-leveled character EXP, totalLevels 12, bonusPerLevel 4)'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Game_Mechanics_AFK
    title: 'IdleOn Wiki: Game Mechanics AFK, Class EXP (Merit Shop +48% for the lowest character; outdated flag)'
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
    note: Page carries an outdated flag; agrees with game data 4 per level, disagrees with Toolbox code 3 per level.
  fromTopic: class-exp
- id: classes.check.lowest-level-idle
  system: classes
  type: check
  status: draft
  title: Lowest-level character isn't fighting
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 60
  detector:
    id: classes/lowest-level
    params:
      part: not-fighting
  text: '{who} gets the +{pct:int}% lowest-level Class EXP bonus but is {activity}'
  why: Class EXP comes from kills x your EXP multiplier; the lowest-level bonus only pays while that character fights.
  values:
    detail-disputed: Toolbox counts 3% per merit level; the game's data says 4%
  doneWhen:
    field: characters[*].afkType
    change: any
  appliesTo:
    stages: all
  confidence: M
  notes: Condition is H (C10). 'Only pays while fighting' rests on the M4 spec rule that only fighters earn Class EXP AFK
    (purpose.ts#L165) and the dossier's per-session action (a) (derived, M). A skiller may be deliberately skilling; this
    is a Check, not a blocker, and is silent when merit level is 0 or the lowest level is tied.
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L1927-L1942
    title: 'Toolbox getClassExpMulti: lowest-level merit bonus needs the merit bought and a level strictly below every other
      character (tie gets nothing); 3 x merit level'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/shared-data.json
    title: 'Toolbox game data: merits[0][2] (lowest-leveled character EXP, totalLevels 12, bonusPerLevel 4)'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Game_Mechanics_AFK
    title: 'IdleOn Wiki: Game Mechanics AFK, Class EXP (Merit Shop +48% for the lowest character; outdated flag)'
    tier: 4
    verified: '2026-10-19'
    gameVersion: 2.3.540
    note: Page carries an outdated flag; agrees with game data 4 per level, disagrees with Toolbox code 3 per level.
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L1909
    title: 'Toolbox getClassExpMulti: kill EXP x multiplier'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  fromTopic: class-exp
- id: classes.check.speedna-step
  system: classes
  type: check
  title: Close to the next Speedna step
  subject: character
  effect: next-action
  category: nice
  priority:
    frame: by-urgency
  effortSeconds: 300
  detector:
    id: classes/speedna-step
    params:
      maxGap: 3
      stepPct: 15
  text: '{character}: {gap:int}% more move speed reaches Speedna step {next:int} (now {speed:int}%, {steps:int} steps)'
  why: 'Speedna adds its bonus once per full 15% of move speed above 100%, rounded down: steps start at 116%, 130%, 145%.
    Exactly 115% gives nothing.'
  values:
    strafeText: With Strafe active it reaches {strafeSteps:int} steps
  appliesTo:
    stages:
    - from: W1-mid
      to: W4-entry
  confidence: M
  status: draft
  notes: 'contradictions-2 verdict 4: ladder H by JS float arithmetic (floor(min(ms/100-1,10)/0.15)); in-game float order
    M. Only for Speedna level > 0 on the evaluated (fighting) preset. Per-X group: never call it a standalone multiplier.'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts#L729-L734
    title: 'Toolbox Speedna: talent x floor(min(speed bonus, 10)/0.15)'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/character.ts#L3192-L3222
    title: 'Toolbox getPlayerSpeedBonus: move-speed pipeline and 175%/200% caps'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://builds.idleontoolbox.workers.dev/api/builds/AzC7Pk
    title: 'Community Bowman build: 130% move speed, ideally 145%'
    tier: 3
    verified: 2026-10-19
    gameVersion: 2.3.540
    claimDate: 2026-08-05
  fromTopic: contradictions-2
