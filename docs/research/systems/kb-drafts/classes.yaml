- id: classes.check.precision-power-idle
  system: classes
  type: check
  title: Precision Power is idle
  subject: character
  effect: next-action
  category: compounding
  effortSeconds: 120
  detector:
    id: classes/precision-power
  text: 'Precision Power adds nothing on {target}: accuracy {accuracy:int} of {need:int}'
  why: Precision Power only adds damage when your accuracy is at least 2.25 times the monster's Defence (1.5 times what 100% hit chance needs). Below that its {level:int} levels add 0.
  values:
    text-short: Precision Power needs {gap:int} more accuracy on {target}
    goal: Talents
  doneWhen:
    field: characters[].squireKit.precisionPower.active
    becomes: true
  appliesTo:
    stages:
    - from: W2-early
      to: W4-entry
    classes:
    - Squire
    - Divine_Knight
  confidence: H
  status: draft
  notes: 'Fires for a character whose AFK Target is FIGHTING, whose ACTIVE preset has PRECISION_POWER level > 0, and whose accuracy (getMaxDamage.accuracy) < 2.25 x monsters[targetMonster].Defence. need = ceil(2.25 x Defence). States the fact only: no respec advice (a reset trade-off has no Source above L). Pairs with the accuracyShort build condition (Book of the Wise).'
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/damage.ts#L705-L708
    title: 'Toolbox getMaxDamage: Precision Power applies only when accuracy >= Defence x 2.25'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/talents.json
    title: 'Toolbox game data: PRECISION_POWER (decay 11/80, per Refinery rank)'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/utility/hit-chance.mjs
    title: 'Toolbox hit chance: 100% at 1.5 x Defence on a Monster'
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: https://idleon.wiki/wiki/Squire
    title: 'IdleOn Wiki: Squire (Precision Power needs accuracy 1.5x higher than needed for 100% hit chance)'
    tier: 3
    verified: '2026-10-19'
    gameVersion: 2.3.540
    claimDate: '2026-09-03'

