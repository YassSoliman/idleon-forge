- id: cooking.priority.meals
  system: cooking
  type: priority
  title: Meal order
  text: Cook and level the meals that speed up cooking first
  why: Cooking speed multiplies every later meal, so the speed meals pay back first.
  list: order
  values:
    row-1: Egg
    why-1: +5% meal cooking speed per level
    row-2: Corndog
    why-2: +12% meal cooking speed per level
    row-3: Pie
    why-3: +5% recipe speed per level, finds meals faster
    row-4: Turkey_of_Thank
    why-4: +2% total damage per level
    row-5: '*'
    why-5: every other discovered meal, cheapest next level first
    rows: 5
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: L
  status: draft
  ship: display-only
  shipReason: 'Red team P1: our own order with gist support (L).'
  notes: Ours from the multiplier structure (dossier Min-max Early W4 (2), M) with gist support (L). Stat values from cookingMenu (H).
  sources:
