    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L147-L176"
    title: Toolbox getCookingEff
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://idleon.wiki/wiki/Cooking_Ladle"
    title: "IdleOn Wiki: Cooking Ladle (+1 h to every kitchen per ladle, whole stack)"
    tier: 2
    verified: '2026-10-19'
