system: cooking
entries:
- id: cooking.check.idle-kitchen
  system: cooking
  type: check
  title: Start your idle kitchen
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: cooking/idle-kitchen
  text: "Kitchen {kitchen:int} is idle: start {what}"
  values:
    what-meal: "a meal (your fastest to level is {meal})"
    what-recipe: "a recipe with {spice} alone"
  why: An idle kitchen makes nothing, and kitchens cook all day while you are away. Every meal level is a permanent bonus for the whole account.
  doneWhen:
    field: account.cooking.kitchens[].status
    change: other
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: Fires only when an owned kitchen is idle AND the account has a discovered meal or a held spice (otherwise the Cooking page frame already says 'get your first spice'). Dossier A1, per-session action
    (3).
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L731-L740"
    title: "Toolbox parseKitchens: status 1 idle, 2 cooking, 3 recipe"
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L1070-L1072"
    title: "Toolbox getTotalMealSpeed: only cooking kitchens add speed"
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://idleon.wiki/wiki/Cooking"
    title: "IdleOn Wiki: Cooking"
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
    notes: max-level list (160) is pre-v1.23; mechanics only
- id: cooking.check.level-meal
  system: cooking
  type: check
  title: Level your ready meals
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: cooking/level-meal
  text: "Level {meal} to {to:int} on the Dinner Menu{more}"
  values:
    more: " (and {n:int} more meals are ready)"
  why: You hold the copies its next level costs. Copies do nothing on the shelf; a level is a permanent, account-wide bonus.
  doneWhen:
    field: account.cooking.meals[].level
    change: higher
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "Rule: amount >= levelCost and level < mealMaxLevel and level >= 1. Picks the ready meal with the lowest level first (cheapest bonus). Dossier B3, Common mistake 2."
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L1047-L1062"
    title: Toolbox getMealLevelCost (levelCost per meal)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L206-L243"
    title: "Toolbox getMealBonus: level x baseStat x multipliers"
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://idleon.wiki/wiki/Cooking"
    title: "IdleOn Wiki: Cooking"
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
    notes: max-level list (160) is pre-v1.23; mechanics only
- id: cooking.check.capped-meal
  system: cooking
  type: check
  title: Move a kitchen off a maxed meal
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: cooking/capped-meal
  text: "Kitchen {kitchen:int} cooks {meal}, already at its max level {max:int}: switch it to {next}"
  why: Copies of a meal at max level have no use in World 4 except a few Lab costs, so the kitchen's time is better spent on a meal that can still level.
  doneWhen:
    field: account.cooking.kitchens[].meal
    change: other
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: H
  status: draft
  notes: "{next} = the discovered meal below max with the fewest copies to its next level per copy/h. Exception noted in the dossier (B10): Lab chips/jewels and Mob upgrades spend meal copies; the text\
    \ says 'except a few Lab costs'."
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L1031-L1045"
    title: Toolbox getMealMaxLevel
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L731-L745"
    title: Toolbox kitchen meal (foodIndex)
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: cooking.check.claim-spices
  system: cooking
  type: check
  title: Claim your spices
  subject: account
  effect: next-action
  category: spendable
  priority:
    frame: by-urgency
  effortSeconds: 45
  detector:
    id: cooking/claim-spices
  text: "Claim {amount:int} spices waiting at {territories} ({left:int} claims left today)"
  why: Spices only reach your bank when you claim them, and claims refill at the daily reset. Spices pay for every kitchen upgrade and new recipes.
  doneWhen:
    field: account.cooking.claimsToday
    change: higher
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Rule: sum(spices[].toClaim) > 0 and claimsToday < 100. Confidence M: the 100/day cap is Toolbox's, not read from the game (dossier open question 1). Earlier research (C61, L, pre-patch) says unclaimed\
    \ territories produce slower: not used in the why."
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L66-L114"
    title: Toolbox spices.toClaim and numberOfClaims (accountOptions[100])
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/parsers/world-4/cooking.ts#L1170"
    title: Toolbox claim cap 100
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://idleon.wiki/wiki/Breeding"
    title: "IdleOn Wiki: Breeding (territories forage spices)"
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: cooking.check.use-ladles
  system: cooking
  type: check
  title: Use your ladles
  subject: account
  effect: next-action
  category: nice
  priority:
    frame: by-urgency
  effortSeconds: 30
  detector:
    id: cooking/use-ladles
  text: "Use your {ladles:int} Cooking Ladles: every kitchen jumps {ladles:int} hours ahead"
  why: Each ladle in the stack pushes every kitchen 1 hour forward, and the whole stack is used at once. Best right after you load your kitchens.
  doneWhen:
    field: account.storageItems.Cooking_Ladle
    change: lower
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Rule: ladles held >= 1 and at least one kitchen is cooking. Confidence M: the effect comes from the item text (N.js, earlier research) and the wiki; Toolbox does not model it. Open question: whether\
    \ ladles also advance recipes."
  sources:
  - url: "https://idleon.wiki/wiki/Cooking_Ladle"
    title: "IdleOn Wiki: Cooking Ladle (+1 h to every kitchen per ladle, whole stack)"
    tier: 2
    verified: '2026-10-19'
    gameVersion: 2.3.540
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/quests.json"
    title: Gobo quests reward 19 ladles
    tier: 1
    verified: '2026-10-19'
    gameVersion: 2.3.540
- id: cooking.check.afk-chef
  system: cooking
  type: check
  title: Put a chef on the Kitchen
  subject: account
  effect: next-action
  category: nice
  priority:
    frame: by-urgency
  effortSeconds: 60
  detector:
    id: cooking/afk-chef
  text: "Nobody AFKs on the Kitchen: send one character there for Cooking EXP and ladles"
  why: Kitchens cook without anyone there, but Cooking EXP and the daily ladles come only to a character AFK on the Kitchen. A Blood Berserker has the talents that boost both.
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Rule: account has >= 1 discovered meal and no character's afkTarget is the Kitchen target string (pin the string from a W4 save first). Silent before any meal is discovered. Ladle-per-day formula\
    \ (C28) is L, so the text gives no number."
  sources:
  - url: "https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/talents.json"
