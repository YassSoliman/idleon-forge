- id: cooking.goal.kitchen-speed
  system: cooking
  type: goal
  title: Upgrade Speed on your cooking kitchens
  subject: account
  effect: next-action
  category: compounding
  scope: account
  detector:
    id: cooking/kitchen-speed
  text: "Upgrade Kitchen {kitchen:int} Speed {from:int} → {to:int} ({cost:int} {spice}, you hold {held:int})"
  why: Speed multiplies everything that kitchen cooks (+10% per level). Fire and Luck only help a kitchen that is looking for recipes.
  appliesTo:
    stages:
    - from: W4-entry
      to: W4-entry
  confidence: M
  status: draft
  notes: "Rule: among kitchens with status cooking, the one with the lowest speedLv whose Speed spice held >= speedCost. Speed multiplier 1 + speedLv/10 is H (C6); 'Speed before Fire/Luck on a cooking kitchen'\
    \ is ours (M). The spice-per-upgrade mapping (C66) is L: verify on a W4 save with a won territory before activating."
