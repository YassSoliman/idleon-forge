# M26 KB drafts for gear (W1 synthesis), copied from m26/maps/*.json. status: draft on every entry;
# the live schema's status enum is active|contested|retired, so promotion flips draft -> active or contested.
# Topics: smithing
system: gear
status: draft
entries:
- id: gear.check.stone-slots
  system: gear
  type: check
  title: Use your upgrade stones
  subject: character
  effect: next-action
  category: spendable
  effortSeconds: 120
  detector:
    id: gear/stone-slots
  text: 'Use {stone} on your {who}''s {item}: {free:int} upgrade slots free'
  why: '{why}'
  values:
    why-early: 'Before World 4, put stones on the piece and pass it on: it keeps its stones when it moves between
      characters.'
    why-late: From World 4, stone the piece on the character that will keep wearing it.
    detail: '{who}: {item}, {free:int} of {max:int} slots free'
  notes: Fires when storage holds a stone whose family fits the slot (Weapon -> weapon, Armor -> armour, Tool ->
    tool, Helmet -> helmet; never Mystery Z stones, which can roll a negative stat) and the worn piece is the Gear
    Plan target for this Stage (gear.fact.plan), so it won't be replaced soon. Slots are used only on success; success
    chances are not shown as promises.
  appliesTo:
    stages: all
  confidence: M
  status: draft
  sources:
  - url: https://github.com/Morta1/IdleonToolbox/blob/6c37e3dac38e3cb79f8b6b56f6968ded7614b7d1/data/website-data/items.json
    title: 'Toolbox game data: UPGRADE stones (family, Amount = success chance) and Upgrade_Slots_Left'
    tier: 1
    verified: 2026-10-19
    gameVersion: 2.3.540
  - url: https://gameslikefinder.com/article/idleon-equipment-guide/
    title: 'Idleon equipment guide: W1-W3 stone and move gear around; W4+ stone the wearer''s piece'
    tier: 3
    claimDate: 2026-07-25
    verified: 2026-10-19
    gameVersion: 2.3.540
