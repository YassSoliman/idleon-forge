<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges"><title>Small cheer: confetti burst (plays once)</title><style>svg{--r1:var(--tier-gold-1,#57390a);--r2:var(--tier-gold-2,#c07d14);--r3:var(--tier-gold-3,#f2c443);--r4:var(--tier-gold-4,#fff6cc);--q1:var(--tier-ruby-1,#5c1230);--q2:var(--tier-ruby-2,#b02a48);--q3:var(--tier-ruby-3,#e85a5a);--q4:var(--tier-ruby-4,#ffd6b8);--x1:var(--tier-plat-1,#14284f);--x2:var(--tier-plat-2,#2a78c4);--x3:var(--tier-plat-3,#62c2f5);--x4:var(--tier-plat-4,#dcf6ff);}.cd-fr{animation:cdfr 1000ms steps(1,end) 1 forwards;opacity:0}.cd-fr1{animation-delay:0ms}.cd-fr2{animation-delay:250ms}.cd-fr3{animation-delay:500ms}.cd-fr4{animation-delay:750ms}@keyframes cdfr{0%{opacity:1}25.00%{opacity:0}100%{opacity:0}}.cd-fr4{animation:cdlast 1000ms steps(1,end) 1 forwards}@keyframes cdlast{0%{opacity:0}75.00%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion:reduce){.cd-fr{animation:none;opacity:0}.cd-fr4{opacity:1}}</style><g class="cd-fr cd-fr1"><g style="fill:var(--r3)"><rect x="15" y="15" width="4" height="1"/><rect x="15" y="17" width="4" height="1"/></g><g style="fill:var(--r4)"><rect x="16" y="16" width="2" height="1"/></g></g><g class="cd-fr cd-fr2"><g style="fill:var(--q3)"><rect x="10" y="16" width="2" height="1"/><rect x="22" y="16" width="2" height="1"/><rect x="10" y="17" width="2" height="1"/><rect x="22" y="17" width="2" height="1"/><rect x="20" y="20" width="2" height="1"/><rect x="20" y="21" width="2" height="1"/></g><g style="fill:var(--r3)"><rect x="16" y="10" width="2" height="1"/><rect x="16" y="11" width="2" height="1"/><rect x="20" y="12" width="2" height="1"/><rect x="20" y="13" width="2" height="1"/><rect x="12" y="20" width="2" height="1"/><rect x="12" y="21" width="2" height="1"/></g><g style="fill:var(--x3)"><rect x="12" y="12" width="2" height="1"/><rect x="12" y="13" width="2" height="1"/><rect x="16" y="22" width="2" height="1"/><rect x="16" y="23" width="2" height="1"/></g